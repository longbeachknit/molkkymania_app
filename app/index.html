/* =========================================================================
   交流戦の参加申請（8-6 / 1-4 で追加）

   これまで交流戦は「負けたら自動的に参加」だったが、
   今回から「対象の人のうち、出たい人だけが申し込む」形にした。

   流れ
     ① 対戦表の「モルック管理」→「交流戦の受付を開始する」を押す
        → GitHub に {大会コード}_exhibition.json（open:true）が置かれる
     ② アプリのホームに「交流戦 参加申請」ボタンが出る
        （大会設定で「申請フォームを作る」にしてある大会だけ）
     ③ 参加者が チーム → 交流戦①/② を選んで「参加を申請する」
        → 対戦表の「【運営用】交流戦参加確認」シートに「参加」と書き込まれる
     ④ 受付を終了すると、アプリのボタンは消える
   ========================================================================= */

// 大会設定の交流戦のところを、抜けがない形に整えて返す
function exhOf(tour){
  const e=(tour&&tour.exhibition)||{};
  const NUM=['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];
  let n=parseInt(e.count,10);
  if(!(n>=0))n=0;
  if(n>9)n=9;
  const games=[];
  for(let i=0;i<n;i++){
    const g=(e.games&&e.games[i])||{};
    games.push({name:String(g.name||('交流戦'+NUM[i])),desc:String(g.desc||'')});
  }
  return {enabled:e.enabled===true,count:n,games:games};
}

/* =========================================================================
   交流戦の「何時から何時か」を、配信済みのタイムスケジュールから拾う
   （案B／2026-10-05 追加）

   考え方
     時間を入れる欄をどこかに新しく作るのではなく、
     すでに配信している {大会コード}_info.json の中の
     タイムスケジュール（区分／時間）から、名前で探して持ってくる。
     だから対戦表側の作業は増えない。時間がずれたら、これまでどおり
     「大会概要（レギュレーション・タイムスケジュール最新版）」の
     時間セルを直せばよい（直した時点で自動配信される）。

   探し方（ここが大事）
     「交流戦①」と完全に同じ区分名だけを探すのではなく、
     区分名の中に「交流戦①」が含まれていれば当たりとする。
       例）「Bトーナメントのあとに交流戦①」 → 当たり
     さらに、書き方のゆれも吸収する。
       ・空白（半角・全角）は無視
       ・全角の英数字は半角として扱う
       ・「①」と「1」は同じものとして扱う（交流戦① ＝ 交流戦1）
       ・英字の大文字・小文字は区別しない
     時間が空っぽの行（＝見出しの帯）は時間がないので飛ばす。
     当たりが複数あったら、いちばん上の行（＝早い時間）を使う。

   見つからなかったとき
     何も出さない（「時間 未定」などとは出さない）。
     タイムスケジュールにまだ書かれていない、という状態なので、
     書き足せばそのまま出るようになる。
   ========================================================================= */

const EXH_SCHED_TTL = 60000;   // 一度読んだら60秒は読み直さない
const EXH_CIRCLE_   = '①②③④⑤⑥⑦⑧⑨';

// 照合用に、書き方のゆれをならす
function exhNorm_(s){
  return String(s==null?'':s)
    .replace(/[\s　]/g,'')                                   // 空白を消す
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)) // 全角英数→半角
    .replace(/[①-⑨]/g,c=>String(EXH_CIRCLE_.indexOf(c)+1))       // ①→1
    .toLowerCase();
}

/* タイムスケジュールの行から、その交流戦の時間を探して返す。見つからなければ ''。 */
function exhTimeFromSchedule_(rows,gameName){
  const key=exhNorm_(gameName);
  if(!key)return '';
  const list=rows||[];
  for(let i=0;i<list.length;i++){
    const r=list[i];
    if(!r)continue;
    if(r.type==='gap'||r.type==='header')continue;   // 区切りと見出しは飛ばす
    const time=String(r.time==null?'':r.time).trim();
    if(!time)continue;                               // 時間が無い行は使えない
    if(exhNorm_(r.name).indexOf(key)>=0)return time; // 含まれていれば当たり
  }
  return '';
}

/* タイムスケジュール（_info.json）を取ってくる。

   読む道は交流戦の受付と同じ2段構え。
     ① api.github.com … 置いたその瞬間の中身が返る（速い）。1端末1時間60回まで
     ② raw.githubusercontent.com … 上限なし。ただし数分ふるいことがある
   この画面は参加者が申し込むときに開くだけで、ずっと見張ってはいないので、
   ①を使っても回数をほとんど使わない。時間のずれをすぐ反映したいので①を優先する。 */
let _exhSchedCache_={code:'',at:0,rows:null};
/* 【2026-10-26】タイムスケジュール（大会情報 info の schedule）は、ここ1か所で読む（Supabase）。
   ホームの表・現在地・交流戦の時間が、同じ読み込みを使う（60秒は読み直さない。読んでいる最中なら、その結果を待つ）。
   以前は交流戦の時間を GitHub（1時間60回までの窓口）から読み、ホームの表と現在地もそれぞれ別に読んでいた。 */
let _evSched_={code:'',at:0,rows:null,busy:null};
function fetchEventSched_(code){
  const fc=String(code||'');
  if(!fc)return Promise.resolve([]);
  if(_evSched_.code===fc&&_evSched_.rows&&(Date.now()-_evSched_.at)<60000)return Promise.resolve(_evSched_.rows);
  if(_evSched_.code===fc&&_evSched_.busy)return _evSched_.busy;
  const pr=sbFetchDoc(fc,'info').then(d=>{
    const rows=(d&&d.schedule)||[];
    _evSched_={code:fc,at:Date.now(),rows:rows,busy:null};
    return rows;
  }).catch(e=>{if(_evSched_.busy===pr)_evSched_.busy=null;throw e;});
  _evSched_={code:fc,at:_evSched_.code===fc?_evSched_.at:0,rows:_evSched_.code===fc?_evSched_.rows:null,busy:pr};
  return pr;
}
// 交流戦の時間（以前の名前のまま残す）
async function fetchExhSchedule_(code){
  try{return await fetchEventSched_(code);}catch(e){return [];}
}

/* 交流戦の画面を開いたときに、1回だけ読みにいく。
   （60秒以内に読み直すことはしない。通信を増やしすぎないため） */
let _exhSchedBusy_=false;
function maybeLoadExhSchedule(code){
  if(!code||_exhSchedBusy_)return;
  const fc=toJsonFileCode(code);
  if(S._exSchedCode===fc&&(Date.now()-(S._exSchedAt||0))<EXH_SCHED_TTL)return;
  _exhSchedBusy_=true;
  fetchExhSchedule_(code).then(rows=>{
    _exhSchedBusy_=false;
    S._exSched=rows;S._exSchedCode=fc;S._exSchedAt=Date.now();
    if(S.phase==='exhibition'||S.phase==='setup')render();
  }).catch(()=>{
    _exhSchedBusy_=false;S._exSchedCode=fc;S._exSchedAt=Date.now();
  });
}

/* いま受付中かどうかを GitHub から確かめる（★2026-10-05 変更：交流戦ごと）

   【どこから読むか】
     api.github.com から読む。「対戦表を配信」で使っているのと同じ道で、
     置いた“その瞬間”の中身がそのまま返る＝受付の開始／終了がすぐ伝わる。
     （1つの回線あたり1時間60回までという上限がある）

   【読めなかったときは「受付していない」とみなす】
     以前は、読めなかったとき raw.githubusercontent.com に切り替えていた。
     こちらは上限が実質ないが、途中のキャッシュのせいで
     数分ふるい内容が返ることがある。そのため
     「本部が受付を終了したのに、その端末ではボタンが残る」
     ということが起きていた。
     終了したはずのボタンが残るほうが事故になるので、
     確かめられなかったときはボタンを出さない（受付していない扱い）に変えた。
     そのかわり画面に「確認できませんでした」と出して、
     黙って消えたように見えないようにしてある。
     ※念のため、対戦表側（GAS）でも
       「受付していない交流戦の申し込みは断る」ようにしてあるので、
       万一ボタンが残っても間違った申し込みは入らない。

   【返す形】
     { ok:確かめられたか, games:{1:true,2:false,…}, anyOpen:どれか受付中か } */
async function fetchExhibitionOpen_(code){
  const fileName=toJsonFileCode(code)+'_exhibition.json';
  /* ★2026-10-25 変更（1-5）：まず Supabase の exhibition_state を見る。
       GitHub と違って回数の上限がなく、置いた瞬間の中身が返る。
       対戦表D の GAS（2026-10-25 版〜）が、受付の開始／終了のたびにここへ書く。
       ・行がある     → それを使う（GitHub は見ない）
       ・行が無い     → まだ古い GAS の大会。下の GitHub を見る（今までどおり）
       ・通信に失敗   → 下の GitHub を見る */
  /* 【2026-10-26】Supabase の exhibition_state だけを見る（GitHub の予備の道は外した。
       対戦表の GAS が、受付の開始／終了のたびにここへ書くようになったため）。
       ・行がある → それを使う
       ・行が無い → まだ一度も受付を開始していない大会（＝受付中の交流戦なし。確かめられたので ok:true）
       ・通信に失敗 → 1回だけやり直し、だめなら「確認できませんでした」 */
  const read=async()=>{
    const res=await fetch(SB_URL+'/rest/v1/exhibition_state?event_code=eq.'+encodeURIComponent(toJsonFileCode(code))+'&select=games,times&limit=1',
      {cache:'no-store',headers:sbHeaders()});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const rows=await res.json();
    if(rows&&rows.length)return exhParseOpenJson_({games:rows[0].games||{},times:rows[0].times||{}});
    return exhParseOpenJson_(null);
  };
  try{ return await read(); }
  catch(e1){
    await new Promise(r=>setTimeout(r,500));
    try{ return await read(); }
    catch(e2){ return {ok:false,anyOpen:false,games:{},times:{},hasTimes:false}; }
  }
}

/* 届いたファイルの中身を「交流戦ごとの受付オン・オフ」に直す。
     新しい対戦表 … {open:…, games:{"1":true,"2":false}}
     古い対戦表 …… {open:true} だけ（games が入っていない）
                   → この場合は、どの交流戦も受付中として扱う（今までと同じ動き） */
function exhParseOpenJson_(d){
  const games={};
  let anyOpen=false;
  const g=(d&&d.games)||null;
  if(g&&typeof g==='object'){
    for(let i=1;i<=9;i++){
      const on=(g[i]===true||g[String(i)]===true);
      games[i]=on;
      if(on)anyOpen=true;
    }
  }else{
    const legacy=!!(d&&d.open===true);
    for(let i=1;i<=9;i++)games[i]=legacy;
    anyOpen=legacy;
  }
  /* ★2026-10-05 追加：交流戦の時間。
       新しい対戦表は times を一緒に送ってくるので、アプリは
       タイムスケジュールのファイルを別に読まなくてよい（通信1回ぶん節約）。
       古い対戦表は times が無いので、そのときだけ今までどおり自分で読む。 */
  const times={};
  const tsrc=(d&&d.times)||null;
  const hasTimes=!!(tsrc&&typeof tsrc==='object');
  if(hasTimes){
    for(let i=1;i<=9;i++){
      const v=(tsrc[i]!==undefined)?tsrc[i]:tsrc[String(i)];
      times[i]=String(v==null?'':v).trim();
    }
  }
  return {ok:true,games:games,anyOpen:anyOpen,times:times,hasTimes:hasTimes};
}

/* その交流戦（0から数えた番号）の時間を返す。
     新しい対戦表 … 受付オン・オフのファイルに一緒に届いている（通信ゼロ）
     古い対戦表 …… 届かないので、タイムスケジュールのファイルから自分で探す */
function exhTimeOf_(i,name){
  if(S._exhHasTimes===true){
    // ※ null>=0 は JavaScript では true になってしまうので、数字かどうかから見る
    if(typeof i!=='number'||!isFinite(i)||i<0)return '';
    const t=(S._exhTimes||{})[i+1];
    return String(t==null?'':t).trim();
  }
  return exhTimeFromSchedule_(S._exSched,name);
}

/* その交流戦（0から数えた番号）が、いま受付中かどうか。
   まだ受付状況を確かめられていないときは false（＝出さない）。 */
function exhGameIsOpen_(i){
  const g=S._exhGames;
  if(!g)return false;
  return g[i+1]===true;
}

/* いつ見にいくか（「開催中の大会」の確認と同じ考え方）
     ・ホーム画面をはじめて開いたとき
     ・ほかの画面からホームに戻ってきたとき  ← ここが実質いちばん効く
     ・ホームを開いたままのときは20秒おき（対戦表の取得と同じ間隔）
   ※通信の回数を増やしすぎないよう、上の条件以外では見にいかない。 */
let _exhOpenAt=0,_exhOpenCode='',_exhOpenBusy=false,_exhWasAway=false;
function maybeRefreshExhibitionOpen(code){
  if(!code)return;
  if(_exhOpenBusy)return;
  const first=(_exhOpenCode!==code);
  const back=_exhWasAway;
  _exhWasAway=false;
  if(!first&&!back&&(Date.now()-_exhOpenAt)<CACHE_TTL)return;
  _exhOpenBusy=true;
  fetchExhibitionOpen_(code).then(r=>{
    _exhOpenCode=code;_exhOpenAt=Date.now();_exhOpenBusy=false;
    // 前回と中身が変わったときだけ描き直す（むだに画面を作り直さない）
    const before=JSON.stringify([S._exhOpen,S._exhGames||{},S._exhUnknown===true,S._exhTimes||{}]);
    S._exhOpen=r.anyOpen;S._exhGames=r.games;S._exhUnknown=(r.ok!==true);
    S._exhTimes=r.times||{};S._exhHasTimes=(r.hasTimes===true);
    const after=JSON.stringify([S._exhOpen,S._exhGames||{},S._exhUnknown===true,S._exhTimes||{}]);
    if(before!==after&&(S.phase==='setup'||S.phase==='exhibition'))render();
  }).catch(()=>{
    _exhOpenAt=Date.now();_exhOpenBusy=false;
    S._exhGames={};S._exhOpen=false;S._exhUnknown=true;
    S._exhTimes={};S._exhHasTimes=false;
  });
}

// 申請を対戦表（GAS）へ送る。受付の送信と同じ作り。
async function submitExhibition(payload){
  const tour=activeTour()||{};
  const gasUrl=(tour.gasUrl&&tour.gasUrl.trim())||GAS_URL;
  if(!gasUrl||!gasUrl.startsWith('https://script.google.com/')){
    throw new Error('この大会の送信先が設定されていません。本部にお伝えください。');
  }
  const body=new URLSearchParams({data:JSON.stringify({
    type:'exhibition',
    eventCode:tour.eventCode||'',
    teamNo:payload.teamNo,
    teamName:payload.teamName,
    gameIndex:payload.gameIndex,   // 1始まり（1＝交流戦①）
    gameName:payload.gameName,
    at:new Date().toISOString()
  })});
  const res=await fetch(gasUrl,{method:'POST',mode:'cors',body});
  const json=await res.json();
  if(json.status!=='ok'){
    /* ★2026-10-05 追加：対戦表側で「その交流戦は受付していない」と
         断られたとき。アプリの表示がほんの少し古かったということなので、
         次にこの画面やホームを開いたときに受付状況を取り直させる。 */
    if(json&&json.closed===true){_exhOpenCode='';_exhOpenAt=0;}
    throw new Error(json.message||'送信エラー');
  }
  return json;
}

function resetExhibition(){
  S._exView='team';S._exTeamNo='';S._exTeamName='';S._exGame=null;
  S._exSubmitting=false;S._exError='';
}

// ===== 交流戦 参加申請の画面 =====
function rExhibition(){
  const tour=activeTour()||{};
  const ex=exhOf(tour);
  const v=S._exView||'team';
  // ★受付が終わっていないかを、この画面でも取り直す（時間もここで一緒に届く）
  if(ex.count>0)maybeRefreshExhibitionOpen(tour.eventCode);
  /* 古い対戦表のときだけ、時間をタイムスケジュールから自分で読む */
  if(ex.count>0&&S._exhHasTimes!==true)maybeLoadExhSchedule(tour.eventCode);
  const schedReady=(S._exhHasTimes===true)||(S._exSchedCode===toJsonFileCode(tour.eventCode||''));
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const wrap=inner=>`<div style="padding:16px;max-width:480px;margin:0 auto;">${inner}</div>`;
  const head=(title,backId)=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
      <button id="${backId}" style="padding:6px 12px;border-radius:8px;border:1.5px solid #e5e7eb;background:#f9fafb;cursor:pointer;font-size:14px;color:#374151;white-space:nowrap;">← 戻る</button>
      <div style="font-size:17px;font-weight:700;color:#111;">${title}</div>
    </div>`;

  // ── 送信できました ──
  if(v==='done'){
    const g=ex.games[S._exGame]||{name:''};
    return wrap(`
      <div style="text-align:center;padding:20px 8px 8px;">
        <div style="font-size:56px;line-height:1;margin-bottom:12px;">✅</div>
        <div style="font-size:20px;font-weight:800;color:#0a6e57;margin-bottom:8px;">送信が完了しました</div>
        <div style="font-size:14px;color:#374151;line-height:1.8;">交流戦の参加申請を受け付けました。<br>当日は本部の案内をお待ちください。</div>
      </div>
      <div style="background:#E1F5EE;border-radius:12px;padding:16px;margin:18px 0;">
        <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px;"><span style="color:#6b7280;">チーム</span><span style="font-weight:700;color:#111;">No.${esc(S._exTeamNo)}　${esc(S._exTeamName)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-top:1px solid #b7e2d2;"><span style="color:#6b7280;">申し込んだ試合</span><span style="font-weight:700;color:#111;">${esc(g.name)}</span></div>
        ${exhTimeOf_(S._exGame,g.name)?`<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-top:1px solid #b7e2d2;"><span style="color:#6b7280;">時間</span><span style="font-weight:700;color:#111;">${esc(exhTimeOf_(S._exGame,g.name))}</span></div>`:''}
      </div>
      ${ex.games.map((gg,ii)=>ii).filter(ii=>exhGameIsOpen_(ii)&&ii!==S._exGame).length
        ?`<button id="btn-ex-again" style="width:100%;padding:13px;margin-bottom:10px;border:1.5px solid #1D9E75;border-radius:10px;background:#fff;color:#0a6e57;font-size:14px;font-weight:700;cursor:pointer;">ほかの交流戦にも申し込む</button>`
        :''}
      <button id="btn-ex-home" style="width:100%;padding:15px;border:none;border-radius:12px;background:#1D9E75;color:#fff;font-size:16px;font-weight:700;cursor:pointer;">ホームに戻る</button>
    `);
  }

  // ── どの交流戦に出るかを選ぶ ──
  if(v==='game'){
    const sel=S._exGame;
    /* ★2026-10-05 変更：受付中の交流戦だけを並べる。
         data-i には「もとの番号」を入れたままにするので、
         送信するときの番号（交流戦①＝1）はずれない。 */
    const openList=ex.games.map((g,i)=>({g:g,i:i})).filter(x=>exhGameIsOpen_(x.i));
    const cards=openList.map(({g,i})=>{
      const on=sel===i;
      // ★この交流戦が何時からか（届いていればそれを、無ければ自分で探した結果）
      const gTime=exhTimeOf_(i,g.name);
      return`<button class="ex-game" data-i="${i}" style="width:100%;text-align:left;padding:16px;margin-bottom:12px;border:2px solid ${on?'#1D9E75':'#e5e7eb'};border-radius:12px;background:${on?'#E1F5EE':'#fff'};cursor:pointer;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="width:22px;height:22px;border-radius:11px;border:2px solid ${on?'#1D9E75':'#d1d5db'};background:${on?'#1D9E75':'#fff'};flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:900;">${on?'✓':''}</span>
          <span style="font-size:16px;font-weight:800;color:#111;">${esc(g.name)}</span>
        </div>
        ${gTime
          ?`<div style="font-size:13px;font-weight:700;color:#0a6e57;margin:8px 0 0 32px;">🕐 ${esc(gTime)}</div>`
          :(schedReady?'':`<div style="font-size:12px;color:#9ca3af;margin:8px 0 0 32px;">🕐 時間を確認中...</div>`)}
        ${g.desc?`<div style="font-size:13px;color:#4b5563;line-height:1.7;margin:8px 0 0 32px;white-space:pre-wrap;">${esc(g.desc)}</div>`:''}
      </button>`;
    }).join('');
    return wrap(head('交流戦 参加申請','btn-ex-back-team')+`
      <div style="background:#f9fafb;border-radius:10px;padding:10px 12px;margin-bottom:16px;font-size:13px;color:#374151;">
        申し込むチーム：<b>No.${esc(S._exTeamNo)}　${esc(S._exTeamName)}</b>
      </div>
      <div style="font-size:14px;font-weight:700;color:#111;margin-bottom:10px;">出たい交流戦を選んでください</div>
      ${cards||`<div style="font-size:13px;color:#9ca3af;padding:12px 0;line-height:1.8;">${ex.games.length?'いま受付中の交流戦はありません。<br>本部の案内をお待ちください。':'交流戦が設定されていません。'}</div>`}
      ${S._exError?`<div style="padding:12px;background:#fee2e2;border-radius:10px;color:#dc2626;font-size:13px;line-height:1.7;margin-bottom:12px;">${esc(S._exError)}</div>`:''}
      <button id="btn-ex-submit" ${(sel==null||S._exSubmitting)?'disabled':''} style="width:100%;padding:16px;border:none;border-radius:12px;background:${(sel==null||S._exSubmitting)?'#d1d5db':'#1D9E75'};color:#fff;font-size:17px;font-weight:800;cursor:${(sel==null||S._exSubmitting)?'default':'pointer'};">${S._exSubmitting?'送信中...':'参加を申請する'}</button>
      <div style="font-size:11px;color:#9ca3af;text-align:center;margin-top:10px;line-height:1.7;">送信が対戦表に書き込まれたことを確認してから、完了画面が出ます。<br>両方に出たい場合は、送信後にもう一度申し込めます。</div>
    `);
  }

  // ── 自分のチームを選ぶ ──
  const teams=(tour.teams||[]).slice().sort((a,b)=>parseInt(a.id,10)-parseInt(b.id,10));
  const cur=String(S._exTeamNo||'');
  return wrap(head('交流戦 参加申請','btn-ex-home2')+`
    <div style="font-size:13px;color:#6b7280;line-height:1.8;margin-bottom:16px;">交流戦は<b>出たいチームだけ</b>が参加します。<br>まず、申し込むチームを選んでください。</div>
    ${teams.length
      ?`<select id="ex-team" style="width:100%;padding:12px;border:1.5px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff;">
          <option value="">-- チームを選択 --</option>
          ${teams.map(t=>`<option value="${esc(t.id)}" ${cur===String(t.id)?'selected':''}>No.${esc(t.id)}　${esc(t.name||'')}</option>`).join('')}
        </select>`
      :`<div style="font-size:13px;color:#9ca3af;padding:12px 0;">参加チームがまだ登録されていません。</div>`}
    <button id="btn-ex-next" ${cur?'':'disabled'} style="width:100%;padding:15px;margin-top:16px;border:none;border-radius:12px;background:${cur?'#1D9E75':'#d1d5db'};color:#fff;font-size:16px;font-weight:700;cursor:${cur?'pointer':'default'};">次へ →</button>
  `);
}

// ===== 大会受付：レイアウト共通ヘッダ =====
function rcpHeader(title,backPhase){
  return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
    <button class="btn btn-gray btn-sm" id="btn-rcp-back" data-back="${backPhase||''}">← 戻る</button>
    <div style="font-size:18px;font-weight:700;color:#111;">${title}</div>
  </div>`;
}
// 選択肢カード（2択）
function rcpChoice(name,value,selected,label,color){
  const on=selected===value;
  const c=color||'#1D9E75';
  /* 選ばれたときの「中の色」は、ふちの色に合った薄い色にする。
     以前は「#1D9E75 以外はすべて赤系」という判定だったため、
     緑の #2E8B57（「いない」「希望しない」）に赤系の背景が付いてしまい、
     ふちは緑・中はオレンジという色の反転が起きていた。 */
  const fill={'#1D9E75':'#E1F5EE','#2E8B57':'#E8F4EC','#E24B4A':'#FEF3F2'}[c]||'#F3F4F6';
  return`<button class="rcp-choice" data-name="${name}" data-value="${value}" style="width:100%;padding:18px 16px;margin-bottom:12px;border:2px solid ${on?c:'#e5e7eb'};border-radius:12px;background:${on?fill:'#fff'};color:#111;font-size:16px;font-weight:700;cursor:pointer;text-align:center;">${label}</button>`;
}
function rcpNextBtn(disabled){
  return`<button class="btn btn-green" id="btn-rcp-next" ${disabled?'disabled':''} style="width:100%;padding:15px;font-size:16px;font-weight:700;margin-top:8px;">次へ →</button>`;
}
function rcpProgress(step){
  /* シングルスは❶集合・❷メンバー変更が無いので、全2問として表示する。
     （❸参加経験が1問目、❹棒貸出が2問目） */
  const _sgl=isSinglesActive();
  const total=_sgl?2:4;
  if(_sgl)step=Math.max(0,step-2);
  let dots='';
  for(let i=1;i<=total;i++){
    dots+=`<div style="flex:1;height:5px;border-radius:3px;background:${i<=step?'#3FBF8F':'#e5e7eb'};"></div>`;
  }
  return`<div style="display:flex;gap:5px;margin-bottom:16px;">${dots}</div>`;
}

// ===== 受付：ログイン画面（チーム選択／No検索 ＋ パスワード） =====
function rReception(){
  const st=_rcpState;
  const tour=activeTour()||{teams:[],eventName:''};
  const teams=tour.teams||[];
  /* シングルス大会は「チーム」ではなく「選手」と呼ぶ。
     チーム名の欄＝モルックネーム、メンバー①＝本名フルネーム なので、
     一覧では「モルックネーム（本名）」の形で出して本人が選びやすくする。 */
  const _sgl=isSinglesTour(tour);
  const _W=_sgl?'選手':'チーム';
  /* 名前の出し方は「No.○○　選手名（モルックネーム）」だけにする。
     以前はシングルスのとき本名を括弧で添えていたが、
     ほかの選手を選ぶ画面とそろえるため、本名は出さないことにした。 */
  const teamOpts=teams.map(t=>`<option value="${t.id}" ${String(st.selectedTeamId)===String(t.id)?'selected':''}>No.${t.id}　${t.name}</option>`).join('');

  const modeTab=(v,l)=>`<button class="rcp-mode-tab" data-mode="${v}" style="flex:1;padding:10px 4px;font-size:14px;font-weight:700;border:none;border-radius:8px;background:${st.mode===v?'#1D9E75':'#f3f4f6'};color:${st.mode===v?'#fff':'#6b7280'};cursor:pointer;">${l}</button>`;

  const selectBlock=st.mode==='select'
    ?`<div>
        <div style="font-size:13px;color:#6b7280;margin-bottom:4px;">${_sgl?'モルックネームを選択':'チーム名を選択'}</div>
        ${teams.length>0
          ?`<select id="rcp-team-select" style="font-size:16px;">
              <option value="">-- ${_W}を選択 --</option>${teamOpts}
            </select>`
          :`<div style="font-size:13px;color:#9ca3af;padding:8px 0;">参加${_W}が登録されていません</div>`}
      </div>`
    :(()=>{
        const matched=teams.find(t=>String(t.id)===st.teamNo||String(parseInt(t.id,10))===String(parseInt(st.teamNo,10)));
        const preview=st.teamNo
          ?(matched
            ?`<div style="margin-top:8px;padding:10px 12px;background:#E1F5EE;border-radius:8px;font-size:15px;font-weight:700;color:#085041;">✓ ${matched.name}</div>`
            :`<div style="margin-top:8px;padding:10px 12px;background:#FCEBEB;border-radius:8px;font-size:13px;color:#b91c1c;">該当する${_W}が見つかりません</div>`)
          :'';
        return`<div>
          <div style="font-size:13px;color:#6b7280;margin-bottom:4px;">${_W}No</div>
          <input type="text" id="rcp-team-no" value="${st.teamNo}" placeholder="例: 073" inputmode="numeric" style="font-size:18px;letter-spacing:2px;text-align:center;"/>
          <div id="rcp-team-no-preview">${preview}</div>
        </div>`;
      })();

  return`<div style="padding:8px 0 4px;">
    ${rcpHeader('大会受付','setup')}
    <div style="font-size:13px;color:#6b7280;margin-bottom:16px;">${tour.eventName||'大会'}の受付を行います。<br>まずは${_sgl?'ご自分の名前':'チーム'}を選択してください。</div>
    <div class="card" style="padding:16px;margin-bottom:12px;">
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        ${modeTab('select',_sgl?'名前から選ぶ':'チーム名から選ぶ')}
        ${modeTab('search',_W+'Noで入力')}
      </div>
      ${selectBlock}
      ${st.loginError?`<div style="font-size:13px;color:#b91c1c;margin-top:10px;">${st.loginError}</div>`:''}
      <button class="btn btn-green" id="btn-rcp-team-next" ${st.checking?'disabled':''} style="width:100%;padding:14px;font-size:16px;font-weight:700;margin-top:16px;">${st.checking?'確認中...':'次へ →'}</button>
    </div>
  </div>`;
}

// パスワード入力ステップ（1人目のみ。2人目以降はスキップ済み）
function rRcpPw(){
  const st=_rcpState;
  const t=rcpTeam();
  return`<div style="padding:8px 0 4px;">
    ${rcpHeader('大会受付','reception')}
    <div style="font-size:13px;color:#6b7280;margin-bottom:16px;">${t?t.name+'（No.'+t.id+'）':''}</div>
    <div class="card" style="padding:16px;margin-bottom:12px;">
      <div style="font-size:13px;color:#6b7280;margin-bottom:4px;">受付パスワード（数字4桁／会場掲示）</div>
      <input type="text" id="rcp-pw" value="${st.pwInput}" placeholder="••••" maxlength="4" inputmode="numeric" style="font-size:22px;letter-spacing:10px;text-align:center;"/>
      ${st.pwError?`<div style="font-size:13px;color:#b91c1c;margin-top:10px;">${st.pwError}</div>`:''}
      <button class="btn btn-green" id="btn-rcp-pw-next" style="width:100%;padding:14px;font-size:16px;font-weight:700;margin-top:16px;">次へ →</button>
    </div>
  </div>`;
}

// 受付対象チームのオブジェクトを取得
function rcpTeam(){
  const tour=activeTour()||{teams:[]};
  return(tour.teams||[]).find(t=>String(t.id)===String(_rcpState.selectedTeamId))||null;
}

// ❶ 集合確認
function rRcpQ1(){
  const st=_rcpState;
  return`<div style="padding:8px 0 4px;">
    ${rcpHeader('大会受付','reception')}
    ${rcpProgress(1)}
    <div style="font-size:17px;font-weight:700;color:#111;line-height:1.5;margin-bottom:20px;">${isSinglesActive()?'❶ 開会式までに会場に到着する見込みですか？':'❶ 開会式までに会場に、自分を含めてチームメンバーが最低2人は到着する見込みですか？'}</div>
    ${rcpChoice('q1','arrive',st.q1,'到着する','#1D9E75')}
    ${rcpChoice('q1','late',st.q1,'遅れる可能性がある','#E24B4A')}
    ${rcpNextBtn(!st.q1)}
  </div>`;
}

// ❷ メンバー変更確認
function rRcpQ2(){
  const st=_rcpState;
  const t=rcpTeam();
  const members=t&&t.members?String(t.members).split(/[,、]/).map(s=>s.trim()).filter(Boolean):[];
  const memberHtml=members.length>0
    ?members.map(m=>`<div style="font-size:14px;color:#111;padding:4px 0;border-bottom:1px solid #f3f4f6;">・${m}</div>`).join('')
    :`<div style="font-size:13px;color:#9ca3af;">${isSinglesActive()?'本名が未登録です':'メンバー未登録'}</div>`;
  return`<div style="padding:8px 0 4px;">
    ${rcpHeader('大会受付','rcpQ1')}
    ${rcpProgress(2)}
    <div style="font-size:17px;font-weight:700;color:#111;line-height:1.5;margin-bottom:14px;">${isSinglesActive()?'❷ 以下の登録内容（モルックネーム・本名）に間違いはありませんか？':'❷ 以下のチームメンバーから、メンバー変更はありませんか？'}</div>
    <div class="card" style="padding:14px;margin-bottom:18px;">
      <div style="font-size:15px;font-weight:700;color:#1D9E75;margin-bottom:8px;">${t?t.name:'チーム'}<span style="font-size:12px;color:#9ca3af;font-weight:400;margin-left:6px;">No.${t?t.id:'-'}</span></div>
      ${memberHtml}
    </div>
    ${rcpChoice('q2','none',st.q2,'変更はない','#1D9E75')}
    ${rcpChoice('q2','changed',st.q2,'変更がある','#E24B4A')}
    ${rcpNextBtn(!st.q2)}
  </div>`;
}

// ❸ 参加経験確認
function rRcpQ3(){
  const st=_rcpState;
  return`<div style="padding:8px 0 4px;">
    ${rcpHeader('大会受付',isSinglesActive()?'reception':'rcpQ2')}
    ${rcpProgress(3)}
    <div style="font-size:17px;font-weight:700;color:#111;line-height:1.5;margin-bottom:20px;">${isSinglesActive()?'❸ 本大会に参加したことがありますか？':'❸ 本大会に参加したことがあるメンバーが、チームに1人はいますか？'}</div>
    ${rcpChoice('q3','yes',st.q3,isSinglesActive()?'ある':'いる','#1D9E75')}
    ${rcpChoice('q3','no',st.q3,isSinglesActive()?'ない':'いない','#2E8B57')}
    ${rcpNextBtn(!st.q3)}
  </div>`;
}

// ❹ モルック棒貸し出し希望
function rRcpQ4(){
  const st=_rcpState;
  return`<div style="padding:8px 0 4px;">
    ${rcpHeader('大会受付','rcpQ3')}
    ${rcpProgress(4)}
    <div style="font-size:17px;font-weight:700;color:#111;line-height:1.5;margin-bottom:20px;">❹ 本部でのモルック棒の貸し出しを希望しますか？</div>
    ${rcpChoice('q4','want',st.q4,'希望する','#1D9E75')}

// 貸し出し注意事項（希望時のみ）

    ${rcpHeader('大会受付','rcpQ4')}
    <div style="font-size:17px;font-weight:700;color:#111;margin-bottom:16px;">以下の注意事項をお読みください</div>
    <div class="card" style="padding:16px;margin-bottom:20px;background:#FFF7ED;border-color:#fed7aa;">
      <div style="font-size:15px;color:#92400e;line-height:1.7;">
        ・モルック棒の貸し出しは${isSinglesActive()?'1人':'1チーム'}につき1本となります。<br>
        ・大会終了後に必ず返却をしてください。

    <button class="btn btn-green" id="btn-rcp-next" style="width:100%;padding:15px;font-size:16px;font-weight:700;">次へ →</button>

// 最終案内＋理解チェック＋受付完了
function rRcpFinal(){
  const st=_rcpState;
  const backPhase=st.q4==='want'?'rcpRental':'rcpQ4';
  return`<div style="padding:8px 0 4px;">
    ${rcpHeader('大会受付',backPhase)}
    <div style="font-size:17px;font-weight:700;color:#111;margin-bottom:16px;">最後にご確認ください</div>
    <div class="card" style="padding:16px;margin-bottom:18px;">
      <div style="font-size:15px;color:#111;line-height:1.7;">
        ・受付終了後の${isSinglesActive()?'方':'チーム'}から、コート内で自由に練習が可能です。<br>
        ・参加賞の缶バッチは、本部にて参加人数分受取が可能です。
      </div>
    </div>
    <label class="radio-card ${st.agreed?'selected':''}" id="rcp-agree-label" style="margin-bottom:18px;">
      <input type="checkbox" id="rcp-agree" ${st.agreed?'checked':''} style="width:auto;accent-color:#1D9E75;"/>
      <span style="font-size:15px;font-weight:600;">上記の内容を理解しました</span>

// ===== コート図（テキストグリッド方式） =====
// gridテキスト（カンマ区切り×改行）を2次元配列に変換
function parseCourtGrid(gridText){
  if(!gridText)return[];
  return gridText.split(/\r?\n/).filter(l=>l.trim()!=='').map(row=>row.split(',').map(c=>c.trim()));
}
// グリッド内から該当コート番号のセル位置を探す（"037"と"37"のような0埋め差異を無視して一致判定）
function findCourtCell(gridArr,no){
  if(no==null||no==='')return null;
  const targetStr=String(no).trim();
  const targetNum=parseInt(targetStr,10);
  for(let r=0;r<gridArr.length;r++){
    for(let c=0;c<gridArr[r].length;c++){
      const val=gridArr[r][c];
      if(val===''||val==null)continue;
      if(val===targetStr)return{r,c};
      const valNum=parseInt(val,10);
      if(!isNaN(valNum)&&!isNaN(targetNum)&&valNum===targetNum)return{r,c};
    }
  }
  return null;
}
// 中央ラベル（本部など）の情報を取得。新形式{text,pos}優先、旧labelCenterはbottom扱いでフォールバック
function getCenterLabel(layout){
  if(layout.centerLabel&&layout.centerLabel.text)return layout.centerLabel;
  if(layout.labelCenter)return{text:layout.labelCenter,pos:'bottom'};
  return null;
}
// 上下左右＋中央ラベル（4方向のいずれかに配置可）で枠を組み立てる
function buildCourtMapShell(layout,gridHtml){
  const cl=getCenterLabel(layout);
  const badge=cl?`<div class="cm-label-center">${cl.text}</div>`:'';
  const pos=cl?(cl.pos||'bottom'):'';
  const top=layout.labelTop?`<div class="cm-label-top">${layout.labelTop}</div>`:'';
  const bottom=layout.labelBottom?`<div class="cm-label-bottom">${layout.labelBottom}</div>`:'';
  const leftEdge=layout.labelLeft?`<div class="cm-label-left">${layout.labelLeft}</div>`:'';
  const rightEdge=layout.labelRight?`<div class="cm-label-right">${layout.labelRight}</div>`:'';
  const leftInner=`${pos==='left'?badge:''}${leftEdge}`;
  const rightInner=`${rightEdge}${pos==='right'?badge:''}`;
  const leftSlot=leftInner?`<div class="cm-side-slot">${leftInner}</div>`:'';
  const rightSlot=rightInner?`<div class="cm-side-slot">${rightInner}</div>`:'';
  return`<div class="cm-outer">
    ${pos==='top'?badge:''}
    ${top}
    <div class="cm-middle">${leftSlot}<div class="cm-grid-wrap">${gridHtml}</div>${rightSlot}</div>
    ${pos==='bottom'?badge:''}
    ${bottom}
  </div>`;
}
// セル1個分のHTML（空白セルも枠線付きで描画する）
function courtCellHtml(val,isHi){
  const isX=val==='×'||val.toLowerCase()==='x';
  const isEmpty=val==='';
  return`<td class="cm-cell${isHi?' cm-hi':''}${isX?' cm-x':''}${isEmpty?' cm-empty':''}">${isEmpty?'':val}</td>`;
}
// コート図本体を描画し、該当コートのセルだけ色をつける
function renderCourtMapFull(layout,highlightNo){
  const gridArr=parseCourtGrid(layout&&layout.grid||'');
  if(!gridArr.length)return'';
  const pos=findCourtCell(gridArr,highlightNo);
  const maxCols=Math.max(...gridArr.map(r=>r.length));
  const rowsHtml=gridArr.map((row,ri)=>{
    let tds='';
    for(let ci=0;ci<maxCols;ci++){
      const val=row[ci]!==undefined?row[ci]:'';
      tds+=courtCellHtml(val,!!(pos&&pos.r===ri&&pos.c===ci));
    }
    return`<tr>${tds}</tr>`;
  }).join('');
  return buildCourtMapShell(layout,`<table class="cm-tbl">${rowsHtml}</table>`);
}
// 検索結果カードに埋め込むブロック
function renderCourtMapBlock(layout,highlightNo,matchId){
  if(!layout||!layout.grid||!layout.grid.trim())return'';
  return`<div style="margin-top:10px;border-top:1px dashed #e5e7eb;padding-top:10px;">
    <div style="font-size:12px;color:#6b7280;margin-bottom:8px;">コートの場所</div>
    ${renderCourtMapFull(layout,highlightNo)}
  </div>`;
}

/* 【8-8】送信済みの結果の中身（対戦カードの「送信済みの結果を確認する」を押したときに出る）。
   セットごとの点数と勝ち負け。投擲の記録もあれば「スコアシートを確認」を出す。 */
function sentResultHtml_(matchId,sent,card,nameA,nameB){
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const app=sent.app||[],sh=sent.sheet||[];
  const pick=(rows,no,other)=>rows.find(x=>sameNo_(x.team_no,no))||(other?rows.find(x=>x!==other):rows[0])||null;
  const aA=pick(app,card.teamA,null),aB=pick(app,card.teamB,aA);
  const sA=sh.find(x=>sameNo_(x.team_no,card.teamA))||null,sB=sh.find(x=>sameNo_(x.team_no,card.teamB))||null;
  /* シート（運営）の値。数字ならセットの点数、それ以外（勝ち・負けなど）は勝敗として扱う */
  const isNum=v=>v!=null&&/^\d+$/.test(String(v).trim());
  const sheetPts=r=>r?[r.v1,r.v2].filter(v=>isNum(v)).map(v=>String(v).trim()):[];
  const sheetRes=r=>r?[r.v1,r.v2].find(v=>v!=null&&String(v).trim()!==''&&!isNum(v))||'':'';
  const useSheet=!!(sA||sB);
  const pa=useSheet?sheetPts(sA):((aA&&aA.set_pts)||[]);
  const pb=useSheet?sheetPts(sB):((aB&&aB.set_pts)||[]);
  const rA={result:useSheet?sheetRes(sA):(aA&&aA.result)},rB={result:useSheet?sheetRes(sB):(aB&&aB.result)};
  const src=useSheet?'運営が反映した結果':'アプリで送信された結果';
  const n=Math.max(pa.length,pb.length);
  let sets='';
  for(let i=0;i<n;i++){
    if(pa[i]==null&&pb[i]==null)continue;
    sets+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #eef0f2;font-size:14px;">
      <span style="width:72px;color:#6b7280;font-size:12px;">${i+1}セット目</span>
      <span style="flex:1;text-align:center;font-weight:800;color:${C[0]};">${pa[i]==null?'-':esc(pa[i])}</span>
      <span style="color:#9ca3af;">-</span>
      <span style="flex:1;text-align:center;font-weight:800;color:${C[1]};">${pb[i]==null?'-':esc(pb[i])}</span>
    </div>`;
  }
  const res=r=>{const v=r?String(r.result||'').trim():'';return(v&&v!=='対象外')?esc(v):'';};   // 【2026-10-26】表裏など「対象外」は出さない
  const th=_throwsKnown[matchId];
  return`<div style="margin-top:10px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;">
    <div style="font-size:10.5px;color:#9ca3af;margin-bottom:4px;">${src}</div>
    <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px;">
      <span style="color:${C[0]};">${esc(nameA)}　${res(rA)}</span>
      <span style="color:${C[1]};">${res(rB)}　${esc(nameB)}</span>
    </div>
    ${sets||(useSheet?'':'<div style="font-size:12px;color:#9ca3af;">セットの点数は届いていません</div>')}
    ${th===true?`<button class="btn btn-blue open-scoresheet" data-matchid="${esc(matchId)}" data-back="courtSearch" style="width:100%;margin-top:10px;padding:10px;font-size:14px;">📋 スコアシートを確認</button>`
      :(th===undefined?`<div style="font-size:11px;color:#9ca3af;margin-top:8px;text-align:center;">スコアシートの有無を確認中…</div>`:'')}
  </div>`;
}

/* 【2026-10-26】トーナメント表の文字の幅を測る（チーム名の切り方・2行にするかを決める） */
let _brCtx_=null;
function brTextW_(str,px,bold){
  const t=String(str||'');
  try{
    if(!_brCtx_)_brCtx_=document.createElement('canvas').getContext('2d');
    const ff=(document.body&&getComputedStyle(document.body).fontFamily)||'sans-serif';
    _brCtx_.font=(bold?'700 ':'')+px+'px '+ff;
    return _brCtx_.measureText(t).width;
  }catch(e){
    return [...t].reduce((w,c)=>w+(/[ -~\uFF61-\uFF9F]/.test(c)?0.55:1)*px,0);   // 測れないとき：半角は全角の約半分
  }
}
/* 幅 maxW に入るところで切る。[入る部分, 残り] を返す */
function brFitCut_(str,px,maxW,bold){
  const ch=[...String(str||'')];
  let i=0;
  while(i<ch.length&&brTextW_(ch.slice(0,i+1).join(''),px,bold)<=maxW)i++;
  return [ch.slice(0,i).join(''),ch.slice(i).join('')];
}
/* 【2026-10-26】トーナメント表の1試合（チーム名2つ）から、その試合の試合IDを探す。
   チーム名 → 大会の参加チームのNo → 対戦カード（配信された対戦表＋結果が届いた試合）で、
   その2チームが当たっている試合を探す。一次予選の試合は除く。いくつかあれば試合区分の番号が大きいほう。 */
function bracketMatchIdOf_(tour,src,n1,n2){
  if(!tour)return '';
  const norm=x=>String(x||'').replace(/[\s\u3000]+/g,'');
  const idOf=n=>{
    const k=norm(n);if(!k)return '';
    if(/^\d{1,3}$/.test(k))return pad3s_(k);
    const t=(tour.teams||[]).find(t=>norm(t.name)===k);
    return t?pad3s_(t.id):'';
  };
  const ia=idOf(n1),ib=idOf(n2);
  if(!ia||!ib)return '';
  let best='',bestCode=-1;
  (src||[]).forEach(m=>{
    if(!m||!m.matchId)return;
    const pa=pad3s_(m.teamA),pb=pad3s_(m.teamB);
    if(!((pa===ia&&pb===ib)||(pa===ib&&pb===ia)))return;
    const code=m.matchId.split('_')[2]||'';
    if(isFirstPrelimCode_(tour,code))return;
    const n=parseInt(code,10)||0;
    if(n>bestCode){bestCode=n;best=m.matchId;}
  });
  return best;
}

/* =========================================================================
   【2026-10-26】いまどこにいるか（現在地・次の試合・あと何勝で優勝か）
   使うもの：
     ・対戦表（配信された組み合わせ）＋結果が届いた試合（結果反映シート・アプリ）
     ・大会ルール（試合区分の名前・トーナメント種類の名前・ラウンド名）
     ・試合システム図（勝ったら下の回戦、負けたら矢印の先＝「負けたチームの行き先」）
     ・タイムスケジュール（開始時間）
   いちばん新しい試合（試合区分の番号が一番大きいもの）を見て、
     ・結果がまだ → その試合が「次の試合」（コート・相手・時間が分かる）
     ・結果がある → 勝ち負けと試合システム図から、次に進むトーナメント・回戦を出す
                     （相手とコートは、対戦表が配信されるまで分からない）
   ========================================================================= */
/* 名前の照らし合わせ用。空白・改行を消し、「トーナメント」「トナメ」「決定T」を同じもの（T）として扱う
   （大会ルールの「5位タイトーナメント」と、試合システム図の「5位タイ決定T」が同じだと分かるように） */
function posNorm_(s){return String(s==null?'':s).replace(/\\n|\n|<br\s*\/?>/gi,'').replace(/[\s　]+/g,'').replace(/トーナメント|トナメ/g,'T').replace(/決定T/g,'T').replace(/、/g,'・');}
function posMatchName_(tour,mc){const r=(tour.matchRules||[]).find(x=>String(x.code)===String(mc));return r?String(r.name||''):'';}
function posTourneyName_(tour,tc){const r=(tour.tourneyRules||[]).find(x=>String(x.code)===String(tc));return r?String(r.name||''):'';}
function posRoundOf_(tour,mc,tc){const r=(tour.roundRules||[]).find(x=>String(x.matchCode)===String(mc)&&String(x.tourneyCode)===String(tc));return r?String(r.round||''):'';}
function posColName_(col){return String((col&&col.name)||'').replace(/\\n|\n|<br\s*\/?>/gi,'');}
function posRoundTxt_(r){return String(r||'').replace(/、/g,'・');}
/* 【2026-10-26】現在地のために、そのチームの結果だけを読む。
   大会全体の結果一覧（終盤で約15KB）を読む代わりに、
     ① そのチームが出た試合の試合IDだけ（とても小さい）
     ② その試合の両チームの勝ち負け
     ③ 結果反映シートの、そのチームの行
   だけを読む（あわせて1〜2KBほど）。通信量を減らすため。 */
let _posRes={key:'',team:'',map:{},sheet:{}};
async function loadPosResults_(tour,teamNo){
  const key=sbEventKeyOf_(tour);
  if(!key||!teamNo)return;
  const hd={'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON};
  const n=String(teamNo).trim();
  const alt=[n,pad3s_(n),String(parseInt(n,10))].filter((v,i,a)=>v&&v!=='NaN'&&a.indexOf(v)===i);
  const inList=arr=>encodeURIComponent('in.('+arr.map(v=>'"'+String(v).replace(/"/g,'')+'"').join(',')+')');
  const ek=encodeURIComponent(key);
  const get=async u=>{const r=await fetch(SB_URL+'/rest/v1/'+u,{cache:'no-store',headers:hd});if(!r.ok)throw new Error('HTTP '+r.status);return (await r.json())||[];};
  const mine=await get('team_results?event_code=eq.'+ek+'&team_no='+inList(alt)+'&select=match_id');
  const ids=[...new Set(mine.map(r=>r.match_id).filter(Boolean))];
  const map={};
  if(ids.length){
    (await get('team_results?event_code=eq.'+ek+'&match_id='+inList(ids)+'&select=match_id,team_no,result')).forEach(r=>{
      if(r.result==null||String(r.result).trim()==='')return;
      (map[r.match_id]=map[r.match_id]||[]).push(r);
    });
  }
  const sheet={};
  try{
    (await get('sheet_results?event_key=eq.'+ek+'&team_no='+inList(alt)+'&select=match_id,team_no,v1,v2,combined_id')).forEach(r=>{
      (sheet[r.match_id]=sheet[r.match_id]||[]).push(r);
    });
  }catch(e){}
  _posRes={key:key,team:pad3s_(n),map:map,sheet:sheet};
}
function posOwn_(tour,teamNo){return !!(tour&&_posRes.key&&_posRes.key===sbEventKeyOf_(tour)&&_posRes.team===pad3s_(teamNo));}
/* その試合の結果（そのチームの分を読んであればそれ、無ければ大会全体の一覧から） */
function posSentOf_(tour,matchId,teamNo){
  if(!posOwn_(tour,teamNo))return sentResultOf_(matchId);
  const a=_posRes.map[matchId]||null,sh=_posRes.sheet[matchId]||null;
  return (a||sh)?{app:a,sheet:sh}:null;
}
/* 対戦表に無くても結果が届いている、そのチームの試合のカード */
function posCards_(tour,teamNo){
  if(!posOwn_(tour,teamNo))return sentMatchCards_(tour);
  const out={};
  Object.keys(_posRes.sheet).forEach(mid=>{
    const r=(_posRes.sheet[mid]||[]).find(x=>x.combined_id);
    const c=r?cardFromCombinedId_(r.combined_id):null;
    if(c)out[c.matchId]=c;
  });
  Object.keys(_posRes.map).forEach(mid=>{
    if(out[mid])return;
    const rows=_posRes.map[mid]||[];
    if(rows.length<2)return;
    out[mid]={matchId:mid,tourneyCode:'',teamA:pad3s_(rows[0].team_no),teamB:pad3s_(rows[1].team_no),combinedId:''};
  });
  return Object.keys(out).map(k=>out[k]);
}
/* その試合でのチームの勝ち負け。'win'／'lose'／'done'（終わったが勝ち負けなし）／null（まだ結果なし） */
function posResultOf_(matchId,teamNo,tour){
  const s=posSentOf_(tour,matchId,teamNo);
  if(!s)return null;
  const sh=(s.sheet||[]).find(x=>sameNo_(x.team_no,teamNo));
  const ap=(s.app||[]).find(x=>sameNo_(x.team_no,teamNo));
  const shTxt=sh?([sh.v1,sh.v2].find(v=>v!=null&&String(v).trim()!==''&&!/^\d+$/.test(String(v).trim()))||''):'';
  const txt=String(shTxt||(ap&&ap.result)||'').trim();
  if(/勝|〇|○|◯|^win$/i.test(txt))return 'win';
  if(/負|×|✕|^lose$/i.test(txt))return 'lose';
  return 'done';
}
/* 試合（試合区分×トーナメント種類）が、試合システム図のどの箱か */
function posCellOf_(tour,mc,tc){
  const ch=tour.systemChart;
  if(!ch||!ch.columns||!ch.columns.length)return null;
  const cols=scRepairCols(ch.columns);
  const tn=posNorm_(posTourneyName_(tour,tc));
  if(!tn)return null;
  const c=cols.findIndex(x=>posNorm_(x.name)===tn);
  if(c<0)return null;
  let r=(ch.rowLabels||[]).findIndex(l=>posNorm_(l)===posNorm_(posMatchName_(tour,mc)));
  if(r<0){
    const rd=posNorm_(posRoundOf_(tour,mc,tc));
    const i=(cols[c].cells||[]).findIndex(x=>posNorm_(x)===rd);
    if(i>=0)r=(cols[c].startRow||0)+i;
  }
  return r<0?null:{c:c,r:r,cols:cols,ch:ch};
}
function posHas_(cols,c,r){const col=cols[c];if(!col)return false;const i=r-(col.startRow||0);return i>=0&&i<col.cells.length&&String(col.cells[i]||'')!=='';}
function posCellTxt_(cols,c,r){const col=cols[c];return col?String(col.cells[r-(col.startRow||0)]||''):'';}
/* 勝ち負けから、次に進む箱。{c,r,third}／{end:'win'|'lose'}／null */
function posNextCell_(pc,res){
  const c=pc.c,r=pc.r,cols=pc.cols,ch=pc.ch;
  // 交流戦は勝ち負けに関係なく、次の回へ（最後の回なら終わり）
  if(/交流/.test(posColName_(cols[c])))return posHas_(cols,c,r+1)?{c:c,r:r+1}:{end:'done'};
  if(res==='win')return posHas_(cols,c,r+1)?{c:c,r:r+1}:{end:'win'};
  if(res!=='lose')return null;
  // 準決勝で負けたら、同じ列の「決勝・3決」の3位決定戦へ
  if(posHas_(cols,c,r+1)&&/3決|3位/.test(posCellTxt_(cols,c,r+1))&&!/3決|3位/.test(posCellTxt_(cols,c,r)))return {c:c,r:r+1,third:true};
  const key=cols[c].name+'@'+r;
  let d=c+1,sr=r+1;
  const raw=ch.loseTo&&ch.loseTo[key];
  if(raw){const p=scSplitRef(raw);const i=cols.findIndex(x=>x.name===p.name);if(i>=0&&i!==c){d=i;sr=(p.row==null)?r+1:p.row;}}
  const auto=(ch.autoLose!==false)&&posHas_(cols,d,sr);
  const ov=ch.loseArrows?ch.loseArrows[key]:undefined;

/* タイムスケジュールから開始時間を探す（「決勝トナメ2回戦」「Bトナメ1回戦・交流戦①」「一次予選②」など） */
function posTimeOf_(sched,tname,round,mname){

  for(const k of keys){const hit=rows.find(x=>posNorm_(x.name).split('・').some(p=>p===k));if(hit)return String(hit.time);}

/* 【2026-10-26】不戦勝交流戦（トーナメントで相手がいないチームが、その回のあいだに出る交流戦）。
   トーナメント種類の名前に「不戦勝」が入っていれば、不戦勝交流戦として扱う。
   このときの現在地は「不戦勝交流戦」ではなく、そのチームがいるトーナメント（例：5位タイ決定T 1回戦）。
   いるトーナメントの見つけ方：
     ① 試合システム図の、不戦勝交流戦ではない列に「不戦勝交流戦①」のような箱があれば、その列（例：5位タイ決定T の一番上）

function posIsBye_(tour,tc){return /不戦勝/.test(posTourneyName_(tour,tc));}

/* そのチームの現在地をまとめる */
function teamPosition_(tour,teamNo,sched){

    seen[m.matchId]=1;mine.push(m);
  });
  if(!mine.length)return {none:true};
  const mcOf=m=>parseInt(m.matchId.split('_')[2],10)||0;
  mine.sort((a,b)=>mcOf(b)-mcOf(a));

  const curLabel=(tn&&rd)?(tn+posRoundTxt_(rd)):(mn||('試合区分'+mc));

    const home=posByeHome_(tour,tn,rd,mine[1]||null,teamNo);
    if(home){
      const hcol=home.cols[home.c],hn=posColName_(hcol),ht=posCellTxt_(home.cols,home.c,home.r);
      const here=home.self?hn:(hn+posRoundTxt_(ht));
      const rem=posRemain_(home.cols,home.c,home.r);
      if(rem)rem.k=Math.max(1,rem.k-1);   // 不戦勝の回は勝たなくてよい
      const res0=posResultOf_(m.matchId,teamNo,tour);
      if(!res0){
        const opp=sameNo_(m.teamA,teamNo)?m.teamB:m.teamA;
        const ot=(tour.teams||[]).find(t=>sameNo_(t.id,opp));
        return {curLabel:here+'（不戦勝）',mark:{c:home.c,r:home.r},
          next:{known:true,matchId:m.matchId,label:here+'（不戦勝）',byeName:curLabel,court:parseInt(parts[3],10)||parts[3],oppName:ot?ot.name:('No.'+opp),
                time:posTimeOf_(sched,tn,rd,mn)},
          remain:rem};
      }
      const n=posNextCell_(home,'win');
      if(!n||n.end)return {curLabel:curLabel,lastRes:res0,end:'done'};
      const ncol=home.cols[n.c],nct=posCellTxt_(home.cols,n.c,n.r),nnm=posColName_(ncol);

  const pc=isPre?null:posCellOf_(tour,mc,tc);
  const res=posResultOf_(m.matchId,teamNo,tour);
  const out={curLabel:curLabel,mark:pc?{c:pc.c,r:pc.r}:null};
  if(!res){
    const opp=sameNo_(m.teamA,teamNo)?m.teamB:m.teamA;
    const ot=(tour.teams||[]).find(t=>sameNo_(t.id,opp));
    out.next={known:true,matchId:m.matchId,label:curLabel,court:parseInt(parts[3],10)||parts[3],oppName:ot?ot.name:('No.'+opp),
              time:posTimeOf_(sched,tn,rd,mn)};
    out.remain=pc?posRemain_(pc.cols,pc.c,pc.r):null;

  }
  out.lastRes=res;
  let nx=null,cols=null;

    const n=posNextCell_(pc,res);

  }
  const col=cols[nx.c];
  const nm=posColName_(col),ct=posCellTxt_(cols,nx.c,nx.r);
  out.mark={c:nx.c,r:nx.r};
  const _lab=nx.third?'3位決定戦':(posNorm_(ct).indexOf(posNorm_(nm))===0?'':nm)+posRoundTxt_(ct);   // 「交流戦交流戦④」にならないように
  out.next={known:false,label:nx.third?(nm+_lab):_lab,note:/交流/.test(nm)?(col.note||''):'',

  out.remain=nx.third?null:posRemain_(cols,nx.c,nx.r);

function posTexts_(p){

  if(p.none)return {now:'試合前',next:'対戦表の配信待ち'};
  if(p.end==='win')return {now:p.curLabel+'（勝ち）',next:'この大会の試合はすべて終わりました'};
  if(p.end==='done')return {now:p.curLabel+'（'+R(p.lastRes)+'）',next:'この大会の試合はすべて終わりました'};
  if(p.end)return {now:p.curLabel+'（'+R(p.lastRes)+'）',next:'この先の試合はありません'};
  if(p.pending)return {now:p.curLabel+'（'+R(p.lastRes)+'）',next:'次の対戦表の配信待ち'};
  const n=p.next;
  const tm=n.time?('／開始時間：'+posTimeJa_(n.time)):'';
  const sub=p.remain?('あと'+p.remain.k+'勝で'+p.remain.name+'優勝'):'';

    const st=liveSchedState_(lt,liveSchedItems_(S._liveSched.rows));
    if(st.sig!==S._liveSchedSig)render();
  }catch(e){}
},30000);

  /* 【2026-10-26】「送信済みの試合を確認」から開いたときは、結果送信済みのカードだけを出す */
  const results=(S._csSentOnly&&Array.isArray(S._courtSearchResults))?S._courtSearchResults.filter(r=>sentResultOf_(r.matchId)):(S._courtSearchResults||null);

  const csW=wTeam(_csT||null);   // シングルス大会なら「選手」、それ以外は「チーム」

              ${csTeamsSorted.map(t=>`<option value="${t.id}" ${String(q.teamNo)===String(t.id)?'selected':''}>No.${t.id}　${t.name}</option>`).join('')}

          :`<div style="font-size:13px;color:#9ca3af;padding:8px 0;">参加${csW}が登録されていません</div>`}

    :`<div>

        <input type="text" id="cs-team-no" value="${q.teamNo}" placeholder="例: 073" style="font-size:18px;letter-spacing:2px;text-align:center;"/>
      </div>`;
  const searchForm=`<div class="card" style="padding:14px;margin-bottom:12px;">
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        ${csModeTab('select',csW+'名から選ぶ')}

      <div style="display:grid;gap:10px;">

          ${tourMatchRules.length>0?`<select id="cs-match-code" style="font-size:16px;">
            <option value="">-- すべて --</option>

          </select>`:`<input type="text" id="cs-match-code" value="${q.matchCode}" placeholder="例: 02"/>`}
        </div>
      </div>
      <button class="btn btn-blue" id="btn-cs-search" style="width:100%;padding:13px;font-size:15px;margin-top:12px;">🔍 検索する</button>
    </div>`;
  // パーソナライズ時は折りたたみUI
  const formBlock=personalized
    ?(expanded
      ?`<div style="margin-bottom:12px;">
          <button class="btn btn-gray btn-sm" id="btn-cs-toggle" style="width:100%;margin-bottom:8px;font-size:13px;">▲ 検索を閉じる</button>
          ${searchForm}

      :`<button class="btn btn-gray btn-sm" id="btn-cs-toggle" style="width:100%;margin-bottom:12px;font-size:13px;padding:9px;">🔍 他の${csW}・試合区分を検索</button>`)

  const headerTitle=S._csSentOnly?'送信済みの試合を確認':(_csLive?(personalized?'対戦コートを見る':'対戦コートを検索'):'対戦相手を検索');
  return`<div style="padding:8px 0 4px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">

    ${(()=>{const atour=_csT;if(!atour)return'';const cache=_jsonCache[atour.eventCode];const upd=cache&&cache.data&&cache.data.updatedAt?new Date(cache.data.updatedAt).toLocaleTimeString('ja-JP'):'未取得';return`<div style="font-size:12px;color:#9ca3af;margin-bottom:10px;text-align:right;">最終更新: ${upd} <button class="btn btn-gray btn-xs" id="btn-cs-refresh" style="padding:3px 8px;font-size:11px;">🔄 更新</button></div>`;})()}

// ===== 結果のみ：各セット点数入力画面 =====
function rResultOnlyInput(){
  const d=S._savedMatchIdData||{};
  const fmtLabel=S.fmt==='best2'?'2先':S.fmt==='best3'?'3先':'表裏';
  const nameA=S.teams[0]?S.teams[0].name:'チームA';
  const nameB=S.teams[1]?S.teams[1].name:'チームB';
  const scores=S._roScores||[];
  const nW=S.fmt==='best2'?2:S.fmt==='best3'?3:99;
  const maxSets=scores.length;

  // 各セットの勝敗を点数から判定（点数が両方入力されているセットのみ）
  const setResults=scores.map(([a,b])=>{
    const va=a===''?null:parseInt(a,10);
    const vb=b===''?null:parseInt(b,10);
    if(va===null||vb===null||isNaN(va)||isNaN(vb))return null; // 未入力
    if(va>vb)return 0;
    if(vb>va)return 1;
    return 'draw';
  });

  // 何セット目で試合が決着したか（2先/3先）。決着後のセットは「試合終了」で入力不要
  let decidedAt=-1; // 決着したセットのindex（0始まり）。-1なら未決着
  if(S.fmt!=='round2'){
    const w=[0,0];
    for(let i=0;i<setResults.length;i++){
      const r=setResults[i];
      if(r===0)w[0]++; else if(r===1)w[1]++;
      if(w[0]>=nW||w[1]>=nW){decidedAt=i;break;}
    }
  }
  const early=!!S._roEarly; // 時間切れで途中終了モード

  // 集計対象セット：通常決着していればそこまで、それ以外は入力済みセット全部
  const countUpto=decidedAt>=0?decidedAt:(scores.length-1);
  const wins=[0,0];
  setResults.forEach((r,i)=>{ if(i>countUpto)return; if(r===0)wins[0]++;else if(r===1)wins[1]++; });

  // 通常決着（先取到達）
  let matchWin=null,matchDecided=false;
  if(S.fmt!=='round2'){
    if(wins[0]>=nW){matchWin=0;matchDecided=true;}
    else if(wins[1]>=nW){matchWin=1;matchDecided=true;}
  }
  // 時間切れ終了時の勝敗判定（earlyロジック：セット勝数→合計点→同点ならモルックアウト）
  let earlyWin=null;       // 0/1/null
  let earlyNeedMolkout=false; // セット勝数・合計点ともに同点 → モルックアウト
  if(early&&!matchDecided){
    const played=scores.map(([a,b])=>[a===''?null:parseInt(a,10),b===''?null:parseInt(b,10)])
      .filter(([a,b])=>a!==null&&b!==null&&!isNaN(a)&&!isNaN(b));
    if(wins[0]>wins[1])earlyWin=0;
    else if(wins[1]>wins[0])earlyWin=1;
    else{
      const tot=[played.reduce((s,r)=>s+r[0],0),played.reduce((s,r)=>s+r[1],0)];
      if(tot[0]>tot[1])earlyWin=0;
      else if(tot[1]>tot[0])earlyWin=1;
      else if(played.length>0){earlyNeedMolkout=true;earlyWin=(S._roMolkoutWinner!=null?S._roMolkoutWinner:null);}
    }
  }

  // 点数プルダウン（50→0）
  // ・2先/3先：セットに引き分けが無いため、相手と同じ点数は選べない
  // ・表裏：両者50（同時上がり）だけ不可
  const optsFor=(val,oppVal)=>{
    const opp=String(oppVal);
    const noDraw=(S.fmt!=='round2');
    let o=`<option value=""${val===''?' selected':''}>-</option>`;
    for(let n=50;n>=0;n--){
      const sameAsOpp=(opp!==''&&opp===String(n));
      let disabled='';
      if(String(val)!==String(n)){
        if(noDraw&&sameAsOpp)disabled=' disabled';            // 2先/3先：同点不可
        else if(!noDraw&&n===50&&opp==='50')disabled=' disabled'; // 表裏：両者50不可
      }
      o+=`<option value="${n}"${String(val)===String(n)?' selected':''}${disabled}>${n}</option>`;
    }
    return o;
  };

  // 「試合終了後で入力不要」になるセット：通常決着後
  const isLockedSet=(i)=>{
    if(decidedAt>=0&&i>decidedAt)return true;
    return false;
  };

  // 表形式の点数入力（セット=行）
  const rowsHtml=scores.map(([a,b],i)=>{
    const ended=isLockedSet(i);
    const r=setResults[i];
    let resCell;
    if(ended){
      resCell=`<span style="font-size:11px;color:#9ca3af;">試合終了</span>`;
    }else if(r===null){
      resCell=`<span style="font-size:11px;color:#cbd5e1;">—</span>`;
    }else if(r==='draw'){
      resCell=`<span style="font-size:11px;font-weight:700;color:#92400e;">引分</span>`;
    }else{
      resCell=`<span style="display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:${C[r]};"><span style="width:7px;height:7px;border-radius:50%;background:${C[r]};"></span>勝</span>`;
    }
    const cellBg=ended?'#f9fafb':'#fff';
    const selStyle=`width:100%;padding:8px 4px;font-size:16px;font-weight:700;text-align:center;text-align-last:center;border:1.5px solid #d1d5db;border-radius:8px;background:${ended?'#f3f4f6':'#fff'};color:${ended?'#9ca3af':'#111'};`;
    return`<tr style="background:${cellBg};">
      <td style="padding:6px 4px;text-align:center;font-size:12px;font-weight:700;color:#6b7280;border-top:1px solid #eef2f7;">${i+1}</td>
      <td style="padding:6px 4px;border-top:1px solid #eef2f7;">
        <select class="ro-score" data-set="${i}" data-ti="0" ${ended?'disabled':''} style="${selStyle}border-color:${r===0&&!ended?C[0]:'#d1d5db'};">${optsFor(a,b)}</select>
      </td>
      <td style="padding:6px 4px;border-top:1px solid #eef2f7;">
        <select class="ro-score" data-set="${i}" data-ti="1" ${ended?'disabled':''} style="${selStyle}border-color:${r===1&&!ended?C[1]:'#d1d5db'};">${optsFor(b,a)}</select>
      </td>
      <td style="padding:6px 4px;text-align:center;border-top:1px solid #eef2f7;white-space:nowrap;">${resCell}</td>
    </tr>`;
  }).join('');

  const tableHtml=`<div style="border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:12px;">
    <table style="width:100%;border-collapse:collapse;table-layout:fixed;">
      <colgroup><col style="width:34px;"/><col/><col/><col style="width:46px;"/></colgroup>
      <thead>
        <tr style="background:#f8fafc;">
          <th style="padding:8px 4px;font-size:11px;color:#6b7280;font-weight:700;">ｾｯﾄ</th>
          <th style="padding:8px 4px;font-size:12px;font-weight:700;color:${C[0]};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${nameA}</th>
          <th style="padding:8px 4px;font-size:12px;font-weight:700;color:${C[1]};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${nameB}</th>
          <th style="padding:8px 4px;font-size:11px;color:#6b7280;font-weight:700;">勝敗</th>
        </tr>
      </thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  </div>`;

  // 時間切れ終了トグル（大きめ・文言シンプル）
  const earlyToggle=`<label style="display:flex;align-items:center;gap:14px;padding:16px 16px;border:2px solid ${early?'#f59e0b':'#e5e7eb'};border-radius:12px;background:${early?'#fffbeb':'#fff'};cursor:pointer;margin-bottom:12px;">
    <input type="checkbox" id="ro-early-toggle" ${early?'checked':''} style="width:24px;height:24px;flex-shrink:0;accent-color:#f59e0b;cursor:pointer;"/>
    <span style="font-size:16px;font-weight:700;color:#92400e;">時間切れで終了した試合の場合はチェック</span>
  </label>`;

  // 結果サマリー
  const anyInput=setResults.some((r,i)=>r!==null&&!isLockedSet(i));
  // モルックアウトボタン（時間切れ同点時）
  const molkoutHtml=(early&&earlyNeedMolkout)?`

function rUnknownCheck(){
  const uSets=unknownSets();
  // 全て修正済みなら自動的に結果画面へ
  if(uSets.length===0){
    const ph=S._ucFrom||'matchOver';
    S._ucFrom=null;
    setTimeout(()=>{S.phase=ph;render();},0);
    return'<div style="padding:20px;text-align:center;color:#1D9E75;font-weight:600;">✓ 全て確認済みです。結果画面へ移動します...</div>';
  }
  const idx=S.ssIdx<uSets.length?S.ssIdx:0;
  const setIdx=uSets[idx]!=null?uSets[idx]:uSets[0];
  const sn=setIdx+1;
  const sl=S.fmt==='round2'?sn+'セット目':'第'+sn+'セット';
  const cset=S.sets[setIdx];
  if(!cset){return'<div style="padding:20px;text-align:center;color:#9ca3af;">データ取得エラー</div>';}
  const total=uSets.length;
  // スコアシートを編集モードで表示
  return`<div style="padding:6px 0 4px;">
    <div style="background:#FEE2E2;border:1.5px solid #fca5a5;border-radius:10px;padding:12px;margin-bottom:12px;">
      <div style="font-size:14px;font-weight:700;color:#b91c1c;margin-bottom:4px;">⚠️ 「？ わからない」の投擲が残っています</div>
      <div style="font-size:13px;color:#991b1b;">試合結果を確定する前に、全ての投擲の結果（○か×）を確定してください。✏️をタップして修正できます。</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
      <div style="flex:1;"><div style="font-size:12px;color:#6b7280;">${fl()} | 未確定 ${total}セット</div><div style="font-size:16px;font-weight:700;color:#111;">スコア確認・修正</div></div>
    </div>
    ${total>1?`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;justify-content:center;">
      <button class="btn btn-gray btn-sm" id="btn-uc-prev" ${idx>0?'':'disabled'} style="min-width:48px;font-size:16px;">◀</button>
      <span style="font-size:15px;font-weight:700;color:#111;min-width:80px;text-align:center;">${sl}</span>
      <button class="btn btn-gray btn-sm" id="btn-uc-next" ${idx<total-1?'':'disabled'} style="min-width:48px;font-size:16px;">▶</button>
    </div>`:'<div style="font-size:15px;font-weight:700;color:#111;margin-bottom:10px;">'+sl+'</div>'}
    ${buildSS(cset,true,setIdx)}
    <button class="btn btn-green" id="btn-uc-done" style="width:100%;padding:14px;font-size:16px;margin-top:12px;" ${unknownSets().length===0?'':'disabled'}>
      ${unknownSets().length===0?'確認完了 → 結果へ進む ✓':'まだ「？」が残っています（'+unknownSets().length+'セット）'}
    </button>
  </div>`;
}

function updPrev(){
  const pv=document.getElementById('preview');if(!pv)return;
  if(!S.iP){pv.textContent='';return;}
  if(S.iP==='miss'){pv.textContent='ミス（0点）記録';return;}
  const pts=parseInt(S.iP),multi=S.iM==='multi',res=S.iA;
  const cset=cs(),ct=cset.ctid,td=cset.teams[ct],ns=td.sc+pts;
  const sym=res==='circle'?' ［○ 狙い通り］':res==='unknown'?' ［？ 不明］':' ［× 狙い通りでない］';
  if(ns>50)pv.textContent=`${td.sc}+${pts}=${ns} → 25点にリセット${sym}`;
  else if(ns===50)pv.textContent=`${td.sc}+${pts}=50点！セット勝利${sym}`;
  else pv.textContent=`${td.sc}+${pts}=${ns}点${sym}`;
}


// ===== 投げ順画面のメンバー追加 =====
function showAddMemberModal(ti){
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;';
  overlay.innerHTML=`<div style="background:#fff;border-radius:12px;padding:18px;width:100%;max-width:420px;">
    <div style="font-size:16px;font-weight:700;margin-bottom:6px;">${S.teams[ti].name}にメンバーを追加</div>
    <div style="font-size:13px;color:#6b7280;margin-bottom:12px;">このセットからローテーションに加わります</div>
    <div style="display:grid;gap:10px;">
      <div>
        <div style="font-size:13px;color:#6b7280;margin-bottom:4px;">氏名</div>
        <input type="text" id="am-name" placeholder="例: 直前参加者①" style="font-size:16px;"/>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button id="am-cancel" class="btn btn-gray" style="flex:1;">キャンセル</button>
      <button id="am-save" class="btn btn-green" style="flex:2;">追加する</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  // 入力欄にフォーカス
  setTimeout(()=>{
    const inp=document.getElementById('am-name');
    if(inp)inp.focus();
  },100);

  document.getElementById('am-cancel').onclick=()=>document.body.removeChild(overlay);
  document.getElementById('am-save').onclick=()=>{
    const inp=document.getElementById('am-name');
    if(!inp)return;
    const name=inp.value.trim();
    if(!name){alert('氏名を入力してください');return;}
    // チームのメンバーリストに追加（永続）
    if(!S.teams[ti].members.includes(name)){
      S.teams[ti].members.push(name);
    }
    // 投げ順リストに追加（まだなければ）
    if(S.pOrders[ti].length===0){
      S.pOrders[ti]=[...S.teams[ti].members];
    } else if(!S.pOrders[ti].includes(name)){
      S.pOrders[ti].push(name);
    }
    document.body.removeChild(overlay);
    render();
  };
}

function bindDrag(){
  [0,1].forEach(ti=>{
    const list=document.getElementById(`order-list-${ti}`);if(!list)return;
    let src=null;
    list.querySelectorAll('.order-item').forEach(item=>{
      item.addEventListener('dragstart',e=>{src=item;item.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
      item.addEventListener('dragend',()=>{item.classList.remove('dragging');list.querySelectorAll('.order-item').forEach(i=>i.classList.remove('over'));src=null;});
      item.addEventListener('dragover',e=>{e.preventDefault();list.querySelectorAll('.order-item').forEach(i=>i.classList.remove('over'));item.classList.add('over');});
      item.addEventListener('dragleave',()=>item.classList.remove('over'));
      item.addEventListener('drop',e=>{
        e.preventDefault();item.classList.remove('over');if(!src||src===item)return;
        const all=Array.from(list.querySelectorAll('.order-item'));
        const from=all.indexOf(src),to=all.indexOf(item);if(from<0||to<0)return;
        const base=S.pOrders[ti].length>0?[...S.pOrders[ti]]:S.teams[ti].members.slice();
        base.splice(to,0,base.splice(from,1)[0]);S.pOrders[ti]=base;src=null;render();
      });
    });
  });
}

  app.querySelectorAll('.excl-toggle').forEach(btn=>{btn.addEventListener('click',()=>{
    const ti=parseInt(btn.dataset.team),m=btn.dataset.member;
    if(!S.pExclude[ti])S.pExclude[ti]=[];
    if(S.pExclude[ti].includes(m)){
      // 参加に戻す：元の位置（先頭から）に挿入
      S.pExclude[ti]=S.pExclude[ti].filter(x=>x!==m);
      // 投げ順リストで excluded でない人の末尾（=excludedの先頭）の位置に挿入
      const ord=S.pOrders[ti].length>0?S.pOrders[ti]:S.teams[ti].members.slice();
      const excl=S.pExclude[ti];
      const firstExclIdx=ord.findIndex(x=>excl.includes(x));
      const insertAt=firstExclIdx>=0?firstExclIdx:ord.length;
      if(!ord.includes(m)){ord.splice(insertAt,0,m);}
      else{
        // 現在の位置から一番下のactive位置へ
        const curIdx=ord.indexOf(m);
        ord.splice(curIdx,1);
        const newInsert=ord.findIndex(x=>excl.includes(x));
        ord.splice(newInsert>=0?newInsert:ord.length,0,m);
      }
      S.pOrders[ti]=ord;
    } else {
      // 外す：リスト内で一番下に移動
      const ord=S.pOrders[ti].length>0?[...S.pOrders[ti]]:S.teams[ti].members.slice();
      const idx=ord.indexOf(m);
      if(idx>=0){ord.splice(idx,1);ord.push(m);}
      S.pOrders[ti]=ord;
      S.pExclude[ti].push(m);
    }
    render();
  });});
  app.querySelectorAll('.move-up').forEach(btn=>{btn.addEventListener('click',()=>{

  const _upKey=()=>{

      if((S._liveEvents||[]).some(r=>String(r.event_key)===k)){
        alert('この大会はいま新アプリで開催中です。\n「次の大会」は、まだ始まっていない別の大会を選んでください。');
        return;
      }
      if(!_upKey()){alert('配信キーが入っていません。\n下の「📡 新アプリの開催中リスト」の欄に配信キーを入れてから、もう一度押してください。');return;}
      const tour=AD.tournaments&&AD.tournaments.find(t=>((t.venueCode?t.venueCode+'_':'')+t.eventCode)===k);
      if(!confirm(`大会コード「${code}」を「開催前の大会」にしますか？\n参加者のホームにカードが出て、会場・対戦相手を先に見られるようになります。\n（受付と試合開始は、開催中にするまでできません）\n（新アプリだけの設定です。従来アプリには影響しません）`))return;

      let settingsOk=true;
      if(tour)settingsOk=await publishSettings(tour,{silent:true});
      const keys=upcomingKeysNow_(AD).filter(x=>x!==k).concat([k]);
      const r=await publishUpcomingEvents(keys);
      btn.disabled=false;btn.textContent=orig;
      if(r.ok){
        _upDone(keys);

  // 大会編集ハンドラ
  // 基本情報フィールドを tour オブジェクトに取り込む
  // ===== 大会コード重複チェック（ローカル＋GitHub） =====
  // この大会が元々持っていたコード（自分自身の配信済みファイルを誤検知しないため）
  const _ownOriginalCode=((AD.tournaments||[]).find(t=>t.id===S._editingTourId)||{}).eventCode||'';
  // ローカル（localStorage）の大会一覧から、同じコードを使う「別の大会」を探す
  function findLocalCodeConflict(code,selfId){
    if(!code)return null;
    return (AD.tournaments||[]).find(t=>t.eventCode===code&&t.id!==selfId)||null;
  }
  // GitHub上に {code}_settings.json が存在するか確認し、あれば中身（大会名・場所）を返す
  async function fetchRemoteCodeInfo(code){
    if(!code)return null;
    try{
      const data=await fetchSettingsJson(code);
      if(data&&data.eventCode)return data; // 存在する
      return null;
    }catch(e){return null;}
  }
  // コード欄のステータス表示を更新（ローカル即時 → GitHub非同期）
  let _codeCheckSeq=0;
  async function updateCodeStatus(){
    const input=document.getElementById('te-code');
    const statusEl=document.getElementById('te-code-status');
    if(!input||!statusEl)return;
    const code=input.value.trim();
    const selfId=S._editingTourId;
    if(!code){statusEl.style.color='#9ca3af';statusEl.textContent='大会コードを入力してください';return;}
    const nm=(name)=>name||'（大会名未設定）';
    // ① ローカルの衝突を即時表示
    const local=findLocalCodeConflict(code,selfId);
    if(local){
      const v=(AD.venues||[]).find(x=>x.code===local.venueCode);
      statusEl.style.color='#dc2626';
      statusEl.innerHTML='⚠️ このコードは「'+nm(local.eventName)+'」'+(v?'（'+v.name+'）':'')+'で使用中です';
      return;
    }
    // ② GitHub側を非同期チェック（最新の入力のみ反映するためseqで制御）
    const mySeq=++_codeCheckSeq;
    statusEl.style.color='#9ca3af';statusEl.textContent='確認中…';
    const remote=await fetchRemoteCodeInfo(code);
    if(mySeq!==_codeCheckSeq)return; // 入力が進んでいたら破棄
    if(remote&&code===_ownOriginalCode){
      // 自分自身が配信したファイル → 問題なし
      statusEl.style.color='#16a34a';
      statusEl.textContent='✅ この大会のコードとして配信済みです';
    }else if(remote){
      const v=(AD.venues||[]).find(x=>x.code===remote.venueCode);
      statusEl.style.color='#dc2626';
      statusEl.innerHTML='⚠️ このコードは配信済みです：「'+nm(remote.eventName)+'」'+(v?'（'+v.name+'）':'')+'\u3000上書きに注意してください';
    }else{
      statusEl.style.color='#16a34a';
      statusEl.textContent='✅ この大会ではまだこのコードは使われていません';
    }
  }
  // コード欄の入力に応じてリアルタイム表示
  const codeInputEl=document.getElementById('te-code');
  if(codeInputEl){
    codeInputEl.addEventListener('input',()=>updateCodeStatus());
    updateCodeStatus(); // 画面表示時に初期判定
  }

  function captureBasicFields(tour){
    if(!tour)return;
    const ve=document.getElementById('te-venue');if(ve)tour.venueCode=ve.value;
    const co=document.getElementById('te-code');if(co)tour.eventCode=co.value.trim();
    const na=document.getElementById('te-name');if(na)tour.eventName=na.value.trim();
    const dn=document.getElementById('te-display-name');if(dn)tour.displayName=dn.value.replace(/\s+$/,'');
    const gu=document.getElementById('te-gasurl');if(gu)tour.gasUrl=gu.value.trim();
    const su=document.getElementById('te-sheeturl');if(su)tour.sheetUrl=su.value.trim();
    const trEl=document.getElementById('te-tour-rules');const tnEl=document.getElementById('te-tour-notes');
    if(trEl||tnEl){if(!tour.tourInfo)tour.tourInfo={rules:'',notes:''};
      if(trEl)tour.tourInfo.rules=trEl.value.replace(/\s+$/,'');
      if(tnEl)tour.tourInfo.notes=tnEl.value.replace(/\s+$/,'');}
    const psEl=document.getElementById('te-period-start');if(psEl)tour.eventPeriodStart=psEl.value;
    const peEl=document.getElementById('te-period-end');if(peEl)tour.eventPeriodEnd=peEl.value;
    const rpwEl=document.getElementById('te-reception-pw');if(rpwEl)tour.receptionPw=rpwEl.value.trim();
    const btcEl=document.getElementById('te-bracket-count');if(btcEl)tour.bracketTeamCount=Number(btcEl.value)||64;
    const mtEl=document.getElementById('te-match-type');if(mtEl)tour.matchType=(mtEl.value==='singles'?'singles':'team');
    // 交流戦の参加申請
    const exEn=document.getElementById('te-exh-enabled');
    const exCn=document.getElementById('te-exh-count');
    if(exEn||exCn){
      const cur=exhOf(tour);
      const n=exCn?(parseInt(exCn.value,10)||0):cur.count;
      const NUM=['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];
      const games=[];
      for(let i=0;i<n;i++){
        const nm=document.querySelector('.te-exh-name[data-i="'+i+'"]');
        const ds=document.querySelector('.te-exh-desc[data-i="'+i+'"]');
        const old=cur.games[i]||{};
        games.push({
          name:(nm?nm.value.trim():(old.name||''))||('交流戦'+NUM[i]),
          desc:(ds?ds.value.replace(/\s+$/,''):(old.desc||''))
        });
      }
      tour.exhibition={enabled:exEn?(exEn.value==='1'):cur.enabled,count:n,games:games};
    }
    // 【8-8】予選順位による進出先
    if(document.querySelector('.te-adv-from')){
      const adv=[];
      document.querySelectorAll('.te-adv-from').forEach(el=>{
        const i=el.dataset.i;
        const q=c=>document.querySelector('.'+c+'[data-i="'+i+'"]');
        adv.push({from:parseInt(el.value,10)||'',to:parseInt((q('te-adv-to')||{}).value,10)||'',
                  tourneyCode:String((q('te-adv-code')||{}).value||''),label:String((q('te-adv-label')||{}).value||'').trim()});
      });
      tour.advanceRules=adv;
    }
    const b1nEl=document.getElementById('te-bracket1-name');if(b1nEl)tour.bracket1Name=b1nEl.value.trim()||'決勝トーナメント';
    const b2cEl=document.getElementById('te-bracket2-count');if(b2cEl)tour.bracket2TeamCount=Number(b2cEl.value)||0;
    const b2nEl=document.getElementById('te-bracket2-name');if(b2nEl)tour.bracket2Name=b2nEl.value.trim()||'Bトーナメント';
    // コート図
    const clGrid=document.getElementById('cl-grid');
    if(clGrid){
      if(!tour.courtLayout)tour.courtLayout={};
      tour.courtLayout.grid=clGrid.value;
      const clTop=document.getElementById('cl-top');tour.courtLayout.labelTop=clTop?clTop.value.trim():'';
      const clBottom=document.getElementById('cl-bottom');tour.courtLayout.labelBottom=clBottom?clBottom.value.trim():'';
      const clLeft=document.getElementById('cl-left');tour.courtLayout.labelLeft=clLeft?clLeft.value.trim():'';
      const clRight=document.getElementById('cl-right');tour.courtLayout.labelRight=clRight?clRight.value.trim():'';
      const clCenterText=document.getElementById('cl-center-text');
      const clCenterPos=document.getElementById('cl-center-pos');
      tour.courtLayout.centerLabel={
        text:clCenterText?clCenterText.value.trim():'',
        pos:clCenterPos?clCenterPos.value:'bottom'
      };
      delete tour.courtLayout.labelCenter; // 旧フィールドは新フィールドに統合
    }
    // 試合システム図（構成テキスト＋既存の色・矢印を保持）
    const scEditEl=document.getElementById('sc-edit');
    if(scEditEl){
      const ch=scApplyStructureText(tour.systemChart,scEditEl.value);
      tour.systemChart=(ch&&((ch.columns&&ch.columns.length)||(ch.prelims&&ch.prelims.length)||ch.cornerLabel))?ch:null;
    }
  }

  // 保存・配信して大会一覧に戻る（戻るボタン・下部ボタン共通）
  async function savePublishAndClose(triggerBtn){
    const tour=AD.tournaments.find(t=>t.id===S._editingTourId);
    if(!tour){S._editingTourId=undefined;render();return;}
    captureBasicFields(tour);
    saveActiveTour(tour);
    // 大会コード重複チェック（配信前の最終確認）
    if(tour.eventCode){
      // ローカル：別の大会が同じコードを使用
      const local=findLocalCodeConflict(tour.eventCode,tour.id);
      if(local){
        const v=(AD.venues||[]).find(x=>x.code===local.venueCode);
        if(!confirm('⚠️ 大会コード「'+tour.eventCode+'」は、すでに別の大会\n「'+(local.eventName||'（大会名未設定）')+'」'+(v?'（'+v.name+'）':'')+'\nで使用されています。\n\nこのまま配信すると、GitHub上の設定・試合データが上書きされ、互いのデータが混ざる可能性があります。\n\n本当にこのコードで配信しますか？')){
          if(triggerBtn){triggerBtn.disabled=false;}
          return; // キャンセル：編集画面に留まる
        }
      } else if(tour.eventCode!==_ownOriginalCode){
        // GitHub：自分以外が配信済みのコード
        const remote=await fetchRemoteCodeInfo(tour.eventCode);
        if(remote){
          const v=(AD.venues||[]).find(x=>x.code===remote.venueCode);
          if(!confirm('⚠️ 大会コード「'+tour.eventCode+'」は、すでにGitHubに配信済みです。\n配信元：「'+(remote.eventName||'（大会名未設定）')+'」'+(v?'（'+v.name+'）':'')+'\n\nこのまま配信すると、その大会の設定・試合データを上書きします。\n\n本当にこのコードで配信しますか？')){
            if(triggerBtn){triggerBtn.disabled=false;}
            return; // キャンセル：編集画面に留まる
          }
        }
      }
    }
    let label=null;
    if(triggerBtn){label=triggerBtn.textContent;lockBtnSize_(triggerBtn);triggerBtn.disabled=true;triggerBtn.textContent='保存・配信中...';}
    let published=false;
    if(tour.eventCode){
      published=await publishSettings(tour,{silent:true});
      // 配信中の大会なら active.json も最新化（稼働状態を維持）
      if(published&&AD.activeEventCode&&AD.activeEventCode===tour.eventCode){
        await publishActiveEvent(tour.eventCode);
      }
    }
    if(triggerBtn){triggerBtn.disabled=false;triggerBtn.textContent=label;}
    if(!tour.eventCode){
      alert('大会コードが未設定のため、ローカル保存のみ行いました。\n配信するには大会コードを入力してください。');
    } else if(!published){
      alert('⚠️ 保存はできましたが、配信に失敗しました。\nGitHub Tokenやネットワークを確認してください。');
    }
    S._editingTourId=undefined;render();
  }
  const bspc=document.getElementById('btn-save-publish-close');
  if(bspc)bspc.onclick=()=>savePublishAndClose(bspc);

    const eventCode=evcode?String(evcode):await resolveActiveEventCode();
    if(!eventCode){
      S._csLoading=false;

        alert('現在、開催中の大会はありません。\n大会が開始されるまでお待ちください。');

    const stillHere=()=>S.phase==='tournamentInfo'&&S._tiView===view;
    if(!eventCode){
      if(stillHere()){
        alert('現在、開催中の大会はありません。\n大会が開始されるまでお待ちください。');
        S._tiView=null;S._tiLoading=false;S.phase='setup';render();

    S._tiEventCode=String(eventCode);

    const tour=AD.tournaments&&AD.tournaments.find(t=>t.eventCode===eventCode);

  const bprk=document.getElementById('btn-prelim-rank');

  const bprkb=document.getElementById('btn-prelim-rank-back');
  if(bprkb)bprkb.onclick=()=>{S._tiPrelimRankOpen=false;render();try{window.scrollTo(0,0);}catch(e){}};
  // 【8-8】選んだチームの予選の試合に、スコアシートがあるかを確かめる（あれば「スコアシートを確認」が出る）
  /* 【2026-10-26】現在地：ホーム（受付済み）と試合システムの画面で、結果・対戦表・タイムスケジュールを読む */
  if(S.phase==='setup'||(S.phase==='tournamentInfo'&&S._tiView==='system'))maybeRefreshPos_();
  if(S.phase==='setup'){const _lt=posLiveTour_();if(_lt)maybeLoadLiveSched_(_lt);}
  if(S.phase==='setup'&&(S._liveEvents||[]).length>=2&&!getSelectedLiveKey())maybeSyncPickTours_();   // 【2026-10-26】選ぶ画面の色   // 【2026-10-26】開催中カードのタイムスケジュール
  const _pts=document.getElementById('pos-team-select');
  if(_pts)_pts.onchange=()=>{S._posTeamNo=_pts.value;render();};
  /* 【2026-10-26】トーナメント表：結果が届いた試合を読み、スコアシートがあるかを確かめる（あれば 📋 が出る） */
  if(S.phase==='tournamentInfo'&&S._tiView==='bracket'&&!S._tiLoading){
    const _bt=S._editingTourId?AD.tournaments.find(t=>t.id===S._editingTourId):tiTour();
    const _bk=_bt?sbEventKeyOf_(_bt):'';
    if(_bk&&S._brSentTried!==_bk){
      S._brSentTried=_bk;
      loadSentResults_(_bt).then(()=>{if(S.phase==='tournamentInfo'&&S._tiView==='bracket')render();}).catch(()=>{});
    }else if(Array.isArray(S._brSheetIds)&&!S._brThrowsBusy){
      const _need=S._brSheetIds.filter(id=>_throwsKnown[id]===undefined);
      if(_need.length){
        S._brThrowsBusy=true;
        loadThrowsKnown_(_need).then(ok=>{S._brThrowsBusy=false;if(ok&&S.phase==='tournamentInfo'&&S._tiView==='bracket')render();});
      }
    }
  }
  document.querySelectorAll('.br-sheet').forEach(g=>g.addEventListener('click',()=>openScoreSheetFor_(g.getAttribute('data-matchid'),'tournamentInfo','')));
  if(S.phase==='tournamentInfo'&&S._tiView==='prelim'&&S._tiPrelimSelected){
    const _t=tiTour(),_sel=S._tiPrelimSelected;
    const _n=Math.min(Math.max(Number(S._tiPrelimMatches)||3,1),9);
    const _ids=[];
    for(let m=1;m<=_n;m++){if(_sel['mid'+m]){_ids.push(_sel['mid'+m]);continue;}const mt=prelimMatchOf_(_t,_sel.teamNo,m);if(mt)_ids.push(mt.matchId);}
    if(_ids.some(id=>_throwsKnown[id]===undefined)){
      loadThrowsKnown_(_ids).then(ok=>{if(ok&&S.phase==='tournamentInfo'&&S._tiView==='prelim')render();});
    }
  }
  // 予選結果 - 検索
  const tpi=document.getElementById('ti-prelim-input');
  const tps=document.getElementById('ti-prelim-search');
  const doPrelimSearch=()=>{
    const q=(document.getElementById('ti-prelim-input')||{value:''}).value.trim();
    S._tiPrelimQuery=q;
    if(!q){S._tiPrelimSelected=null;render();return;}
    // チームNoで一致検索（前ゼロ無視でも一致するように）
    const found=S._tiPrelim.find(t=>t.teamNo===q||String(parseInt(t.teamNo,10))===String(parseInt(q,10)));
    S._tiPrelimSelected=found||null;
    render();
  };
  if(tps)tps.onclick=doPrelimSearch;
  if(tpi)tpi.addEventListener('keydown',e=>{if(e.key==='Enter')doPrelimSearch();});
  // 予選結果 - チーム名／チームNoのタブ切替
  document.querySelectorAll('.ti-prelim-mode-tab').forEach(el=>el.addEventListener('click',()=>{
    S._tiPrelimMode=el.dataset.mode;
    render();
  }));
  // 予選結果 - チーム名プルダウンで選択 → 即結果表示
  const tpsel=document.getElementById('ti-prelim-select');
  if(tpsel)tpsel.addEventListener('change',()=>{
    const v=tpsel.value;
    S._tiPrelimQuery=v;
    S._tiPrelimSelected=v?(S._tiPrelim.find(t=>String(t.teamNo)===v||String(parseInt(t.teamNo,10))===String(parseInt(v,10)))||null):null;
    render();
  });
  // チームNo検索 - キーワード入力でリアルタイム絞り込み（一覧のみ差し替えてフォーカス維持）
  const tsi=document.getElementById('ts-input');
  if(tsi)tsi.addEventListener('input',()=>{
    S._tsQuery=tsi.value;
    const list=document.getElementById('ts-list');
    if(list)list.innerHTML=buildTeamSearchList(S._tsQuery);
  });
}
// ===== カメラアプリ等からのディープリンク起動 =====
// QRに埋め込まれたURL（…/#/m/＜試合ID＞）を起動時に解釈し、
// 大会ガード（配信中・開催期間内）を通したうえで対戦カード確認（選択モード）に着地させる。
function parseDeepLinkId(){
  // 形式: #/m/＜試合ID＞ （将来の拡張のため /r/ も受理して同じ着地にする）
  const h=(location.hash||'').trim();
  const m=h.match(/^#\/[mr]\/(.+)$/);
  if(m&&m[1])return decodeURIComponent(m[1]).trim();
  return null;
}
let _deepLinkBusy=false;
async function enterMatchFromDeepLink(rawId){
  const id=(rawId||'').trim();
  if(!id)return;
  if(_deepLinkBusy)return; // 処理中の多重起動を防ぐ
  // 試合中・結果入力中などに割り込むと内容が失われるため確認
  const inProgress=(typeof IN_GAME_PHASES!=='undefined'&&IN_GAME_PHASES.includes(S.phase))
    ||S.phase==='resultOnlyInput';
  if(inProgress){
    if(!confirm('別の試合のQRが読み込まれました。\n現在の入力内容を破棄して新しい試合に切り替えますか？')){
      // キャンセル時はハッシュだけ消して現状維持
      try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
      return;
    }
  }
  _deepLinkBusy=true;
  try{
  // ハッシュは一度消費したら消す（リロードや戻る操作で再発火しないように）
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){location.hash='';}

  // 大会ガード（試合IDで開始ボタンと同じ判定）
  const eventCode=await resolveActiveEventCode();
  if(!eventCode){
    alert('現在、開催中の大会はありません。\n大会が開始されるまでお待ちください。');
    S.phase='setup';render();return;
  }
  await syncAllFromGitHub(eventCode);
  const tour=AD.tournaments&&AD.tournaments.find(t=>t.eventCode===eventCode);
  if(tour){AD.activeTourId=tour.id;saveAdmin(AD);}
  const ps=tour&&tour.eventPeriodStart;
  const pe=tour&&tour.eventPeriodEnd;
  if(!ps||!pe){
    alert('試合開催期間が設定されていません。\n管理者にお問い合わせください。');
    S.phase='setup';render();return;
  }
  const now=new Date(),start=new Date(ps),end=new Date(pe);
  const fmt=d=>`${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  if(now<start){alert(`試合開催期間は${fmt(start)}からです。`);S.phase='setup';render();return;}
  if(now>end){alert('今大会の試合開催期間は終了しました。');S.phase='setup';render();return;}

  // 試合ID解決 → 対戦カード確認（選択モード：試合開始 / 結果のみ送信）
  const result=resolveMatchId(id);
  if(!result){
    alert('QRコードの試合IDが正しくありません。\nホームから試合IDを入力してください。');
    S.phase='setup';render();return;
  }
  S._matchIdInput=id;S._matchIdError='';
  S.matchIdData=result;
  S._matchConfirmMode='choose';
  S._matchConfirmFrom='setup'; // 「戻る」でホームへ
  S.phase='matchConfirm';render();
  }finally{_deepLinkBusy=false;}
}

(function bootstrapDeepLink(){
  const id=parseDeepLinkId();
  render(); // まず通常描画
  if(id)enterMatchFromDeepLink(id); // ディープリンクがあれば非同期で着地
})();

// 2回目以降：同じタブが開いたままカメラから別のQRを開くと、
// ページは再読み込みされずハッシュだけが書き換わる。これを検知して再着地する。
window.addEventListener('hashchange',()=>{
  const id=parseDeepLinkId();
  if(id)enterMatchFromDeepLink(id);
});
</script>
