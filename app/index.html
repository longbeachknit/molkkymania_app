// ===== 試合システム図（残り試合数の確認用） =====
// データ構造:
//   { enabled, cornerLabel, prelims:[文字列...], rowLabels:[文字列...],
//     legend:[{label,color}], columns:[{name,startRow,note,cells:[文字列...]}],
//     colors:{ 列名:色キー }, loseArrows:{ "列名@行index":true/false } }
//   ・色は図の構成テキストとは分離して colors マップで管理（10色パレット）
//   ・loseArrows は自動判定の上書き（負け矢印を消す/出す）。未指定なら自動。
//   ・列名に \n または <br> を入れると2行に折り返す。
const SC_PALETTE=[
  {key:'gray',  label:'グレー（表裏）',  bg:'#D9D9D9',bd:'#9e9e9e',tx:'#333333'},
  {key:'pink',  label:'ピンク（3先）',  bg:'#F2DCDC',bd:'#D9A6A6',tx:'#5a2d2d'},
  {key:'green', label:'グリーン（2先）',bg:'#E2EFDA',bd:'#A9C98C',tx:'#2f4a1a'},
  {key:'blue',  label:'ブルー',        bg:'#DCE7F5',bd:'#9DB9E0',tx:'#1e3a66'},
  {key:'yellow',label:'イエロー',      bg:'#FBF0C9',bd:'#E6CF7A',tx:'#6b5510'},
  {key:'purple',label:'パープル',      bg:'#E7DDF2',bd:'#BFA6DD',tx:'#432a63'},
  {key:'orange',label:'オレンジ',      bg:'#FCE3CF',bd:'#EFB483',tx:'#7a3e12'},
  {key:'teal',  label:'ティール',      bg:'#D2EDEA',bd:'#8FCFC7',tx:'#134e48'},
  {key:'red',   label:'レッド',        bg:'#F6D4D2',bd:'#E59C97',tx:'#7a1f1a'},
  {key:'indigo',label:'インディゴ',    bg:'#D9DCEC',bd:'#A3A9D1',tx:'#2a2e63'},
  {key:'white', label:'ホワイト（交流戦）',bg:'#FFFFFF',bd:'#555555',tx:'#222222'}   // 【追加】交流戦などの白い箱
];
const SC_COLORS={};SC_PALETTE.forEach(p=>{SC_COLORS[p.key]={bg:p.bg,bd:p.bd,tx:p.tx};});
function scEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escSc_(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function scCircled(n){const m=['','①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];return m[n]||('('+n+')');}
function scColorOf(v){
  v=String(v||'').trim().toLowerCase();
  const alias={'表裏':'gray','grey':'gray','round2':'gray','gy':'gray',
    '3先':'pink','best3':'pink','3sen':'pink',
    '2先':'green','best2':'green','2sen':'green',
    '青':'blue','黄':'yellow','紫':'purple','橙':'orange','緑':'green','赤':'red','灰':'gray'};
  if(SC_COLORS[v])return v;
  if(alias[v])return alias[v];
  return'green';
}
function fmtToColor(f){return f==='best3'?'pink':f==='round2'?'gray':'green';}
// 既存の壊れたデータ対策：「決勝」の直後に「3決」等が別セルに分かれていたら結合
function scRepairCols(columns){
  const isThird=s=>/^[0-9０-９]+\s*位?\s*決(定戦?)?$/.test(String(s||'').trim());
  return(columns||[]).map(col=>{
    const out=[];
    (col.cells||[]).forEach(cell=>{
      const prev=out.length?out[out.length-1]:null;
      if((prev==='決勝'||prev==='決勝戦')&&isThird(cell)){out[out.length-1]=prev+'、'+cell;}
      else{out.push(cell);}
    });
    return Object.assign({},col,{cells:out});
  });
}
// 列名を2行対応のHTMLに（\n / <br> を改行に）
function scNameHtml(name){return String(name==null?'':name).split(/\\n|<br\s*\/?>/i).map(scEsc).join('<br>');}
// 列の実効色を解決（colorsマップ優先、なければ旧col.color、なければgreen）
function scColData(ch,col){
  const k=(ch&&ch.colors&&ch.colors[col.name])||col.color||'green';
  return SC_COLORS[scColorOf(k)]||SC_COLORS.green;
}
// セル単位の色を解決。cellColors（「列名@行index」）があればそれを優先し、無ければ列の色。
// ※ 優先ルールが「試合区分」寄りだと、同じ列でも行ごとに試合形式（色）が変わるため。
function scCellData(ch,col,rowIdx){
  const ck=ch&&ch.cellColors&&ch.cellColors[col.name+'@'+rowIdx];
  if(ck)return SC_COLORS[scColorOf(ck)]||SC_COLORS.green;
  return scColData(ch,col);
}
// 実際の試合形式の決まり方（resolveMatch と同じ判定）を図にも使う。
// ラウンドごとの優先上書き → 無ければ大会全体の優先ルール、の順で参照する。
function scEffRule(obj,matchCode,tourneyCode){
  const rr=(obj.roundRules||[]).find(r=>r.matchCode===matchCode&&r.tourneyCode===tourneyCode);
  const prio=(rr&&rr.prio)?rr.prio:(obj.priority||'tournament');
  if(prio==='tournament'){
    return(obj.tourneyRules||[]).find(r=>r.code===tourneyCode)||(obj.matchRules||[]).find(r=>r.code===matchCode)||null;
  }
  return(obj.matchRules||[]).find(r=>r.code===matchCode)||(obj.tourneyRules||[]).find(r=>r.code===tourneyCode)||null;
}

// 大会ルール（試合区分×トーナメント種類×ラウンド名）から図のたたき台を自動生成
function buildSystemChartFromRules(obj){
  const mr=obj.matchRules||[],tr=obj.tourneyRules||[],rr=obj.roundRules||[];
  const usedMatch=[];rr.forEach(r=>{if(!usedMatch.includes(r.matchCode))usedMatch.push(r.matchCode);});
  const rowCodes=mr.map(m=>m.code).filter(c=>usedMatch.includes(c));
  usedMatch.forEach(c=>{if(!rowCodes.includes(c))rowCodes.push(c);});
  const rowLabels=rowCodes.map(c=>{const m=mr.find(x=>x.code===c);return(m&&m.name)?m.name:('第'+c+'試合');});
  const usedTour=[];rr.forEach(r=>{if(!usedTour.includes(r.tourneyCode))usedTour.push(r.tourneyCode);});
  const colCodes=tr.map(t=>t.code).filter(c=>usedTour.includes(c));
  usedTour.forEach(c=>{if(!colCodes.includes(c))colCodes.push(c);});
  const colors={};
  const cellColors={};
  const usedFmts=[];
  const columns=colCodes.map(tc=>{
    const tRule=tr.find(t=>t.code===tc);
    const byRow=rowCodes.map(mc=>{const rule=rr.find(r=>r.matchCode===mc&&r.tourneyCode===tc);return rule?(rule.round||''):null;});
    let start=byRow.findIndex(c=>c!=null);if(start<0)start=0;
    let cells=byRow.slice(start);
    while(cells.length&&cells[cells.length-1]==null)cells.pop();
    cells=cells.map(c=>c==null?'':c);
    const name=(tRule&&tRule.name)?tRule.name:('T'+tc);
    // 各セルの試合形式を、優先ルール（ラウンド個別の上書きを含む）で決める
    const fmts=cells.map((cell,i)=>{
      if(cell==='')return null;
      const mc=rowCodes[start+i];
      const eff=scEffRule(obj,mc,tc);
      return eff?(eff.fmt||''):'';
    });
    // 列の代表色＝その列で一番多い形式。異なるセルだけ個別色で上書きする
    const tally={};fmts.forEach(f=>{if(f!=null)tally[f]=(tally[f]||0)+1;});
    let major=null,best=-1;
    Object.keys(tally).forEach(f=>{if(tally[f]>best){best=tally[f];major=f;}});
    if(major==null)major=tRule?(tRule.fmt||''):'';
    colors[name]=fmtToColor(major);
    fmts.forEach((f,i)=>{
      if(f==null)return;
      if(!usedFmts.includes(f))usedFmts.push(f);
      if(f!==major)cellColors[name+'@'+(start+i)]=fmtToColor(f);
    });
    return{name,startRow:start,note:'',cells};
  }).filter(c=>c.cells.length>0);
  const prelims=mr.filter(m=>!usedMatch.includes(m.code)).map(m=>m.name||('予選'+m.code));
  // 凡例は「実際に使われている試合形式」だけを並べる
  const fmtLabel=f=>f==='best3'?'3先':f==='round2'?'表裏':'2先';
  const order=['round2','best3','best2'];
  const legend=order.filter(f=>usedFmts.includes(f)).map(f=>({label:fmtLabel(f),color:fmtToColor(f)}));
  usedFmts.forEach(f=>{if(!order.includes(f))legend.push({label:fmtLabel(f),color:fmtToColor(f)});});
  return{enabled:true,cornerLabel:'',prelims,rowLabels,
    legend:legend.length?legend:[{label:'2先',color:'green'}],
    columns,colors,cellColors,loseArrows:{},loseTo:{}};
}

// 図オブジェクト → 構成テキスト（※色・矢印は含めない＝別管理）
function systemChartToText(ch){
  if(!ch)return'';
  const L=[];
  if(ch.cornerLabel)L.push('タイトル: '+ch.cornerLabel);
  if(ch.prelims&&ch.prelims.length)L.push('予選: '+ch.prelims.map(p=>{
    const n=scPrelimName(p),sp=scPrelimSpan(p);return sp?(n+'*'+sp):n;
  }).join(' | '));
  if(ch.rowLabels&&ch.rowLabels.length)L.push('行: '+ch.rowLabels.join(' | '));
  if(ch.legend&&ch.legend.length)L.push('凡例: '+ch.legend.map(x=>x.label+'='+x.color).join(' | '));
  L.push('');
  (ch.columns||[]).forEach(c=>{
    L.push([c.name,String((c.startRow||0)+1),c.note||'',(c.cells||[]).join(', ')].join(' | '));
  });
  return L.join('\n');
}

// 構成テキスト → 図オブジェクト（色・矢印は含まない）
// 列の書式: 新「名前 | 開始行 | 注記 | 回戦...」/ 旧「名前 | 色 | 開始行 | 注記 | 回戦...」両対応
function systemChartFromText(txt){
  const ch={enabled:true,cornerLabel:'',prelims:[],rowLabels:[],legend:[],columns:[],colors:{},loseArrows:{},loseTo:{}};
  (txt||'').split('\n').forEach(raw=>{
    const line=raw.trim();
    if(!line||line[0]==='#')return;
    const km=line.match(/^([^|:：]+)[:：]\s*(.*)$/);
    const key=km?km[1].trim().toLowerCase():'';
    if(km&&/^(タイトル|title)$/.test(key)){ch.cornerLabel=km[2].trim();return;}
    if(km&&/^(予選|prelim|prelims)$/.test(key)){
      // 「二次予選*1」と書くと、左から1列ぶんの幅の短いバーになる
      ch.prelims=km[2].split(/[|,，]/).map(x=>x.trim()).filter(Boolean).map(x=>{
        const m2=x.match(/^(.*?)\s*\*\s*(\d+)$/);
        return m2?{name:m2[1].trim(),span:parseInt(m2[2],10)}:x;
      });
      return;
    }
    if(km&&/^(行|行ラベル|rows|row)$/.test(key)){ch.rowLabels=km[2].split(/[|,，]/).map(x=>x.trim()).filter(Boolean);return;}
    if(km&&/^(凡例|legend)$/.test(key)){
      ch.legend=km[2].split('|').map(x=>x.trim()).filter(Boolean).map(p=>{const mm=p.split('=');return{label:(mm[0]||'').trim(),color:scColorOf(mm[1])};});
      return;
    }
    if(line.includes('|')){
      const f=line.split('|').map(x=>x.trim());
      const name=f[0]||'';
      let color=null,start,note,cellsRaw;
      // f[1]が整数なら新書式(開始行)、そうでなければ旧書式(色)
      if(/^\d+$/.test(f[1]||'')){
        start=parseInt(f[1],10);note=f[2]||'';cellsRaw=f[3]||'';
      }else{
        color=f[1]||null;start=parseInt(f[2],10);note=f[3]||'';cellsRaw=f[4]||'';
      }
      if(isNaN(start)||start<1)start=1;
      const cells=cellsRaw.split(/[,，]/).map(x=>x.trim());
      while(cells.length&&cells[cells.length-1]==='')cells.pop();
      if(name&&cells.length){
        const col={name,startRow:start-1,note,cells};
        if(color){const ck=scColorOf(color);ch.colors[name]=ck;col.color=ck;}
        ch.columns.push(col);
      }
    }
  });
  ch.columns=scRepairCols(ch.columns);
  return ch;
}

// 構成テキストを既存オブジェクトに適用（色・矢印は保持）
function scApplyStructureText(obj,text){
  const parsed=systemChartFromText(text);
  const oldColors=(obj&&obj.colors)?obj.colors:{};
  const oldArrows=(obj&&obj.loseArrows)?obj.loseArrows:{};
  const colors={};
  parsed.columns.forEach(c=>{
    // 旧テキスト由来の色 < 既存colorsマップ を優先
    if(oldColors[c.name])colors[c.name]=oldColors[c.name];
    else if(c.color)colors[c.name]=c.color;
  });
  // 既存マップのうち現存列のものを引き継ぎ（テキストに色が無い新書式でも保持）
  Object.keys(oldColors).forEach(n=>{if(!colors[n]&&parsed.columns.some(c=>c.name===n))colors[n]=oldColors[n];});
  parsed.colors=colors;
  // 矢印オーバーライドは現存する列に関係するものだけ残す
  const arrows={};
  Object.keys(oldArrows).forEach(k=>{const nm=k.split('@')[0];if(parsed.columns.some(c=>c.name===nm))arrows[k]=oldArrows[k];});
  parsed.loseArrows=arrows;
  // 【8-6】「負けたチームの行き先」も、出発の列と行き先の列が両方とも残っているものだけ引き継ぐ
  const oldTo=(obj&&obj.loseTo)?obj.loseTo:{};
  const to={};
  Object.keys(oldTo).forEach(k=>{
    const nm=k.split('@')[0];
    // 行き先は「交流戦」だけでなく「交流戦@2」（2つ下の回戦）と書けるので、
    // ＠より前だけを取り出して列名と見くらべる。
    // ※ここで＠を外し忘れていたため、「決勝トーナメント→交流戦②」の指定が
    //   保存のたびに消えてしまっていた（8-6 の不具合）。
    const dest=scSplitRef(oldTo[k]).name;
    if(parsed.columns.some(c=>c.name===nm)&&parsed.columns.some(c=>c.name===dest))to[k]=oldTo[k];
  });
  parsed.loseTo=to;
  // 【8-6】テンプレが持っている追加の矢印（予選から次点32チームへ、など）も引き継ぐ
  const oldLinks=(obj&&Array.isArray(obj.links))?obj.links:[];
  const nameOK=v=>{const p=scSplitRef(v);return /^(予選|prelim|prelims)$/i.test(p.name)||parsed.columns.some(c=>c.name===p.name);};
  void scPrelimName;
  parsed.links=oldLinks.filter(l=>l&&nameOK(l.from)&&nameOK(l.to));
  if(obj&&obj.autoLose!==undefined)parsed.autoLose=obj.autoLose;
  // 予選バーの色は構成テキストに書けないので、同じ名前のものから引き継ぐ
  const oldPre=(obj&&Array.isArray(obj.prelims))?obj.prelims:[];
  parsed.prelims=(parsed.prelims||[]).map(p=>{
    const nm=scPrelimName(p);
    const src=oldPre.find(o=>scPrelimName(o)===nm);
    const col=(src&&typeof src==='object')?src.color:null;
    // 置き場所（offset）も構成テキストには書けないので、色と同じように名前で引き継ぐ
    const off=(src&&typeof src==='object')?src.offset:null;
    if(!col&&!off)return p;
    const base=(typeof p==='object')?Object.assign({},p):{name:nm};
    if(col)base.color=col;
    if(off)base.offset=off;
    return base;
  });
  // セル個別色も同様に、現存する列のものだけ引き継ぐ
  const oldCellColors=(obj&&obj.cellColors)?obj.cellColors:{};
  const cellColors={};
  Object.keys(oldCellColors).forEach(k=>{const nm=k.split('@')[0];if(parsed.columns.some(c=>c.name===nm))cellColors[k]=oldCellColors[k];});
  parsed.cellColors=cellColors;
  return parsed;
}

/* =========================================================================
   図オブジェクト → 表示HTML

   【8-6 手直し】矢印の描き方を作り直した。
     ・箱（試合）と予選のバーは、これまでどおり表（テーブル）で並べる。
     ・矢印は、表の上に重ねた透明な絵（SVG）にあとから描く（scPaint）。
       こうすると「箱から箱へ」きちんとつながる線が引けるので、
         ・となりの列だけでなく、離れた列へ
         ・右だけでなく、左へ
         ・1つ下の行だけでなく、2つ下の行へ
       も自由に矢印を出せる。
     ・editable=true（管理者のプレビュー）では、箱をタップすると
       「負けたチームの行き先」を選べる。
   ========================================================================= */
const SC_REG={};        // 描いた図を id で覚えておく（あとで矢印を描くときに使う）
let SC_REG_SEQ=0;

/* 行き先の書き方を読み解く
     '交流戦'    → 名前だけ（行は「1つ下」）
     '交流戦@3'  → 上から4番目の行（0から数えて3）の交流戦 */
function scSplitRef(v){
  const s=String(v==null?'':v);
  const i=s.lastIndexOf('@');
  if(i<0)return{name:s,row:null};
  const n=parseInt(s.slice(i+1),10);
  if(isNaN(n))return{name:s.slice(0,i),row:null};
  return{name:s.slice(0,i),row:n};
}
/* '予選@2' や 'Bトーナメント@1' を、図の中の場所に変換する */
function scRefToPos(v,cols){
  const p=scSplitRef(v);
  if(p.row==null)return null;
  if(/^(予選|prelim|prelims)$/i.test(p.name))return{k:'prelim',i:p.row};
  const c=cols.findIndex(x=>x.name===p.name);
  if(c<0)return null;
  return{k:'cell',c:c,r:p.row};
}
/* 予選のバーは「文字だけ」でも「{name, span} の形」でも書ける。
   span＝左から何列ぶんの幅にするか（省略すると全部の列にまたがる横長のバー）。
   例：二次予選は上位64チームだけが戦うので span:1（決勝トーナメントの列だけ）にする。
   こうすると右側があくので、一次予選からBトーナメントへ矢印を通せる。 */
function scPrelimName(p){return (p&&typeof p==='object')?String(p.name||''):String(p==null?'':p);}
function scPrelimSpan(p){const n=(p&&typeof p==='object')?parseInt(p.span,10):NaN;return (n>=1)?n:0;}
function scPrelimColor(p){const k=(p&&typeof p==='object')?p.color:null;return SC_COLORS[scColorOf(k||'gray')]||SC_COLORS.gray;}
/* 予選バーを「左から何列ぶん空けて」置くか。0（未指定）＝いちばん左。
   例）3列の図で offset:1 なら、真ん中の列の上に置かれる。 */
function scPrelimOffset(p){const n=(p&&typeof p==='object')?parseInt(p.offset,10):NaN;return (n>=1)?n:0;}

/* 図の中で「何試合目まであるか」 */
function scMaxRows(cols){
  let m=0;(cols||[]).forEach(col=>{m=Math.max(m,(col.startRow||0)+col.cells.length);});
  return m;
}
/* 図に描く矢印を全部集める
     ① これまでの「負け」矢印（自動＋ch.loseArrows／ch.loseTo による指定）
     ② テンプレなどが持っている追加の矢印（ch.links）
   返す形： {from,to,kind:'lose'|'plain',label} */
function scCollectLinks(ch,cols){
  const cellOf=(ci,ri)=>{const col=cols[ci];if(!col)return null;const i=ri-(col.startRow||0);return(i>=0&&i<col.cells.length)?col.cells[i]:null;};
  const has=(ci,ri)=>{const v=cellOf(ci,ri);return v!=null&&v!=='';};
  const out=[];
  const maxRows=scMaxRows(cols);
  for(let c=0;c<cols.length;c++){
    for(let r=0;r<maxRows;r++){
      if(!has(c,r))continue;
      const key=cols[c].name+'@'+r;
      let d=c+1,s=r+1;
      const raw=ch.loseTo&&ch.loseTo[key];
      if(raw){
        const p=scSplitRef(raw);
        const i=cols.findIndex(x=>x.name===p.name);
        if(i>=0&&i!==c){d=i;s=(p.row==null)?r+1:p.row;}
      }
      const auto=(ch.autoLose!==false)&&d>=0&&d<cols.length&&has(d,s);
      const ov=ch.loseArrows?ch.loseArrows[key]:undefined;
      const on=(ov===true)?true:((ov===false)?false:auto);
      if(!on)continue;
      if(d<0||d>=cols.length||d===c||!has(d,s))continue;
      out.push({from:{k:'cell',c:c,r:r},to:{k:'cell',c:d,r:s},kind:'lose',label:'負け',src:'lose',key:key});
    }
  }
  (ch.links||[]).forEach((l,li)=>{
    if(!l)return;
    const a=scRefToPos(l.from,cols),b=scRefToPos(l.to,cols);
    if(!a||!b)return;
    const nPre=((ch.prelims||[]).length);
    if(b.k==='cell'&&!has(b.c,b.r))return;
    if(a.k==='cell'&&!has(a.c,a.r))return;
    if(a.k==='prelim'&&(a.i<0||a.i>=nPre))return;
    if(b.k==='prelim'&&(b.i<0||b.i>=nPre))return;
    out.push({from:a,to:b,kind:(l.kind==='lose'?'lose':'plain'),ci:(l.ci==null?null:Number(l.ci)),label:(l.label==null?'':String(l.label)),src:'link',li:li});
  });
  return out;
}


function renderSystemChart(ch,editable,mark){   // 【2026-10-26】mark={c,r} … 「いまここ」の印を付ける箱
  if(!ch||!ch.columns||!ch.columns.length){
    return'<div style="font-size:13px;color:#9ca3af;padding:24px 12px;text-align:center;">試合システム図はまだ設定されていません。<br>管理者画面の「大会設定」または「ルールテンプレート」で登録してください。</div>';
  }
  const cols=scRepairCols(ch.columns),nCols=cols.length;
  const cellOf=(c,r)=>{const col=cols[c];const i=r-(col.startRow||0);return(i>=0&&i<col.cells.length)?col.cells[i]:null;};
  const hasCell=(c,r)=>{const v=cellOf(c,r);return v!=null&&v!=='';};
  const maxRows=scMaxRows(cols);
  const rowLabels=ch.rowLabels||[];
  const totalGrid=nCols*2-1;
  const regId='sc'+(++SC_REG_SEQ);
  SC_REG[regId]={ch:ch,cols:cols,editable:!!editable};

  // 横スクロール不要で全体が収まるよう、幅を100%に固定し列幅を％配分する
  const labelPct=nCols>=5?11:(nCols>=4?12:14);   // 「第10試合」が折り返さない幅
  const gapPct=nCols>=5?3:5.5;   // 矢印が縦に通れるだけのすき間をあける
  const cellPct=Math.max(6,(100-labelPct-(nCols-1)*gapPct)/nCols);
  const fs=nCols>=5?10:(nCols>=4?11:12);
  let cg='<colgroup>';
  cg+=`<col style="width:${labelPct}%">`;
  for(let c=0;c<nCols;c++){cg+=`<col style="width:${cellPct}%">`;if(c<nCols-1)cg+=`<col style="width:${gapPct}%">`;}
  cg+='</colgroup>';
  let h=`<table style="border-collapse:collapse;width:100%;table-layout:fixed;font-size:${fs}px;">`+cg;

  // ── ヘッダ ──
  h+='<tr>';
  const _corner=(ch.cornerLabel||'').trim();
  h+=_corner
    ?`<td style="background:${SC_COLORS.pink.bg};border:1px solid ${SC_COLORS.pink.bd};color:${SC_COLORS.pink.tx};font-weight:800;text-align:center;padding:6px 3px;white-space:normal;word-break:break-word;line-height:1.2;">${scNameHtml(ch.cornerLabel)}</td>`
    :`<td style="border-bottom:2px solid #cfcfcf;"></td>`;
  for(let c=0;c<nCols;c++){
    h+=`<td style="border-bottom:2px solid #cfcfcf;font-weight:700;text-align:center;padding:6px 3px;color:#333;white-space:normal;word-break:break-word;overflow-wrap:anywhere;line-height:1.2;">${scNameHtml(cols[c].name)}</td>`;
    if(c<nCols-1)h+=`<td style="border-bottom:2px solid #cfcfcf;"></td>`;
  }
  h+='</tr>';
  h+=`<tr><td colspan="${totalGrid+1}" style="height:8px;"></td></tr>`;

  // ── 予選（横長バー）──
  (ch.prelims||[]).forEach((p,i)=>{
    const pname=scPrelimName(p);
    let span=scPrelimSpan(p);
    if(!span||span>nCols)span=nCols;             // 指定なし＝全部の列にまたがる
    const barCells=Math.min(totalGrid,2*span-1); // 表の中で何マスぶんか
    h+='<tr>';
    h+=`<td style="text-align:center;padding:4px 1px;color:#444;white-space:nowrap;font-size:${Math.max(9,fs-1)}px;line-height:1.2;">予選${scCircled(i+1)}</td>`;
    const pc=scPrelimColor(p);
    /* 左をどれだけ空けるか。列と列のあいだにも1マスあるので、1列ぶん＝2マス。
       はみ出す指定は、右端に収まるところまで戻す。 */
    let off=scPrelimOffset(p);
    if(off+span>nCols)off=Math.max(0,nCols-span);
    const leadCells=Math.min(Math.max(0,totalGrid-barCells),2*off);
    if(leadCells>0)h+=`<td colspan="${leadCells}"></td>`;
    h+=`<td data-prelim="${i}" colspan="${barCells}" style="background:${pc.bg};border:1px solid ${pc.bd};text-align:center;padding:8px;color:${pc.tx};font-weight:600;">${scEsc(pname)}</td>`;
    const usedCells=leadCells+barCells;
    if(usedCells<totalGrid)h+=`<td colspan="${totalGrid-usedCells}"></td>`;
    h+='</tr>';
    // 予選のバーの下の空き ＝ 矢印がここを横に通れる「通路」
    h+=`<tr data-parow="${i}"><td colspan="${totalGrid+1}" style="height:26px;"></td></tr>`;
  });

  // ── トーナメント本体 ──
  for(let r=0;r<maxRows;r++){
    if(cols.some(c=>(c.startRow||0)===r&&c.note)){
      h+='<tr><td></td>';
      for(let c=0;c<nCols;c++){
        const note=((cols[c].startRow||0)===r&&cols[c].note)?`<span style="font-size:9px;color:#555;white-space:normal;word-break:break-word;line-height:1.15;display:inline-block;">※${scEsc(cols[c].note)}</span>`:'';
        h+=`<td style="text-align:center;padding:2px 0;">${note}</td>`;
        if(c<nCols-1)h+='<td></td>';
      }
      h+='</tr>';
    }
    h+='<tr>';
    h+=`<td style="text-align:center;padding:3px 1px;color:#444;white-space:nowrap;font-size:${Math.max(9,fs-1)}px;line-height:1.2;">${scEsc(rowLabels[r]||('第'+(r+1)+'試合'))}</td>`;
    for(let c=0;c<nCols;c++){
      if(hasCell(c,r)){
        const cc=scCellData(ch,cols[c],r);
        const ed=editable?` class="sc-box" data-c="${c}" data-r="${r}" title="タップすると「負けたチームの行き先」を選べます"`:'';
        const cur=editable?'cursor:pointer;':'';
        const _mk=!!(mark&&mark.c===c&&mark.r===r);
        h+=`<td data-cell="${c},${r}"${ed} style="${_mk?'outline:3px solid #f59e0b;outline-offset:1px;':''}${cur}background:${cc.bg};border:1px solid ${cc.bd};color:${cc.tx};text-align:center;padding:7px 3px;font-weight:600;white-space:normal;word-break:break-word;overflow-wrap:anywhere;line-height:1.25;">${_mk?'<div style="font-size:9px;font-weight:800;color:#b45309;">いまここ</div>':''}${scEsc(cellOf(c,r))}</td>`;
      }else{
        h+=`<td data-cell="${c},${r}"></td>`;
      }
      if(c<nCols-1)h+=`<td data-gap="${c},${r}"></td>`;
    }
    h+='</tr>';
    // 行と行のあいだ（勝ち矢印 ↓ を置く場所。負け矢印は上に重ねる絵で描く）
    if(r<maxRows-1){
      // 行と行のあいだ ＝ 矢印の「通路」。data-arow で場所を測れるようにしておく
      h+=`<tr data-arow="${r}"><td></td>`;
      for(let c=0;c<nCols;c++){
        const win=hasCell(c,r)&&hasCell(c,r+1);
        h+=`<td style="text-align:center;padding:0;height:36px;vertical-align:middle;">${win?'<span style="color:#E24B4A;font-size:13px;font-weight:900;">↓</span>':''}</td>`;
        if(c<nCols-1)h+=`<td></td>`;
      }
      h+='</tr>';
    }
  }
  h+='</table>';

  // ── 凡例 ──
  let legend='';
  if(ch.legend&&ch.legend.length){
    legend='<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:8px;">'+
      ch.legend.map(x=>{const cc=SC_COLORS[scColorOf(x.color)]||SC_COLORS.green;
        return`<div style="display:flex;align-items:center;gap:6px;"><span style="display:inline-block;width:26px;height:14px;background:${cc.bg};border:1px solid ${cc.bd};border-radius:3px;"></span><span style="font-size:12px;color:#374151;">${scEsc(x.label)}</span></div>`;
      }).join('')+'</div>';
  }
  const arrowLegend='<div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:10px;">'+
    '<span style="font-size:11px;color:#374151;"><span style="color:#E24B4A;font-weight:900;">↓</span> 勝ち（次の回戦へ）</span>'+
    '<span style="font-size:11px;color:#374151;"><span style="color:#2e72c4;font-weight:900;">━▶</span> 負け（別のトーナメントへ）</span>'+
    '<span style="font-size:11px;color:#374151;"><span style="color:#333;font-weight:900;">━▶</span> 予選からの進み先</span>'+
    '</div>'+
    '<div style="font-size:10.5px;color:#9ca3af;text-align:center;margin-bottom:10px;line-height:1.6;">負けの矢印は、出発するトーナメントごとに色を分けています。<br>点線は、回戦を1つ飛ばして進む矢印です。</div>';
  return legend+arrowLegend+`<div class="sc-chart" data-sc-id="${regId}" style="position:relative;width:100%;padding:2px 0 6px;">${h}<svg class="sc-links" style="position:absolute;left:0;top:0;pointer-events:none;overflow:visible;"></svg></div>`;
}

/* 表の上に矢印を描く（表を画面に出したあとに呼ぶ）。

   【8-6 手直し2】線が箱の上を横切らないよう、通り道を決めてから引く。
     ・箱の「下辺」から出て、行と行のあいだ（通路）へ下りる
     ・通路を横に進む（箱の中は通らない）
     ・回戦を飛ばす場合は、列と列のあいだ（すき間）を縦に下りる
     ・箱の「上辺」から入る
   出口と入口は箱の中心から左右にずらしてあるので、
   勝ちの ↓ 矢印や、ほかの矢印と重なりにくい。
   線の色は「出発するトーナメント」ごとに変えている。 */
/* 負けの矢印の色。ぜんぶ「青の仲間」でそろえてあるので、
   色が違っても「これは負けの矢印だ」と分かる。
   何番めの色になるかは「出発するトーナメント」で決まる。 */
const SC_LINK_COLORS=['#1d4ed8','#0891b2','#38a3f0','#4f46e5','#0e7490','#60a5fa'];
/* 【8-8】矢印をタップして消す
     l.src==='lose' … 負けの矢印。「表示しない」印を付ける（あとで箱をタップすれば戻せる）
     l.src==='link' … テンプレなどが持っている矢印。その1本だけを取り除く         */
function scDeleteLink(ch,l){
  if(!ch||!l)return false;
  if(l.src==='link'){
    if(ch.links&&l.li!=null&&l.li>=0&&l.li<ch.links.length){ch.links.splice(l.li,1);return true;}
    return false;
  }
  if(!l.key)return false;
  ch.loseArrows=ch.loseArrows||{};
  ch.loseArrows[l.key]=false;
  if(ch.loseTo)delete ch.loseTo[l.key];
  return true;
}

function scPaint(root){
  try{
    const reg=SC_REG[root.getAttribute('data-sc-id')];if(!reg)return;
    const svg=root.querySelector('svg.sc-links');if(!svg)return;
    const rb=root.getBoundingClientRect();
    if(!rb.width||!rb.height){svg.innerHTML='';return;}
    const q=sel=>root.querySelector(sel);
    const rect=el=>{if(!el)return null;const b=el.getBoundingClientRect();
      return{x:b.left-rb.left,y:b.top-rb.top,w:b.width,h:b.height,cx:b.left-rb.left+b.width/2,cy:b.top-rb.top+b.height/2};};
    const boxOf=ref=>ref.k==='prelim'?rect(q('[data-prelim="'+ref.i+'"]')):rect(q('[data-cell="'+ref.c+','+ref.r+'"]'));
    const gapBox=(gi,r)=>rect(q('[data-gap="'+gi+','+r+'"]'));
    const arow=r=>rect(q('[data-arow="'+r+'"]'));
    const parow=i=>rect(q('[data-parow="'+i+'"]'));
    /* 通路の中の「上寄り」の高さ。
       通路の真ん中には勝ちの ↓ が入るので、そこを避けて上側を横に通す。
       箱への入り口はここから下りるので、矢印の先が十分な長さになる。 */
    const corTop=r=>{const b=arow(r);return b?(b.y+6):null;};

    const links=scCollectLinks(reg.ch,reg.cols);

    // 同じすき間を縦に通る矢印は、少しずつ横へずらして重ならないようにする
    const groups={},lane={};
    links.forEach((l,i)=>{
      if(l.from.k!=='cell'||l.to.k!=='cell')return;
      if(l.to.r<=l.from.r+1)return;
      const gi=(l.to.c>l.from.c)?(l.to.c-1):l.to.c;
      (groups[gi]=groups[gi]||[]).push(i);
    });
    Object.keys(groups).forEach(gi=>{const a=groups[gi];a.forEach((idx,k)=>{lane[idx]=k-(a.length-1)/2;});});

    const colorOf=l=>{
      if(l.kind!=='lose')return '#333333';                     // 予選からの進み先などは黒
      const i=(l.ci!=null)?l.ci:(l.from.k==='cell'?(l.from.c||0):0);
      return SC_LINK_COLORS[i%SC_LINK_COLORS.length];
    };
    const ckey=c=>c.replace('#','');
    const used={};
    links.forEach(l=>{used[colorOf(l)]=1;});
    const mid='scmk_'+root.getAttribute('data-sc-id');
    let defs='<defs>';
    Object.keys(used).forEach(c=>{
      defs+='<marker id="'+mid+'_'+ckey(c)+'" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="'+c+'"/></marker>';
    });
    defs+='</defs>';
    const parts=[defs];
    const hits=[];   // 【8-8】矢印を押せるようにする透明な線（編集中だけ）

    links.forEach((l,idx)=>{
      const A=boxOf(l.from),B=boxOf(l.to);
      if(!A||!B)return;
      const color=colorOf(l);
      const mk=mid+'_'+ckey(color);
      let d,lx,ly,anchor='middle',dash='';

      if(l.from.k==='prelim'&&!(B.cx>=A.x+4&&B.cx<=A.x+A.w-4)){
        /* 予選のバーの真下に行き先が無い場合（バーが短いとき）。
           バーの端から出て、バーの下の通路を横に進んでから、箱の上辺へ下りる。 */
        const right=(B.cx>A.cx);
        const exX=right?(A.x+A.w-12):(A.x+12);
        const enX=B.cx+(right?-B.w*0.30:B.w*0.30);
        const pb=parow(l.from.i);
        const y1=pb?pb.cy:(A.y+A.h+12);
        d='M'+exX+','+(A.y+A.h+1)+' L'+exX+','+y1+' L'+enX+','+y1+' L'+enX+','+(B.y-3);
        lx=(exX+enX)/2;ly=y1;anchor='middle';
      }else if(l.from.k==='cell'&&l.to.k==='cell'&&l.from.r===l.to.r&&l.from.c!==l.to.c){
        /* 【追加 2026-10-14】同じ段（同じ試合）の箱どうしは、横にまっすぐ1本で引く。
           例）5位タイ決定T 1回戦 →（不戦勝の場合）→ 不戦勝交流戦②
           箱の横の辺から出て、行き先の箱の横の辺に入る。文字は線の上に置く。 */
        const right=l.to.c>l.from.c;
        const y=A.cy;
        const sx=right?(A.x+A.w+1):(A.x-1);
        const ex=right?(B.x-3):(B.x+B.w+3);
        d='M'+sx+','+y+' L'+ex+','+y;
        lx=(sx+ex)/2;ly=y-9;anchor='middle';
      }else if(l.from.k==='prelim'||(l.from.k==='cell'&&l.to.k==='cell'&&l.from.c===l.to.c)){
        // まっすぐ下へ（予選のバー → 真下の箱）
        const x=B.cx;
        d='M'+x+','+(A.y+A.h+1)+' L'+x+','+(B.y-3);
        const toRight=(x>rb.width*0.55);
        // 文字は線の出だし（バーのすぐ下）に置く。こうすると複数の矢印で高さがそろう。
        lx=x+(toRight?-6:6);ly=A.y+A.h+13;anchor=toRight?'end':'start';
      }else{
        const right=l.to.c>l.from.c;
        const exX=A.cx+(right?A.w*0.30:-A.w*0.30);   // 出口（箱の下辺）
        const enX=B.cx+(right?-B.w*0.30:B.w*0.30);   // 入口（箱の上辺）
        let y1=corTop(l.from.r); if(y1==null)y1=A.y+A.h+9;
        if(l.to.r===l.from.r+1){
          d='M'+exX+','+(A.y+A.h+1)+' L'+exX+','+y1+' L'+enX+','+y1+' L'+enX+','+(B.y-3);
          lx=(exX+enX)/2;ly=y1;anchor='middle';
        }else{
          const gi=right?(l.to.c-1):l.to.c;
          const gb=gapBox(gi,l.to.r)||gapBox(gi,l.from.r);
          const gw=gb?gb.w:14;
          let chx=(gb?gb.cx:(right?(B.x-8):(B.x+B.w+8)))+(lane[idx]||0)*Math.min(7,Math.max(3,gw/3));
          let y2=corTop(l.to.r-1); if(y2==null)y2=B.y-24;
          d='M'+exX+','+(A.y+A.h+1)+' L'+exX+','+y1+' L'+chx+','+y1+' L'+chx+','+y2+' L'+enX+','+y2+' L'+enX+','+(B.y-3);
          dash=' stroke-dasharray="5 3"';   // 回戦を飛ばして進む矢印は点線
          // 文字は、行き先の箱の手前（空いている通路）に置く
          lx=(chx+enX)/2;ly=y2;anchor='middle';
        }
      }
      parts.push('<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"'+dash+' marker-end="url(#'+mk+')"/>');
      // 【8-8】編集中は、矢印の上に「押せる透明な太い線」を重ねておく（細い矢印でも指で押せるように）
      if(reg.editable)hits.push('<path class="sc-hit" data-i="'+idx+'" d="'+d+'" fill="none" stroke="rgba(0,0,0,0)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" style="pointer-events:stroke;cursor:pointer;"><title>タップすると、この矢印を消せます</title></path>');
      const txt=l.label||'';
      if(txt)parts.push('<text x="'+lx+'" y="'+ly+'" font-size="10" font-weight="700" fill="'+color+'" text-anchor="'+anchor+'" dominant-baseline="middle" stroke="#fff" stroke-width="3.5" paint-order="stroke" style="paint-order:stroke;">'+scEsc(txt)+'</text>');
    });
    svg.setAttribute('width',rb.width);
    svg.setAttribute('height',rb.height);
    svg.innerHTML=parts.concat(hits).join('');

    // 【8-8】矢印をタップしたら、その矢印を消す（管理者のプレビューのときだけ）
    if(reg.editable){
      svg.querySelectorAll('path.sc-hit').forEach(p=>{
        p.addEventListener('click',ev=>{
          ev.stopPropagation();
          const l=links[parseInt(p.getAttribute('data-i'),10)];
          if(!l)return;
          const nm=(l.kind==='lose')?'負けの矢印':'矢印';
          if(!confirm('この'+nm+'を消しますか？\n\n（消したあとでも、出発する箱をタップして行き先を選び直せば元に戻せます）'))return;
          if(!scDeleteLink(reg.ch,l))return;
          if(window.SC_AFTER_ARROW_EDIT)window.SC_AFTER_ARROW_EDIT();
          else scPaintAll();
        });
      });
    }
  }catch(e){}
}
function scPaintAll(){try{document.querySelectorAll('.sc-chart').forEach(scPaint);}catch(e){}}
window.addEventListener('resize',function(){clearTimeout(window._scRepaintT);window._scRepaintT=setTimeout(scPaintAll,150);});


/* =========================================================================
   【8-6】試合システム図：「負けたチームの行き先」を選ぶ小さな画面
   管理者画面のプレビューで、うすい ↘ をタップすると出てくる。
     ch  … 図のデータ
     key … '列名@行番号'（どの試合の負けか）
     c   … 出発の列の番号 / r … 行の番号
   選んだ結果は ch.loseTo（行き先の列名）と ch.loseArrows（表示する/しない）に入る。
   ========================================================================= */
function showScArrowMenu(ch,c,r,done){
  const cols=scRepairCols(ch.columns||[]);
  if(!cols[c])return;
  const key=cols[c].name+'@'+r;
  const cellOf=(ci,ri)=>{const col=cols[ci];if(!col)return null;const i=ri-(col.startRow||0);return(i>=0&&i<col.cells.length)?col.cells[i]:null;};
  const plain=s=>String(s==null?'':s).replace(/\\n|<br\s*\/?>/ig,' ');
  // 行き先の候補＝ほかの列にある、これより下の行の箱（3行下まで）
  const cands=[];
  for(let s=r+1;s<=r+3;s++){
    for(let d=0;d<cols.length;d++){
      if(d===c)continue;
      const v=cellOf(d,s);
      if(v==null||v==='')continue;
      cands.push({c:d,r:s,name:cols[d].name,cell:v});
    }
  }
  // いまの設定
  let curC=c+1,curR=r+1;
  const raw=ch.loseTo&&ch.loseTo[key];
  if(raw){const p=scSplitRef(raw);const i=cols.findIndex(x=>x.name===p.name);if(i>=0){curC=i;curR=(p.row==null)?r+1:p.row;}}
  const curOff=!!(ch.loseArrows&&ch.loseArrows[key]===false);
  const fromCell=cellOf(c,r)||'';
  const btn=(label,val,on)=>`<button class="sc-dest-btn" data-v="${scEsc(val)}" style="width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:2px solid ${on?'#1D9E75':'#e5e7eb'};border-radius:10px;background:${on?'#E1F5EE':'#fff'};font-size:14px;font-weight:600;color:#111;cursor:pointer;">${label}</button>`;
  let list='';
  cands.forEach(x=>{
    const on=(!curOff)&&curC===x.c&&curR===x.r;
    list+=btn(scEsc(plain(x.name))+'　<span style="font-weight:400;color:#6b7280;">'+scEsc(x.cell)+'</span> へ',x.c+','+x.r,on);
  });
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1200;display:flex;align-items:center;justify-content:center;padding:16px;';
  overlay.innerHTML=`<div style="background:#fff;border-radius:12px;padding:18px;width:100%;max-width:400px;max-height:82vh;overflow-y:auto;">
    <div style="font-size:16px;font-weight:700;margin-bottom:4px;">負けたチームの行き先</div>
    <div style="font-size:12px;color:#6b7280;margin-bottom:14px;line-height:1.6;">「${scEsc(plain(cols[c].name))}」の <b>${scEsc(fromCell)}</b> で負けたチームが、次にどこへ行くかを選びます。左右どちらの列でも、2つ下の回戦でも選べます。</div>
    ${list||'<div style="font-size:13px;color:#9ca3af;margin-bottom:8px;">行き先になる試合がありません</div>'}
    ${btn('矢印を表示しない（ここで終わり）','',curOff)}
    <button id="sc-dest-close" style="width:100%;padding:11px;border:none;border-radius:10px;background:#f3f4f6;color:#374151;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;">閉じる</button>
  </div>`;
  document.body.appendChild(overlay);
  const close=()=>{if(overlay.parentNode)document.body.removeChild(overlay);};
  overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
  const cb=overlay.querySelector('#sc-dest-close');if(cb)cb.onclick=close;
  overlay.querySelectorAll('.sc-dest-btn').forEach(b=>{
    b.onclick=()=>{
      ch.loseArrows=ch.loseArrows||{};ch.loseTo=ch.loseTo||{};
      const v=b.dataset.v||'';
      if(!v){ ch.loseArrows[key]=false; delete ch.loseTo[key]; }
      else{
        const pr=v.split(',');const d=parseInt(pr[0],10),s=parseInt(pr[1],10);
        if(d===c+1&&s===r+1)delete ch.loseTo[key];
        else ch.loseTo[key]=cols[d].name+(s===r+1?'':('@'+s));
        ch.loseArrows[key]=true;
      }
      close();
      if(done)done();
    };
  });
}

// テンプレート1件から、図のデータを作って返す（元のテンプレートは変えない）
function scTemplateChart(t){
  if(!t)return null;
  if(t.chart)return JSON.parse(JSON.stringify(t.chart));
  return systemChartFromText(t.text||'');
}

/* 最初から入っている形を、1回だけ「自分のテンプレ一覧」に入れる。
   一覧に入れてしまえば、名前も説明も自由に変えられるし、いらなければ消せる。 */
// 8-6 までにアプリへ入っていた形。すでに使っている端末の引き継ぎ判定に使う。
const SC_TPL_PRE_8_7_IDS=['sc_bi_6696','sc_bi_128'];
function scSeedTemplates(force){
  if(!AD.chartTemplates)AD.chartTemplates=[];
  /* 【8-7】これまでは「一度でも入れたら、もう二度と入れない」しくみだったため、
     アプリに新しい形を足しても、すでに使っている端末には出てきませんでした。
     そこで「どの形を入れたか」を1つずつ覚えるようにして、
     まだ一度も入れたことのない形だけを自動で足すようにしました。
     自分で消した形は「入れた」と覚えたままなので、勝手には戻りません。 */
  if(!Array.isArray(AD.chartTplSeededIds)){
    // 8-6 までの端末からの引き継ぎ：昔からある2つは「入れた扱い」にしておく
    AD.chartTplSeededIds=AD.chartTplSeeded?SC_TPL_PRE_8_7_IDS.slice():[];
  }
  let added=0;
  SC_BUILTIN_TEMPLATES.forEach(t=>{
    if(AD.chartTemplates.some(x=>x.id===t.id))return;              // すでに一覧にある
    if(!force&&AD.chartTplSeededIds.indexOf(t.id)>=0)return;       // 自分で消した形は戻さない
    AD.chartTemplates.push({id:t.id,ver:t.ver||1,name:t.name,desc:t.desc||'',chart:scTemplateChart(t)});
    if(AD.chartTplSeededIds.indexOf(t.id)<0)AD.chartTplSeededIds.push(t.id);
    added++;
  });
  AD.chartTplSeeded=true;
  saveAdmin(AD);
  return added;
}

/* この端末に入っているテンプレが、アプリに入っている最新の形より古いか？
   ※古くても勝手に書き換えない（名前や説明を自分で直している場合があるため）。
     一覧に「最新に更新」ボタンを出して、押されたときだけ図を作り直す。 */
function scTplOutdated(t){
  if(!t)return false;
  const b=SC_BUILTIN_TEMPLATES.find(x=>x.id===t.id);
  if(!b)return false;
  return (Number(b.ver||1)>Number(t.ver||1));
}

// ===== チームNo検索：一覧HTML生成（キーワードでチーム名を部分一致絞り込み） =====
function buildTeamSearchList(query){
  /* 【1-5・8-7にそろえた】ここが activeTour()（＝開催中の大会）を直接見ていたため、
     開催前の大会のカードから開いても、開催中の大会の一覧が出てしまっていた。
     大会情報の画面が見ている大会（tiTour）に合わせる。 */
  const tour=tiTour()||{teams:[]};
  const teams=(tour.teams||[]).slice().sort((a,b)=>parseInt(a.id,10)-parseInt(b.id,10));
  const q=String(query||'').trim().toLowerCase();
  const filtered=q?teams.filter(t=>String(t.name||'').toLowerCase().includes(q)||String(t.id||'').includes(q)):teams;
  const tsW=wTeam(tiTour()||null);   // シングルス大会なら「選手」、それ以外は「チーム」
  if(teams.length===0){
    return`<div style="text-align:center;padding:24px;color:#9ca3af;font-size:14px;">参加${tsW}が登録されていません</div>`;
  }
  if(filtered.length===0){
    return`<div style="text-align:center;padding:24px;color:#9ca3af;font-size:14px;">「${query}」に一致する${tsW}が見つかりませんでした</div>`;
  }
  return`<div style="font-size:12px;color:#6b7280;margin-bottom:8px;">${filtered.length}${tsW}${q?'が一致':'を表示中'}</div>`
    +filtered.map(t=>`<div style="display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid #e5e7eb;border-radius:10px;padding:12px 14px;margin-bottom:8px;">
      <div style="background:#FFF3CC;color:#8a6d00;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:800;min-width:64px;text-align:center;">No.${t.id}</div>
      <div style="flex:1;font-size:15px;font-weight:700;color:#111;">${t.name||''}</div>
    </div>`).join('');
}

              ${safeMap?`<a href="${esc(safeMap)}" target="_blank" rel="noopener" style="display:inline-block;margin-top:10px;font-size:13px;font-weight:700;color:#0a6e57;text-decoration:none;">🗺 地図を開く ▸</a>`:''}
            </div>
            ${(d.mapImage||d.mapImageUrl)?`<div style="padding:14px 2px;border-bottom:1px solid #f3f4f6;">
              <div style="font-size:12px;color:#9ca3af;font-weight:700;margin-bottom:8px;">🗺 会場マップ（トイレ・本部などの位置）</div>
              <img src="${d.mapImage||d.mapImageUrl}" alt="会場マップ" loading="lazy" style="width:100%;border-radius:10px;border:1px solid #e5e7eb;display:block;" />
            </div>`:''}
            ${row('🚉','アクセス',d.access)}
            ${row('🅿','駐車場',d.parking)}
            ${row('🚻','トイレ',d.toilet)}
            ${row('🚭','喫煙ルール',d.smoking)}
            ${row('🗑','ゴミのルール',d.garbage)}
            ${notesHtml}
            ${row('📜','大会規約',d.rules)}
            ${sectionsHtml}
          </div>`}
    </div>`;
  }

  // ── サブ画面：大会の詳細（大会規約・大会における注意点） ──
  if(v==='tourinfo'){
    const vtour=tour||activeTour();
    const ti=(vtour&&vtour.tourInfo)||{};
    const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const rulesText=(ti.rules||'').trim();
    const notesText=(ti.notes||'').trim();
    const hasAny=!!(rulesText||notesText);
    const block=(icon,label,text)=> (text&&text.trim())
      ? `<div style="padding:14px 2px;border-bottom:1px solid #f3f4f6;">
           <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
             <span style="font-size:20px;">${icon}</span>
             <span style="font-size:15px;font-weight:800;color:#111;">${esc(label)}</span>
           </div>
           <div style="font-size:14px;color:#374151;line-height:1.7;white-space:pre-wrap;">${linkify_(esc(text))}</div>
         </div>` : '';
    return`<div style="padding:16px;max-width:480px;margin:0 auto;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <button id="btn-ti-sub-back" style="padding:6px 12px;border-radius:8px;border:1.5px solid #e5e7eb;background:#f9fafb;cursor:pointer;font-size:14px;color:#374151;">← 戻る</button>
        <div style="font-size:17px;font-weight:700;color:#111;">大会の詳細</div>
      </div>
      ${!hasAny
        ? `<div style="text-align:center;padding:32px;color:#9ca3af;font-size:14px;">大会の詳細はまだ登録されていません。</div>`
        : `<div>
            ${block('⚠️','大会における注意点',notesText)}
            ${block('📜','大会規約',rulesText)}
          </div>`}
    </div>`;
  }

  // ── サブ画面：タイムスケジュール ──
  if(v==='schedule'){
    const rows=S._tiSchedule||[];
    const loading=S._tiLoading;
    const err=S._tiError;
    return`<div style="padding:16px;max-width:480px;margin:0 auto;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
        <button id="btn-ti-sub-back" style="padding:6px 12px;border-radius:8px;border:1.5px solid #e5e7eb;background:#f9fafb;cursor:pointer;font-size:14px;color:#374151;">← 戻る</button>
        <div style="font-size:17px;font-weight:700;color:#111;">タイムスケジュール</div>
      </div>
      ${loading?`<div style="text-align:center;padding:32px;color:#9ca3af;">読み込み中...</div>`
      :err?`<div style="padding:16px;background:#fee2e2;border-radius:10px;color:#dc2626;font-size:13px;">${err}</div>`
      :rows.length===0?`<div style="text-align:center;padding:32px;color:#9ca3af;">データがありません</div>`
      :`<table style="width:100%;border-collapse:collapse;font-size:14px;">
          <thead><tr>
            <th style="padding:8px 10px;border-bottom:2px solid #111;text-align:left;font-size:13px;color:#374151;">試合区分</th>
            <th style="padding:8px 10px;border-bottom:2px solid #111;text-align:left;font-size:13px;color:#374151;">時間</th>
          </tr></thead>
          <tbody>${(()=>{
            /* 【8-6】決勝トーナメントとBトーナメントで途中から進み方が変わる大会に対応。
               スプレッドシートから届く3種類を、それぞれこう表示する。
                 type:'header' … 見出しの行（時間が入っていない行）→ 灰色の帯で区切る。前に1行空ける
                 type:'gap'    … シートの空行            → そのまま1行空ける
                 type:'row'    … ふつうの行              → 区分と時間を並べる
               ※見出しの直前の空行は、見出し側で空きを入れるので二重にしない。
               ※古い対戦表からは type が届かないので、その場合は今までどおりの表になる。 */
            const items=rows.map(r=>{
              const nm=String(r.name==null?'':r.name).trim();
              const tm=String(r.time==null?'':r.time).trim();
              if(r.type==='gap'||(nm===''&&tm===''))return{k:'gap'};
              if(r.type==='header'||(nm!==''&&tm===''))return{k:'head',name:nm};
              return{k:'row',name:nm,time:tm};
            });
            const spacer='<tr><td colspan="2" style="height:14px;padding:0;border:none;background:#fff;"></td></tr>';
            let out='',zebra=0,started=false,pendingGap=false;
            items.forEach(it=>{
              if(it.k==='gap'){ if(started)pendingGap=true; return; }
              if(it.k==='head'){
                if(started)out+=spacer;      // 見出しの前は必ず1行分あける
                pendingGap=false;zebra=0;started=true;
                out+=`<tr><td colspan="2" style="padding:9px 10px;background:#ececec;border-top:2px solid #111;border-bottom:1px solid #cfcfcf;font-size:14px;font-weight:800;color:#111;">${it.name}</td></tr>`;
                return;
              }
              if(pendingGap){out+=spacer;pendingGap=false;zebra=0;}
              const bg=(zebra++%2===0)?'#fff':'#f9fafb';
              out+=`<tr style="background:${bg};">
                <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;">${it.name}</td>
                <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;white-space:nowrap;">${it.time}</td>
              </tr>`;
              started=true;
            });
            return out;
          })()}</tbody>
        </table>`}
    </div>`;
  }

  /* ── サブ画面：どちらのトーナメント表を見るか選ぶ ──
     【8-6】トーナメントが2つある大会のために、表を開く前に1画面はさむ。
     トーナメント②が「なし」の大会ではこの画面は出ず、今までどおりそのまま表が開く。 */
  if(v==='bracketPick'){
    const ptour=tour||activeTour();
    const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const n1=(ptour&&ptour.bracket1Name)||'決勝トーナメント';
    const n2=(ptour&&ptour.bracket2Name)||'Bトーナメント';
    const c1=Number(ptour&&ptour.bracketTeamCount)||64;
    const c2=Number(ptour&&ptour.bracket2TeamCount)||0;
    const card=(id,icon,name,count)=>`<button id="${id}" style="width:100%;padding:18px 16px;border-radius:12px;border:1.5px solid #e5e7eb;background:#fff;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:16px;font-weight:700;color:#111;">${esc(name)}</div>
          <div style="font-size:12px;color:#6b7280;margin-top:3px;">${count?count+'チーム':''}</div>
        </div>
        <span style="font-size:18px;color:#9ca3af;">▸</span>
      </button>`;
    return`<div style="padding:16px;max-width:480px;margin:0 auto;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <button id="btn-ti-sub-back" style="padding:6px 12px;border-radius:8px;border:1.5px solid #e5e7eb;background:#f9fafb;cursor:pointer;font-size:14px;color:#374151;">← 戻る</button>
        <div style="font-size:17px;font-weight:700;color:#111;">トーナメント表</div>
      </div>
      ${S._tiLoading?`<div style="text-align:center;padding:32px;color:#9ca3af;">読み込み中...</div>`
      :`<div style="font-size:13px;color:#6b7280;margin-bottom:14px;">どちらのトーナメント表を見ますか？</div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          ${card('btn-ti-bracket-1','🏆',n1,c1)}
          ${c2?card('btn-ti-bracket-2','🥈',n2,c2):''}
        </div>`}
    </div>`;
  }

  // ── サブ画面：決勝トーナメント表（縦型・右へ収束／可変チーム数・シード対応） ──
  if(v==='bracket'){
    const loading=S._tiLoading;
    const err=S._tiError;
    const data=S._tiBracket;      // {rounds:[{name,matches:[{team1,team2,win1,win2}]}]}

    /* 【8-6】トーナメントは最大2つ。いまどちらを見ているかは S._tiBracketNo（1 or 2）で決まる。
       チーム数と表示名は、それぞれ管理者画面で設定したものを使う（_settings.json 経由で配信）。 */
    const _tourB=S._editingTourId?AD.tournaments.find(t=>t.id===S._editingTourId):tiTour();
    const _bNo=Number(S._tiBracketNo)||1;
    const _hasB2=Number(_tourB&&_tourB.bracket2TeamCount)>0;
    const teamCount=(_bNo===2?Number(_tourB&&_tourB.bracket2TeamCount):Number(_tourB&&_tourB.bracketTeamCount))||64;
    const _bName=_bNo===2?((_tourB&&_tourB.bracket2Name)||'Bトーナメント'):((_tourB&&_tourB.bracket1Name)||'決勝トーナメント');

    const rawRounds=(data&&Array.isArray(data.rounds))?data.rounds:[];
    function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

    /* チーム数から構造を導出。
       ・2の累乗（16/32/64）… シードなし
       ・それ以外（24/48）  … 上位がシード（1回戦免除）。シードは常にペアの上側。
       例) 24チーム: シード8 + 1回戦8試合 → 2回戦16人 → 8→4→2→1（5ラウンド） */
    function bracketStructure(N){
      let B=1; while(B<N) B*=2;
      const half=B/2;
      let seeds,r1Matches,r2Entrants;
      if(N===B){ seeds=0; r1Matches=N/2; r2Entrants=N/2; }
      else { r2Entrants=half; const r1Players=2*(N-half); r1Matches=r1Players/2; seeds=N-r1Players; }
      const roundSizes=[];
      if(r1Matches) roundSizes.push(r1Matches);
      let e=r2Entrants;
      while(e>=2){ roundSizes.push(e/2); e/=2; }
      return {seeds:seeds,r1Matches:r1Matches,r2Entrants:r2Entrants,roundSizes:roundSizes,hasSeeds:seeds>0};
    }
    const ST=bracketStructure(teamCount);

    // ラウンドr（0始まり）の試合配列を、必要数ぴったりに整えて返す（ヘッダー名に依存しない）
    function roundMatches(r){
      const want=ST.roundSizes[r]||0;
      const src=rawRounds[r];
      const ms=(src&&Array.isArray(src.matches))?src.matches.slice():[];
      while(ms.length<want)ms.push({team1:'',team2:'',win1:false,win2:false});
      ms.length=want;
      return ms;
    }
    const R=[];
    for(let r=0;r<ST.roundSizes.length;r++)R.push(roundMatches(r));

    // 優勝
    const finalM=(R[ST.roundSizes.length-1]||[])[0]||{team1:'',team2:'',win1:false,win2:false};
    const champion=finalM.win1?finalM.team1:(finalM.win2?finalM.team2:'');

    function buildVerticalSVG(){
      const ROW_H=22, PAD_TOP=16, PAD_BOTTOM=16;
      const LABEL_W=140, COL_W=46, CROWN_W=120;
      const BLACK='#111', RED='#dc2626';

      /* 最左のリーフを作る。
         シードあり: 2回戦の各試合について「シード(単独1行)」＋「1回戦ペア(2行)」を交互に置く
         シードなし: 1回戦の各試合＝ペア(2行) */
      const leaves=[];
      if(ST.hasSeeds){
        const r2=R[1]||[];
        for(let m=0;m<(ST.roundSizes[1]||0);m++){
          leaves.push({type:'seed', name:(r2[m]&&r2[m].team1)||''});
          const p=(R[0]||[])[m]||{team1:'',team2:''};
          leaves.push({type:'pair', m:m, names:[p.team1||'', p.team2||'']});
        }
      }else{
        const r1=R[0]||[];
        for(let m=0;m<(ST.roundSizes[0]||0);m++){
          const p=r1[m]||{team1:'',team2:''};
          leaves.push({type:'pair', m:m, names:[p.team1||'', p.team2||'']});
        }
      }

      // 各リーフのY座標
      let rows=0; leaves.forEach(l=>{rows+=(l.type==='seed'?1:2);});
      const svgH=PAD_TOP+rows*ROW_H+PAD_BOTTOM;
      const nRounds=ST.roundSizes.length;
      const svgW=LABEL_W+nRounds*COL_W+CROWN_W;

      let yc=PAD_TOP; const LY=[];
      leaves.forEach(l=>{
        if(l.type==='seed'){ LY.push({el:l,y:yc+ROW_H/2}); yc+=ROW_H; }
        else{
          const y1=yc+ROW_H/2, y2=yc+ROW_H+ROW_H/2;
          LY.push({el:l,y1:y1,y2:y2,y:(y1+y2)/2}); yc+=2*ROW_H;
        }
      });

      const parts=[];
      const x0=LABEL_W;
      /* 【2026-10-26】チーム名は「文字数」ではなく「実際の文字の幅」で測る。
           半角は全角のおよそ半分の幅なので、半角の名前もたくさん入る。
           1行に入らないときは、少し小さい字で2行にする。それでも入らない分だけ「…」にする。 */
      const NAME_W=LABEL_W-12;
      function nameText(t,x,y){
        const raw=String(t||'').trim();
        if(raw==='')return '';
        if(brTextW_(raw,10)<=NAME_W)
          return `<text x="${x}" y="${y}" dominant-baseline="central" font-size="10" fill="#111">${esc(raw)}</text>`;
        const c1=brFitCut_(raw,9,NAME_W);
        if(c1[1]==='')   // 小さい字なら1行に入る
          return `<text x="${x}" y="${y}" dominant-baseline="central" font-size="9" fill="#111">${esc(raw)}</text>`;
        let l2=c1[1];
        if(brTextW_(l2,9)>NAME_W)l2=brFitCut_(l2,9,NAME_W-brTextW_('…',9))[0]+'…';
        return `<text x="${x}" y="${y-5}" dominant-baseline="central" font-size="9" fill="#111">${esc(c1[0])}</text>`
              +`<text x="${x}" y="${y+5}" dominant-baseline="central" font-size="9" fill="#111">${esc(l2)}</text>`;
      }
      /* 【2026-10-26】スコアシートがある試合には、合流点に小さな「📋」ボタンを出す */
      const _brTour=_tourB;
      const _brSrc=_brTour?(_brTour.matches||[]).concat(sentMatchCards_(_brTour)):[];
      const _brIds=[];
      function sheetBadge(md,xM,yP){
        if(!md||!md.team1||!md.team2)return '';
        const mid=bracketMatchIdOf_(_brTour,_brSrc,md.team1,md.team2);
        if(!mid)return '';
        _brIds.push(mid);
        if(_throwsKnown[mid]!==true)return '';
        return `<g class="br-sheet" data-matchid="${esc(mid)}" style="cursor:pointer;"><rect x="${xM+3}" y="${yP-17}" width="22" height="15" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1.2"/><text x="${xM+14}" y="${yP-9.5}" text-anchor="middle" dominant-baseline="central" font-size="10">📋</text></g>`;
      }
      function seg(x1,y1,x2,y2,red){
        return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${red?RED:BLACK}" stroke-width="${red?2.5:1}"/>`;
      }
      function winSide(m){ if(!m)return 0; return m.win1?1:(m.win2?2:0); }

      // 最左：チーム名 ＋ 1回戦（ペア）の合流線
      LY.forEach(e=>{
        const l=e.el;
        if(l.type==='seed'){
          parts.push(nameText(l.name,4,e.y));
        }else{
          parts.push(nameText(l.names[0],4,e.y1));
          parts.push(nameText(l.names[1],4,e.y2));
          const mm=(R[0]||[])[l.m]||{};
          const ws=winSide(mm), rT=ws===1, rB=ws===2, rO=ws!==0;
          const xM=x0+COL_W;
          parts.push(seg(x0,e.y1,xM,e.y1,rT));
          parts.push(seg(x0,e.y2,xM,e.y2,rB));
          parts.push(seg(xM,e.y1,xM,e.y,rT));
          parts.push(seg(xM,e.y,xM,e.y2,rB));
          parts.push(seg(xM,e.y,xM+COL_W,e.y,rO));   // 次ラウンドへ
          parts.push(sheetBadge(mm,xM,e.y));
        }
      });

      // ノード（次ラウンド以降の合流点）を作る
      let nodes=[], colBase;
      if(ST.hasSeeds){
        // 2回戦: (シード, 1回戦勝者) のペアで合流
        const r2=R[1]||[];
        const xM=x0+2*COL_W;
        for(let m=0;m<(ST.roundSizes[1]||0);m++){
          const top=LY[2*m], bot=LY[2*m+1];
          if(!top||!bot)continue;
          const yT=top.y, yB=bot.y, yP=(yT+yB)/2;
          const ws=winSide(r2[m]), rT=ws===1, rB=ws===2, rO=ws!==0;
          // シードは最左からこの列まで一直線
          parts.push(seg(x0,yT,xM,yT,rT));
          parts.push(seg(xM,yT,xM,yP,rT));
          parts.push(seg(xM,yP,xM,yB,rB));
          parts.push(seg(xM,yP,xM+COL_W,yP,rO));
          parts.push(sheetBadge(r2[m],xM,yP));
          nodes.push({y:yP});
        }
        colBase=xM;
      }else{
        LY.forEach(e=>nodes.push({y:e.y}));
        colBase=x0+COL_W;
      }

      // 残りのラウンド
      const startR=ST.hasSeeds?2:1;
      for(let r=startR;r<ST.roundSizes.length;r++){
        const md=R[r]||[];
        const xM=colBase+COL_W;
        const next=[];
        for(let m=0;m<ST.roundSizes[r];m++){
          const a=nodes[2*m], b=nodes[2*m+1];
          if(!a||!b)continue;
          const yT=a.y, yB=b.y, yP=(yT+yB)/2;
          const ws=winSide(md[m]), rT=ws===1, rB=ws===2, rO=ws!==0;
          parts.push(seg(xM,yT,xM,yP,rT));
          parts.push(seg(xM,yP,xM,yB,rB));
          parts.push(seg(xM,yP,xM+COL_W,yP,rO));
          parts.push(sheetBadge(md[m],xM,yP));
          next.push({y:yP});
        }
        nodes=next; colBase=xM;
      }

      // 最右：王冠＋優勝枠
      const yF=nodes[0]?nodes[0].y:PAD_TOP;
      const xC=colBase+COL_W;
      const cRaw=String(champion||'').trim();   // 【8-8】文字数は置き換える前の名前で数える
      const _cW=CROWN_W-24;   // 【2026-10-26】幅で測る
      const cN=brTextW_(cRaw,11,true)<=_cW?esc(cRaw):esc(brFitCut_(cRaw,11,_cW-brTextW_('…',11,true),true)[0])+'…';
      parts.push(`<text x="${xC+CROWN_W/2-24}" y="${yF-16}" font-size="22">👑</text>`);
      parts.push(`<rect x="${xC}" y="${yF-12}" width="${CROWN_W-10}" height="24" rx="4" fill="#fff" stroke="${cN?RED:'#9ca3af'}" stroke-width="${cN?2.5:1.5}"/>`);
      if(cN!=='')parts.push(`<text x="${xC+7}" y="${yF}" dominant-baseline="central" font-size="11" font-weight="700" fill="#b45309">${cN}</text>`);

      S._brSheetIds=_brIds;
      return `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" style="display:block;font-family:inherit;">${parts.join('')}</svg>`;
    }

    const svg = rawRounds.length===0 ? '' : buildVerticalSVG();
    const seedNote = ST.hasSeeds
      ? `${teamCount}チーム（上位${ST.seeds}チームは1回戦免除のシード）`
      : `${teamCount}チーム`;

    return`<div style="padding:16px;max-width:820px;margin:0 auto;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <button id="${_hasB2?'btn-ti-bracket-back':'btn-ti-sub-back'}" style="padding:6px 12px;border-radius:8px;border:1.5px solid #e5e7eb;background:#f9fafb;cursor:pointer;font-size:14px;color:#374151;">← 戻る</button>
        <div style="font-size:17px;font-weight:700;color:#111;">${esc(_bName)}表</div>
      </div>
      ${loading?`<div style="text-align:center;padding:32px;color:#9ca3af;">読み込み中...</div>`
      :err?`<div style="padding:16px;background:#fee2e2;border-radius:10px;color:#dc2626;font-size:13px;">${err}</div>`
      :rawRounds.length===0?`<div style="text-align:center;padding:32px;color:#9ca3af;">まだ配信されていません</div>`
      :`<div style="text-align:center;margin-bottom:10px;">
          <div style="font-size:12px;color:#92400e;font-weight:700;">優勝</div>
          <div style="font-size:20px;font-weight:800;color:#b45309;margin-top:2px;min-height:26px;">${champion?esc(champion):'<span style=\"color:#d1d5db;font-size:14px;\">未確定</span>'}</div>
          <div style="font-size:11px;color:#9ca3af;margin-top:4px;">${seedNote}</div>
        </div>
        <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #f3f4f6;border-radius:10px;padding:6px;">
          <div style="display:inline-block;">${svg}</div>
        </div>
        <div style="font-size:11px;color:#9ca3af;text-align:center;margin-top:10px;line-height:1.6;">
          勝ち上がったチームのラインが<span style="color:#dc2626;font-weight:700;">赤</span>く伸びていきます。<br>
          チーム名は一番左の列に表示されます。下・横にスクロールできます。<br>
          <span style="display:inline-block;border:1.2px solid #2563eb;border-radius:4px;padding:0 3px;">📋</span> を押すと、その試合のスコアシートを見られます。
        </div>`}
    </div>`;
  }

  // ── サブ画面：レギュレーション ──
  if(v==='regulation'){
    const sections=S._tiSections||null;
    const text=S._tiRegulation||'';
    const loading=S._tiLoading;
    const err=S._tiError;
    const hasData=sections?sections.length>0:text.trim().length>0;

    // 箇条書き行（・で始まる）の折り返しにインデントを付ける関数
    function fmtContent(str){
      return str.split('\n').map(line=>{
        const trimmed=linkify_(line.trimStart());   // 【2026-10-26】https://〜 を押せるリンクに
        if(trimmed.startsWith('・')){
          return`<div style="display:flex;gap:0;margin-bottom:4px;"><span style="flex-shrink:0;">・</span><span style="flex:1;">${trimmed.slice(1)}</span></div>`;
        }
        return trimmed?`<div style="margin-bottom:4px;">${trimmed}</div>`:'<div style="margin-bottom:2px;"></div>';
      }).join('');
    }

    return`<div style="padding:16px;max-width:480px;margin:0 auto;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
        <button id="btn-ti-sub-back" style="padding:6px 12px;border-radius:8px;border:1.5px solid #e5e7eb;background:#f9fafb;cursor:pointer;font-size:14px;color:#374151;">← 戻る</button>
        <div style="font-size:17px;font-weight:700;color:#111;">レギュレーション</div>
      </div>
      <div style="margin-bottom:22px;">
        <div style="font-size:16px;font-weight:700;color:#111;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;">試合システム</div>
        <div style="font-size:12px;color:#6b7280;margin-bottom:12px;">一度負けると右のトーナメントへ移動します。今いるトーナメント・回戦から、残りの試合数を確認できます。</div>
        <div id="sc-view-wrap" style="background:#fff;border:1px solid #eee;border-radius:12px;padding:12px 8px;">${renderSystemChart(tour?tour.systemChart:null)}</div>
      </div>
      ${loading?`<div style="text-align:center;padding:32px;color:#9ca3af;">読み込み中...</div>`
      :err?`<div style="padding:16px;background:#fee2e2;border-radius:10px;color:#dc2626;font-size:13px;">${err}</div>`
      :!hasData?`<div style="text-align:center;padding:32px;color:#9ca3af;">データがありません</div>`
      :sections
        ?sections.map(sec=>`
          <div style="margin-bottom:18px;">
            <div style="font-size:16px;font-weight:700;color:#111;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid #e5e7eb;">${sec.title}</div>
            <div style="font-size:14px;color:#374151;line-height:1.8;">${fmtContent(sec.content)}</div>
          </div>`).join('')
        :`<div style="font-size:14px;color:#374151;line-height:1.8;">${fmtContent(text)}</div>`}
    </div>`;
  }

  // ── サブ画面：予選結果 ──
  if(v==='prelim'){
    const loading=S._tiLoading;
    const err=S._tiError;
    const teams=S._tiPrelim||[];
    const q=(S._tiPrelimQuery||'').trim();
    const sel=S._tiPrelimSelected||null;

    // 検索ボックス＋結果表示（チーム名プルダウン／チームNo入力のタブ切替）
    const pMode=S._tiPrelimMode||'select';
    const pModeTab=(mv,l)=>`<button class="ti-prelim-mode-tab" data-mode="${mv}" style="flex:1;padding:9px 4px;font-size:13px;font-weight:700;border:none;border-radius:8px;background:${pMode===mv?'#1D9E75':'#f3f4f6'};color:${pMode===mv?'#fff':'#6b7280'};cursor:pointer;">${l}</button>`;
    const pW=wTeam();   // シングルス大会なら「選手」、それ以外は「チーム」
    const pTeamsSorted=teams.slice().sort((a,b)=>parseInt(a.teamNo,10)-parseInt(b.teamNo,10));
    const pSelectedNo=sel?String(sel.teamNo):'';
    const pInputBlock=pMode==='select'
      ?(pTeamsSorted.length>0
        ?`<select id="ti-prelim-select" style="width:100%;padding:10px 12px;border:1.5px solid #d1d5db;border-radius:10px;font-size:15px;background:#fff;">
            <option value="">-- ${pW}を選択 --</option>
            ${pTeamsSorted.map(t=>`<option value="${t.teamNo}" ${pSelectedNo===String(t.teamNo)?'selected':''}>No.${t.teamNo}　${t.teamName||''}</option>`).join('')}
          </select>`
        :`<div style="font-size:13px;color:#9ca3af;padding:8px 0;">${pW}データがありません</div>`)
      :`<div style="display:flex;gap:8px;">
          <input type="text" id="ti-prelim-input" value="${q}" placeholder="${pW}No（例: 001）" inputmode="numeric"
            style="flex:1;padding:10px 12px;border:1.5px solid #d1d5db;border-radius:10px;font-size:15px;"/>
          <button id="ti-prelim-search" style="padding:10px 18px;background:#6FD0A4;color:#08341f;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;">検索</button>
        </div>`;
    const searchBox=`<div style="margin-bottom:16px;">
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        ${pModeTab('select',pW+'名から選ぶ')}
        ${pModeTab('no',pW+'Noで入力')}
      </div>
      ${pInputBlock}
    </div>`;

    /* 【8-8】予選のランキング（順位・No・名前・勝利セット数・引き分けセット数・合計点）。
         ボタンで開け閉めする。 */
    const rankOpen=!!S._tiPrelimRankOpen;
    const prelimRankBtn=(!loading&&!err&&teams.length)
      ?`<button id="btn-prelim-rank" style="width:100%;padding:12px;margin-bottom:16px;font-size:14px;font-weight:800;background:#FFCB3D;color:#2b2100;border:1.5px solid #FFCB3D;border-radius:12px;cursor:pointer;">予選のランキングを確認</button>`:'';
    const prelimRankTable=(rankOpen&&teams.length)?(()=>{
      /* 【8-8】予選のランキング。罫線付きの表で、
           順位（暫定）・No・名前・総セット・勝利・引き分け・合計点 の順。
           大会設定の「予選順位による進出先」があれば、区切りごとに見出し行を入れ、順位の欄を色分けする。 */
      const escR=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const rk=t=>{const n=parseInt(t.rank,10);return isNaN(n)?99999:n;};
      const list=teams.slice().sort((a,b)=>rk(a)-rk(b)||parseInt(a.teamNo,10)-parseInt(b.teamNo,10));
      const _rt=tiTour();
      const conf=S._tiPrelimConfirmed===true;
      const bd='border:1px solid #1f2937;';
      const th=bd+'padding:6px 3px;font-size:11px;color:#111;font-weight:700;background:#d1d5db;white-space:nowrap;text-align:center;';
      const td=bd+'padding:7px 4px;font-size:12.5px;background:#fff;';
      /* 【2026-10-26】進出先の区切りは、境目（例：64位のすぐ下）に2行で出す。
           ⬆︎ 上のトーナメントの進出圏 ／ ⬇︎ 下のトーナメントの進出圏。順位の欄はふつうの色。 */
      const advLine=(ar,a)=>`<tr><td colspan="7" style="${bd}padding:6px 8px;font-size:12px;font-weight:800;color:#1a1a1a;background:#FFF7D6;">${ar}${escR(a.label)}${conf?'進出':'進出圏'}（${a.rule.from}~${a.rule.to}位）</td></tr>`;
      let prevG=-2,prevAdv=null,html='';
      list.forEach(t=>{
        const adv=advanceOfRank_(_rt,t.rank);
        const g=adv?adv.i:-1;
        if(prevG!==-2&&g!==prevG){
          if(prevAdv)html+=advLine('⬆︎',prevAdv);
          html+=adv?advLine('⬇︎',adv):`<tr><td colspan="7" style="${bd}padding:6px 8px;font-size:12px;font-weight:700;color:#6b7280;background:#f3f4f6;">⬇︎進出先の設定なし</td></tr>`;
        }
        prevG=g;prevAdv=adv;
        const rc='#f3f4f6';
        const me=sel&&sameNo_(sel.teamNo,t.teamNo);
        html+=`<tr${me?' style="outline:2.5px solid #f59e0b;outline-offset:-2px;"':''}>
          <td style="${td}text-align:center;font-weight:800;background:${rc};">${escR(t.rank||'-')}</td>
          <td style="${td}text-align:center;">${escR(t.teamNo)}</td>
          <td style="${td}font-weight:700;word-break:break-all;${me?'background:#FFF7D6;':''}">${escR(t.teamName||'')}</td>
          <td style="${td}text-align:right;">${t.sets!=null?escR(t.sets):'-'}</td>
          <td style="${td}text-align:right;">${escR(t.wins||'0')}</td>
          <td style="${td}text-align:right;">${escR(t.draws||'0')}</td>
          <td style="${td}text-align:right;font-weight:700;">${escR(t.total||'0')}</td>
        </tr>`;
      });
      return`<div style="margin-bottom:12px;overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;">
          <thead><tr>
            <th style="${th}">${conf?'順位':'順位<br>（暫定）'}</th><th style="${th}">${pW}<br>No</th><th style="${th}text-align:left;">${pW}名</th>
            <th style="${th}">総<br>セット</th><th style="${th}">勝利</th><th style="${th}">引き<br>分け</th><th style="${th}">合計点</th>
          </tr></thead>
          <tbody>${html}</tbody>
        </table>
      </div>`;
    })():'';
    /* 【8-8】予選結果が確定する前は「暫定」の警告、確定したら「確定しました」を出す。
         確定の印は、対戦表の「予選結果を確定させる」で配信される（confirmed）。 */
    const prelimNotice=(!loading&&!err&&teams.length)
      ?(S._tiPrelimConfirmed===true
        ?`<div style="background:#E1F5EE;border:1.5px solid #9FE1CB;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:#085041;font-weight:700;line-height:1.6;">予選成績が確定しました。<br><span style="font-weight:600;">これ以降の修正は受け付けられません。</span></div>`
        :`<div style="background:#FFF7ED;border:1.5px solid #fed7aa;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:#92400e;font-weight:700;line-height:1.6;">予選成績は暫定のものです。${S._tiPrelimLive?`<div style="font-size:12px;font-weight:600;margin-top:6px;padding-top:6px;border-top:1px dashed #fed7aa;">反映済み：予選 ${S._tiPrelimLive.done} / ${S._tiPrelimLive.all} 試合</div>`:''}</div>`)
      :'';

    /* 【2026-10-26】予選のランキングは、折り返しではなく新しい画面で出す */
    if(rankOpen&&!loading&&!err&&teams.length){
      return`<div style="padding:16px;max-width:480px;margin:0 auto;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
          <button id="btn-prelim-rank-back" style="padding:6px 12px;border-radius:8px;border:1.5px solid #e5e7eb;background:#f9fafb;cursor:pointer;font-size:14px;color:#374151;">← 戻る</button>
          <div style="font-size:17px;font-weight:700;color:#111;">予選のランキング</div>
        </div>
        ${prelimNotice}
        ${prelimRankTable}
      </div>`;
    }
    let body='';
    if(loading){body=`<div style="text-align:center;padding:32px;color:#9ca3af;">読み込み中...</div>`;}
    else if(err){body=`<div style="padding:16px;background:#fee2e2;border-radius:10px;color:#dc2626;font-size:13px;">${err}</div>`;}
    else if(sel){
      /* 【8-8】セットごとに、相手チームの点数も並べて出す。
           相手の点数は、対戦カードで相手を探し、相手チームの行の同じ予選の点数を使う
           （スプレッドシートの配信内容はそのまま。アプリ側で組み合わせている）。
           アプリで試合内容（投擲）まで送られている試合には「スコアシートを確認」を出す。 */
      const _pTour=tiTour();
      const escP=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      const oppRowOf=(m)=>{
        // 【8-8】計算した予選の成績には、相手のNoと試合IDが入っている
        if(sel['oppNo'+m]){
          const row0=teams.find(t=>sameNo_(t.teamNo,sel['oppNo'+m]));
          return {row:row0||null,match:sel['mid'+m]?{matchId:sel['mid'+m]}:null};
        }
        const mt=prelimMatchOf_(_pTour,sel.teamNo,m);
        if(mt){
          const oNo=sameNo_(mt.teamA,sel.teamNo)?mt.teamB:mt.teamA;
          const row=teams.find(t=>sameNo_(t.teamNo,oNo));
          if(row)return {row:row,match:mt};
        }
        const nm=String(sel['opp'+m]||'').trim();
        const row2=nm?teams.find(t=>String(t.teamName||'').trim()===nm&&!sameNo_(t.teamNo,sel.teamNo)):null;
        return {row:row2||null,match:mt||null};
      };
      const setBox=(no,mine,theirs)=>`<div style="flex:1;text-align:center;background:#f8fafc;border-radius:8px;padding:8px 4px;">
            <div style="font-size:11px;color:#9ca3af;">${no}セット目</div>
            <div style="font-size:18px;font-weight:800;color:#111;line-height:1.3;">${mine!==''?escP(mine):'-'}<span style="font-size:13px;font-weight:600;color:#9ca3af;"> - ${theirs!==''&&theirs!=null?escP(theirs):'-'}</span></div>
          </div>`;
      const setRow=(label,opp,a,b,m)=>{
        const o=oppRowOf(m);
        const oa=o.row?String(o.row['p'+m+'a']||''):'';
        const ob=o.row?String(o.row['p'+m+'b']||''):'';
        const mid=o.match?o.match.matchId:'';
        const hasSheet=mid&&_throwsKnown[mid]===true;
        return`<div style="border:1.5px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:10px;">
          <div style="font-size:13px;font-weight:700;color:#374151;margin-bottom:6px;">${label}　<span style="font-weight:400;color:#6b7280;">vs ${escP(opp||'-')}</span></div>
          <div style="display:flex;gap:8px;">
            ${setBox(1,a,oa)}
            ${setBox(2,b,ob)}
          </div>
          <div style="font-size:10.5px;color:#9ca3af;margin-top:5px;text-align:right;">自分 - 相手</div>
          ${hasSheet?`<button class="btn btn-blue open-scoresheet" data-matchid="${escP(mid)}" data-back="tournamentInfo" data-label="${escP(sel.teamName||'')}" style="width:100%;margin-top:8px;padding:9px;font-size:13px;">📋 スコアシートを確認</button>`:''}
        </div>`;
      };
      body=`
        <div style="background:#fff;border:1.5px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:16px;">
          <div style="font-size:16px;font-weight:700;color:#111;margin-bottom:2px;">No.${sel.teamNo}　${sel.teamName||''}</div>
          <!-- 【2026-10-26】色をそろえた（淡い黄色・数字は黒） -->
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;">
            <div style="text-align:center;background:#FFF7D6;border-radius:8px;padding:10px 4px;"><div style="font-size:11px;color:#6b7280;">総セット</div><div style="font-size:20px;font-weight:700;color:#1a1a1a;">${sel.sets!=null?sel.sets:'-'}</div></div>
            <div style="text-align:center;background:#FFF7D6;border-radius:8px;padding:10px 4px;"><div style="font-size:11px;color:#6b7280;">勝利セット</div><div style="font-size:20px;font-weight:700;color:#1a1a1a;">${sel.wins||'0'}</div></div>
            <div style="text-align:center;background:#FFF7D6;border-radius:8px;padding:10px 4px;"><div style="font-size:11px;color:#6b7280;">引分セット</div><div style="font-size:20px;font-weight:700;color:#1a1a1a;">${sel.draws||'0'}</div></div>
            <div style="text-align:center;background:#FFF7D6;border-radius:8px;padding:10px 4px;"><div style="font-size:11px;color:#6b7280;">敗北セット</div><div style="font-size:20px;font-weight:700;color:#1a1a1a;">${sel.losses!=null?sel.losses:'-'}</div></div>
            <div style="text-align:center;background:#FFF7D6;border-radius:8px;padding:10px 4px;"><div style="font-size:11px;color:#6b7280;">合計点</div><div style="font-size:20px;font-weight:700;color:#1a1a1a;">${sel.total||'0'}</div></div>
            <div style="text-align:center;background:#FFF7D6;border-radius:8px;padding:10px 4px;"><div style="font-size:11px;color:#6b7280;">${S._tiPrelimConfirmed===true?'順位':'暫定順位'}</div><div style="font-size:20px;font-weight:700;color:#1a1a1a;">${sel.rank||'-'}</div></div>
          </div>
          ${(()=>{ /* 【8-8】予選順位による進出先 */
            const adv=advanceOfRank_(tiTour(),sel.rank);
            if(!adv)return'';
            const col=ADV_COLORS_[adv.i%ADV_COLORS_.length];
            return S._tiPrelimConfirmed===true
              ?`<div style="margin-top:12px;padding:11px 12px;border-radius:10px;background:#FFF3C4;border:1.5px solid #FFCB3D;font-size:15px;font-weight:800;color:#1a1a1a;text-align:center;">${escP(adv.name)}に進出！</div>`
              :`<div style="margin-top:12px;padding:10px 12px;border-radius:10px;background:#FFF7D6;border:1.5px dashed #FFCB3D;font-size:14px;font-weight:700;color:#1a1a1a;text-align:center;">このままいくと <b>${escP(adv.name)}</b> に進出</div>`;
          })()}
        </div>
        ${prelimRankBtn}
        <div style="font-size:14px;font-weight:700;color:#111;margin-bottom:10px;">各予選の結果</div>
        ${(()=>{const NUM=['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];const n=Math.min(Math.max(Number(S._tiPrelimMatches)||3,1),9);let h='';for(let m=1;m<=n;m++){h+=setRow('予選'+NUM[m-1],sel['opp'+m]||'',sel['p'+m+'a']||'',sel['p'+m+'b']||'',m);}return h;})()}
      `;
    }
    else if(q){
      body=`<div style="text-align:center;padding:24px;color:#9ca3af;">「${q}」のチームが見つかりませんでした</div>`;
    }
    else{
      body=`<div style="text-align:center;padding:24px;color:#9ca3af;">${pMode==='select'?'チームを選択してください':'チームNoを入力して検索してください'}</div>`;
    }

    return`<div style="padding:16px;max-width:480px;margin:0 auto;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
        <button id="btn-ti-sub-back" style="padding:6px 12px;border-radius:8px;border:1.5px solid #e5e7eb;background:#f9fafb;cursor:pointer;font-size:14px;color:#374151;">← 戻る</button>
        <div style="font-size:17px;font-weight:700;color:#111;">予選成績</div>
      </div>
      ${prelimNotice}
      ${searchBox}
      ${sel?'':prelimRankBtn}
      ${body}
    </div>`;
  }

  // ── サブ画面：チームNo検索（チーム名キーワード → チームNo一覧） ──
  if(v==='teamsearch'){
    const q=S._tsQuery||'';
    return`<div style="padding:16px;max-width:480px;margin:0 auto;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
        <button id="btn-ti-sub-back" style="padding:6px 12px;border-radius:8px;border:1.5px solid #e5e7eb;background:#f9fafb;cursor:pointer;font-size:14px;color:#374151;">← 戻る</button>
        <div style="font-size:17px;font-weight:700;color:#111;">${wTeam(tour||null)}Noを検索</div>
      </div>
      <div style="margin-bottom:12px;">
        <input type="text" id="ts-input" value="${q}" placeholder="${wTeam(tour||null)}名のキーワードを入力"
          style="width:100%;padding:11px 12px;border:1.5px solid #d1d5db;border-radius:10px;font-size:15px;"/>
      </div>
      <div id="ts-list">${S._tiLoading?`<div style="text-align:center;padding:32px;color:#9ca3af;">読み込み中...</div>`:buildTeamSearchList(q)}</div>
    </div>`;
  }
