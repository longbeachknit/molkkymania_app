        <div style="font-size:12px;color:#1a1a1a;font-weight:800;text-align:center;line-height:1.35;word-break:break-word;">${escH(_myName)}<br>として参加中</div>
        <button id="btn-clear-myteam" style="font-size:11px;font-weight:700;color:#1a1a1a;background:#fff;border:1px solid ${_theme};border-radius:9px;padding:4px 12px;cursor:pointer;white-space:nowrap;">解除</button>
      </div>`
    :`<button id="btn-go-reception" style="flex-shrink:0;width:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 8px;background:#FFCB3D;color:#2b2100;border:none;border-radius:12px;cursor:pointer;text-align:center;line-height:1.3;">
        <span style="font-size:30px;">📝</span>
        <span style="font-size:15px;font-weight:800;">受付<br><span style="font-size:11px;font-weight:700;">（${isSinglesActive()?'選手':'チーム'}登録）</span></span>
      </button>`;

  const _eventCard=`<div style="margin-bottom:20px;padding:14px 16px;background:${_themeBg};border:1.5px solid ${_theme};border-radius:14px;">
    <div style="display:flex;align-items:stretch;gap:12px;">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;">
        <div style="font-size:11px;color:#8a6d00;font-weight:800;letter-spacing:0.04em;">開催中の大会</div>
        <div style="font-size:18px;font-weight:800;color:#1a1a1a;line-height:1.35;margin-top:3px;">${_nameHtml}</div>
        ${_venueName?`<div style="font-size:13px;color:#6b7280;margin-top:7px;line-height:1.5;">📍 ${escH(_venueName)}</div>`:''}
        ${_period?`<div style="font-size:13px;color:#6b7280;margin-top:2px;line-height:1.5;">🗓 ${escH(_period)}</div>`:''}
      </div>
      ${_rightSide}
    </div>
    ${liveMatchBtnsHtml(_liveTour,_theme,eventCardBtnsHtml(_liveTour,_theme,{live:true}),_my?posBoxHtml_(_liveTour,_my.teamId,_theme,true):'')}
    ${_exhBtn}
  </div>`;

  /* 【1-5・8-7にそろえた】開催前（次）の大会のカード。
     土曜の大会が開催中でも、日曜の大会の会場・対戦相手を前もって見られるようにするためのもの。
     受付ボタンと交流戦ボタンは出さない（まだ始まっていないため）。
     新アプリでは「次の大会」がいくつでも入れられるので、1件ごとにカードを1枚出す
     （1件だけのときは 8-7 とまったく同じ見た目）。 */
  const _upCardOf=r=>{
    const _upTour=(AD.tournaments||[]).find(x=>String(x.venueCode||'')===String(r.venue_code||'')&&String(x.eventCode||'')===String(r.event_code||''))
                ||tourByCode(r.event_code);
    if(!_upTour)return'';
    const _upVenue=resolveVenue(_upTour);
    const _upVenueName=_upVenue?String((_upVenue.detail&&_upVenue.detail.locationName)||_upVenue.name||'').trim():'';
    const _upPeriod=fmtEventPeriod(_upTour);
    /* カードの色は開催中の大会とまったく同じ決め方。
       「場所の管理」でその場所にテーマカラーを設定していればその色、
       設定していなければ既定のゴールド（開催中のカードと同じ）。 */
    const _upTheme=(_upVenue&&_upVenue.themeColor)?_upVenue.themeColor:'#FFC93D';
    const _upRaw=(_upTour.displayName&&_upTour.displayName.trim())?_upTour.displayName:_upTour.eventName;
    const _upNameHtml=escH(_upRaw).replace(/\\n/g,'<br>').replace(/\n/g,'<br>');
    return`<div style="margin-bottom:20px;padding:14px 16px;background:${_upTheme}2E;border:1.5px solid ${_upTheme};border-radius:14px;">
    <div style="font-size:11px;color:#24507d;font-weight:800;letter-spacing:0.04em;">🗓 開催前の大会</div>
    <div style="font-size:18px;font-weight:800;color:#1a1a1a;line-height:1.35;margin-top:3px;">${_upNameHtml}</div>
    ${_upVenueName?`<div style="font-size:13px;color:#6b7280;margin-top:7px;line-height:1.5;">📍 ${escH(_upVenueName)}</div>`:''}
    ${_upPeriod?`<div style="font-size:13px;color:#6b7280;margin-top:2px;line-height:1.5;">🗓 ${escH(_upPeriod)}</div>`:''}
    ${eventCardBtnsHtml(_upTour,_upTheme)}
  </div>`;
  };
  const _upcomingCard=(S._upcomingEvents||[]).map(_upCardOf).join('');

  /* 【1-2】同じ日に2つ以上の大会が開催中のとき、どちらを見るか選んでもらう。
       開催中が1つだけのときは、この画面は出ません（今までと全く同じ表示）。 */
  const _lives=S._liveEvents||[];
  const _needPick=(_lives.length>=2&&!getSelectedLiveKey());
  const _pickCard=r=>{
    const t=(AD.tournaments||[]).find(x=>String(x.venueCode||'')===String(r.venue_code||'')&&String(x.eventCode||'')===String(r.event_code||''))
          ||(AD.tournaments||[]).find(x=>String(x.eventCode||'')===String(r.event_code||''));
    const v=(AD.venues||[]).find(x=>String(x.code)===String(r.venue_code||''));
    const nm=escH(r.label||(t&&(t.displayName||t.eventName))||('大会 '+(r.event_code||''))).replace(/\\n/g,' ').replace(/\n/g,' ');
    /* 【2026-10-26】色・会場名は、選んだあとのカードと同じ決め方（resolveVenue：配信で届いた会場＋この端末の場所の管理）。
         これまではこの端末の「場所の管理」だけを見ていたので、参加者の端末ではいつも黄色になっていた。
         まだ大会の設定が届いていない端末では、裏で読み込んでから描き直す（maybeSyncPickTours_）。 */
    const rv=t?resolveVenue(t):null;
    const vn=escH((rv&&rv.name)||(v&&v.name)||'');
    const col=(rv&&rv.themeColor)||(v&&v.themeColor)||'#FFC93D';
    return`<button class="live-pick" data-key="${escH(r.event_key)}" style="display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;background:${col}2E;border:1.5px solid ${col};border-radius:14px;cursor:pointer;">
      <div style="font-size:17px;font-weight:800;color:#1a1a1a;line-height:1.35;">${nm}</div>
      ${vn?`<div style="font-size:13px;color:#6b7280;margin-top:6px;">📍 ${vn}</div>`:''}
      <div style="font-size:12px;color:#8a6d00;font-weight:800;margin-top:8px;">この大会を見る ▸</div>
    </button>`;
  };
  const _switchBar=(_lives.length>=2&&getSelectedLiveKey())
    ?`<div style="margin:-14px 0 18px;text-align:right;"><button id="btn-switch-live" style="font-size:12px;font-weight:700;color:#6b7280;background:#fff;border:1px solid #e5e7eb;border-radius:99px;padding:5px 12px;cursor:pointer;">🔄 大会を切り替える</button></div>`
    :'';

  // 開催中の大会があるときだけカードを出す。無ければテンプレは表示しない。
  const topBlock=_needPick
    ?`<div style="margin-bottom:20px;">
        <div style="font-size:13px;font-weight:800;color:#8a6d00;margin-bottom:10px;">いま${_lives.length}つの大会が開催中です。</div>
        ${_lives.map(_pickCard).join('')}
      </div>`
    :(_liveTour
      ?(_eventCard+_switchBar)
      :(_liveCode===''
        ?`<div style="margin-bottom:20px;padding:18px 16px;background:#f9fafb;border:1px solid #eee;border-radius:14px;text-align:center;color:#9ca3af;font-size:13px;">現在、開催中の大会はありません。</div>`

/* =========================================================================
   【2026-10-27】大会の一覧（名前・開催日・会場）を Supabase から1回で読む。
   投擲成績・過去のスコアシートのプルダウンの並び順（新しい大会が上）と、
   「過去大会の結果」の一覧に使う。
   テンプレや動作確認用の大会（会場コード 99・大会コードが 9 から始まる・名前に「確認用」「テンプレ」「実験」）は出さない。
   ========================================================================= */
let _evMeta_=null,_evMetaP_=null;
function loadEventMeta_(){
  if(_evMeta_)return Promise.resolve(_evMeta_);
  if(_evMetaP_)return _evMetaP_;
  _evMetaP_=fetch(SB_URL+'/rest/v1/event_docs?kind=eq.settings&select=event_key,name:payload->>eventName,start:payload->>eventPeriodStart,vname:payload->venue->>name',
      {cache:'no-store',headers:sbHeaders()})
    .then(r=>r.ok?r.json():[])
    .then(rows=>{const m={};(rows||[]).forEach(r=>{if(r&&r.event_key)m[r.event_key]=r;});_evMeta_=m;_evMetaP_=null;return m;})
    .catch(()=>{_evMetaP_=null;return {};});
  return _evMetaP_;
}
function isTestEvent_(key){
  const p=String(key||'').split('_');
  if(p[0]==='99')return true;
  if(/^9/.test(p[1]||''))return true;
  const m=_evMeta_&&_evMeta_[key];
  return !!(m&&/確認用|テンプレ|実験/.test(String(m.name||'')));
}
function evStartMs_(key){
  const m=_evMeta_&&_evMeta_[key];
  const t=m&&m.start?Date.parse(m.start):NaN;
  return isNaN(t)?0:t;
}
/* 新しい大会が上。テスト用の大会は外す */
function sortEventsNewest_(keys){
  return (keys||[]).filter(k=>!isTestEvent_(k)).slice().sort((a,b)=>(evStartMs_(b)-evStartMs_(a))||String(b).localeCompare(String(a)));
}
function evDateJa_(key,withDow){
  const t=evStartMs_(key);
  if(!t)return '';
  const d=new Date(t);
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'+(withDow?'（'+'日月火水木金土'[d.getDay()]+'）':'');
}
function evNameOf_(key){
  const n=getEventName(key);
  if(n&&n!==key)return n;
  const m=_evMeta_&&_evMeta_[key];
  return (m&&m.name)||key;
}
/* プルダウンの1行：「2026年10月10日　大会名」 */
function evOptionsHtml_(keys,selected){
  return sortEventsNewest_(keys).map(e=>{
    const d=evDateJa_(e,false);
    return `<option value="${escSc_(e)}" ${selected===e?'selected':''}>${escSc_((d?d+'　':'')+evNameOf_(e))}</option>`;
  }).join('');
}

/* ===== 【2026-10-27】個人投擲成績 =====
   チーム名から検索：大会で絞り込み＋キーワード。パネルにメンバー名。押すとメンバーを選び、その大会の成績へ。
   個人名から検索：大会で絞り込み＋キーワード（選手名・チーム名）。大会を選べばその大会、選ばなければ通算の成績へ。 */
let _ps={mode:'landing',ev:'',q:'',teams:null,persons:null,loading:false,openTeam:-1};
async function psLoad_(){
  _ps.loading=true;
  try{
    await loadEventMeta_();
    if(_ps.mode==='team'&&!_ps.teams){
      const r=await sbGet_('v_team_event?select=event_code,team_no,team_name,members&order=event_code.desc,team_no');
      _ps.teams=r.filter(x=>!isTestEvent_(x.event_code));
    }
    if(_ps.mode==='person'&&!_ps.persons){
      const r=await sbGet_('v_person_event?select=member,team_no,team_name,event_code&order=member');
      _ps.persons=r.filter(x=>!isTestEvent_(x.event_code));
    }
  }catch(e){console.error('個人投擲成績の読み込みに失敗',e);}
  _ps.loading=false;
}
function psEvKeys_(rows){return [...new Set((rows||[]).map(x=>x.event_code))];}
function psHas_(v,q){return String(v||'').toLowerCase().includes(q);}
function psResultsHtml_(){
  const q=String(_ps.q||'').trim().toLowerCase();
  const card='background:#fff;border:1.5px solid #FFCB3D;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;';
  const msg=t=>`<div style="text-align:center;padding:28px 8px;color:#9ca3af;font-size:13px;">${t}</div>`;
  if(_ps.loading||(_ps.mode==='team'?!_ps.teams:!_ps.persons))return msg('読み込み中...');
  const LIMIT=100;
  const more=n=>n>LIMIT?`<div style="font-size:12px;color:#6b7280;text-align:center;padding:6px;">ほか ${n-LIMIT} 件。キーワードで絞り込んでください</div>`:'';
  const evLine=k=>escSc_((evDateJa_(k,false)?evDateJa_(k,false)+'　':'')+evNameOf_(k));
  if(_ps.mode==='team'){
    if(!_ps.ev&&!q)return msg('大会を選ぶか、チーム名を入れてください');
    const list=_ps.teams.map((t,i)=>({t,i})).filter(({t})=>(!_ps.ev||t.event_code===_ps.ev)&&(!q||psHas_(t.team_name,q)||psHas_(t.team_no,q)))
      .sort((a,b)=>(evStartMs_(b.t.event_code)-evStartMs_(a.t.event_code))||String(a.t.team_no).localeCompare(String(b.t.team_no)));
    if(!list.length)return msg('チームが見つかりません');
    return `<div style="font-size:12px;color:#6b7280;margin-bottom:6px;">${list.length} 件</div>`+list.slice(0,LIMIT).map(({t,i})=>{
      const mem=t.members||[];
      const open=_ps.openTeam===i;
      return `<div class="ps-team" data-i="${i}" style="${card}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <div style="min-width:0;">
            <div style="font-size:14px;font-weight:800;color:#1a1a1a;">${escSc_(t.team_name)}</div>
            <div style="font-size:11.5px;color:#6b7280;margin-top:2px;">No.${escSc_(t.team_no)}　${evLine(t.event_code)}</div>
            <div style="font-size:12.5px;color:#374151;margin-top:4px;">${mem.length?mem.map(escSc_).join(' / '):'メンバー未登録'}</div>
          </div>
          <div style="color:#9ca3af;font-size:13px;white-space:nowrap;">${open?'▲':'›'}</div>
        </div>
        ${open?(mem.length?`<div style="margin-top:10px;padding-top:10px;border-top:1px dashed #FFCB3D;">
          <div style="font-size:12px;color:#6b7280;font-weight:700;margin-bottom:6px;">誰の成績を見ますか？</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">${mem.map(n=>`<button class="ps-mem" data-name="${escSc_(n)}" data-ev="${escSc_(t.event_code)}" data-tn="${escSc_(t.team_no)}" style="padding:10px 6px;font-size:13px;font-weight:700;background:#FFCB3D;border:none;border-radius:8px;color:#2b2100;cursor:pointer;">${escSc_(n)}</button>`).join('')}</div>
        </div>`:`<div style="margin-top:8px;font-size:12px;color:#9ca3af;">メンバーが登録されていません</div>`):''}
      </div>`;
    }).join('')+more(list.length);
  }
  // 個人名から検索
  if(_ps.ev){
    const list=_ps.persons.filter(p=>p.event_code===_ps.ev&&(!q||psHas_(p.member,q)||psHas_(p.team_name,q)));
    if(!list.length)return msg('選手が見つかりません');
    return `<div style="font-size:12px;color:#6b7280;margin-bottom:6px;">${list.length} 件（この大会の成績）</div>`+list.slice(0,LIMIT).map(p=>`<div class="ps-person" data-name="${escSc_(p.member)}" data-ev="${escSc_(p.event_code)}" data-tn="${escSc_(p.team_no)}" style="${card}display:flex;justify-content:space-between;align-items:center;">
        <div><div style="font-size:14px;font-weight:800;color:#1a1a1a;">${escSc_(p.member)}</div><div style="font-size:12px;color:#6b7280;margin-top:2px;">${escSc_(p.team_name)}（No.${escSc_(p.team_no)}）</div></div>
        <div style="color:#9ca3af;font-size:18px;">›</div></div>`).join('')+more(list.length);
  }
  if(!q)return msg('名前かチーム名を入れてください（大会を選ばないときは通算の成績です）');
  const by={};
  _ps.persons.forEach(p=>{(by[p.member]=by[p.member]||[]).push(p);});
  const list=Object.keys(by).filter(n=>psHas_(n,q)||by[n].some(p=>psHas_(p.team_name,q))).sort((a,b)=>a.localeCompare(b,'ja'));
  if(!list.length)return msg('選手が見つかりません');
  return `<div style="font-size:12px;color:#6b7280;margin-bottom:6px;">${list.length} 件（通算の成績）</div>`+list.slice(0,LIMIT).map(n=>{
    const rows=by[n].slice().sort((a,b)=>evStartMs_(b.event_code)-evStartMs_(a.event_code));
    const tns=[...new Set(rows.map(r=>r.team_name))];
    return `<div class="ps-person" data-name="${escSc_(n)}" data-ev="" data-tn="" style="${card}display:flex;justify-content:space-between;align-items:center;">
      <div style="min-width:0;"><div style="font-size:14px;font-weight:800;color:#1a1a1a;">${escSc_(n)}</div><div style="font-size:12px;color:#6b7280;margin-top:2px;">出場 ${new Set(rows.map(r=>r.event_code)).size} 大会　${escSc_(tns.slice(0,3).join(' / '))}${tns.length>3?' ほか':''}</div></div>
      <div style="color:#9ca3af;font-size:18px;">›</div></div>`;
  }).join('')+more(list.length);
}

function buildSS(cset,editable,_setIdx){
  const fti=cset.ftid,sti=1-fti;
  // スコアシート：実際に投げたメンバーは必ず列に含める（excludedでも投擲があれば表示）
  const mbrs=[0,1].map(ti=>{
    const td=cset.teams[ti];
    const excl=td.excluded||[];
    const full=td.order&&td.order.length>0?td.order:(S.teams[ti].members.length?S.teams[ti].members:['投てき者']);
    // このセットで実際に投げたメンバー（throwsに登場する名前）
    const threwSet=new Set();
    (td.throws||[]).forEach(th=>{if(th&&th.member!=null&&th.member!=='')threwSet.add(th.member);});
    // 基本はexcludedを除いた順。ただし実際に投げたメンバーはexcludedでも残す
    let active=full.filter(m=>!excl.includes(m)||threwSet.has(m));
    // orderに載っていないが投げたメンバー（名簿変更等）も末尾に追加して取りこぼし防止
    threwSet.forEach(m=>{if(!active.includes(m))active.push(m);});
    return active.length>0?active:full;
  });
  const nM=[mbrs[0].length,mbrs[1].length];
  const maxT=Math.max(cset.teams[0].throws.length,cset.teams[1].throws.length);
  const cF=nM[fti]+1,cS=nM[sti]+1;
  const mhdr=(ti)=>mbrs[ti].map(m=>`<th class="mbr-th" style="border:1px solid #bbb;">${m}</th>`).join('');
  function tDisp(th,ti,thIdx){
    if(!th)return'';
    if(th.miss){const inner=`<span style="color:#9ca3af;font-size:15px;">—</span>`;return editable?`<span class="edit-th-btn" data-ti="${ti}" data-idx="${thIdx}" data-setidx="${_setIdx}" style="cursor:pointer;">${inner}✏️</span>`:inner;}
    const sc=th.raw!==undefined?th.raw:th.pts;
    let inner='';
    if(th.result==='circle'&&th.multi)inner=svgS(sc,22);
    else if(th.result==='circle')inner=svgC(sc,22);
    else if(th.result==='unknown')inner=`<span style="font-weight:600;font-size:14px;color:#f59e0b;">${sc}？</span>`;
    else inner=`<span style="font-weight:600;font-size:14px;">${sc}</span>`;
    return editable?`<span class="edit-th-btn" data-ti="${ti}" data-idx="${thIdx}" data-setidx="${_setIdx}" style="cursor:pointer;">${inner}✏️</span>`:inner;
  }
  const prevC=[0,0];
  function totDisp(th,ti){
    if(!th)return'';
    if(th.miss)return`<span style="color:#6b7280;">${prevC[ti]}</span>`;
    if(th.over){prevC[ti]=th.cumul;return`<span style="color:#b45309;font-weight:600;">${th.cumul}</span>`;}
    prevC[ti]=th.cumul;return`<span style="font-weight:600;">${th.cumul}</span>`;
  }
  let rows='';
  for(let t=0;t<maxT;t++){
    const thF=cset.teams[fti].throws[t],thS=cset.teams[sti].throws[t];
    // 投擲者名で列を特定。名前が見つからない場合のみローテーション位置でフォールバック
    const idxF=thF?mbrs[fti].indexOf(thF.member):-1;
    const idxS=thS?mbrs[sti].indexOf(thS.member):-1;
    const mF=thF?(idxF>=0?idxF:(nM[fti]?t%nM[fti]:-1)):-1;
    const mS=thS?(idxS>=0?idxS:(nM[sti]?t%nM[sti]:-1)):-1;
    const cF2=mbrs[fti].map((_,mi)=>mi!==mF||!thF?`<td class="sc-cell" style="border:1px solid #bbb;"></td>`:`<td class="sc-cell ${editable?'editable':''}" style="border:1px solid #bbb;">${tDisp(thF,fti,t)}</td>`).join('');
    const cS2=mbrs[sti].map((_,mi)=>mi!==mS||!thS?`<td class="sc-cell" style="border:1px solid #bbb;"></td>`:`<td class="sc-cell ${editable?'editable':''}" style="border:1px solid #bbb;">${tDisp(thS,sti,t)}</td>`).join('');
    rows+=`<tr><td class="turn-col" style="border:1px solid #bbb;">${t+1}</td>${cF2}<td class="tot-cell" style="border:1px solid #bbb;border-right:2.5px solid #aaa;">${totDisp(thF,fti)}</td>${cS2}<td class="tot-cell" style="border:1px solid #bbb;">${totDisp(thS,sti)}</td></tr>`;
  }
  const eF=cset.teams[fti].el,eS=cset.teams[sti].el;
  if(eF||eS){
    const fe=eF?`<span style="color:#E24B4A;font-weight:700;">0</span>`:`<span style="color:#1D9E75;font-weight:700;">50</span>`;
    const se=eS?`<span style="color:#E24B4A;font-weight:700;">0</span>`:`<span style="color:#1D9E75;font-weight:700;">50</span>`;
    rows+=`<tr style="background:#fff8f8;"><td class="turn-col" style="border:1px solid #bbb;font-size:11px;color:#E24B4A;font-weight:700;">失</td>${mbrs[fti].map(()=>`<td class="sc-cell" style="border:1px solid #bbb;background:#fff8f8;"></td>`).join('')}<td class="tot-cell" style="border:1px solid #bbb;border-right:2.5px solid #aaa;background:#fff8f8;">${fe}</td>${mbrs[sti].map(()=>`<td class="sc-cell" style="border:1px solid #bbb;background:#fff8f8;"></td>`).join('')}<td class="tot-cell" style="border:1px solid #bbb;background:#fff8f8;">${se}</td></tr>`;
  }
  if(!rows)rows=`<tr><td colspan="${1+cF+cS}" style="border:1px solid #bbb;padding:12px;font-size:13px;color:#9ca3af;text-align:center;">まだ投てきなし</td></tr>`;
  return`<div class="ss-wrap"><table class="ss-tbl"><thead>
    <tr><th class="turn-col" style="border:1px solid #bbb;"></th>
      <th colspan="${cF}" class="team-hdr" style="border:1px solid #bbb;border-right:2.5px solid #aaa;background:${LB[fti]};color:${LT[fti]};">${S.teams[fti].name}</th>
      <th colspan="${cS}" class="team-hdr" style="border:1px solid #bbb;background:${LB[sti]};color:${LT[sti]};">${S.teams[sti].name}</th>
    </tr>
    <tr><th class="turn-col" style="border:1px solid #bbb;"></th>
      ${mhdr(fti)}<th class="tot-th" style="border:1px solid #bbb;border-right:2.5px solid #aaa;">計</th>
      ${mhdr(sti)}<th class="tot-th" style="border:1px solid #bbb;">計</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

      <div style="font-size:14px;font-weight:800;color:#b91c1c;margin-bottom:6px;">⚠️ 送信できませんでした</div>
      <div style="font-size:13px;color:#991b1b;line-height:1.75;">${escHtml(S._submitError)}</div>
      ${S._submitErrorHint?`<div style="font-size:12.5px;color:#7f1d1d;line-height:1.8;margin-top:9px;padding-top:9px;border-top:1px solid #fecaca;white-space:pre-wrap;">${escHtml(S._submitErrorHint)}</div>`:''}
      <div style="font-size:11.5px;color:#b91c1c;margin-top:9px;">試合ID: ${escHtml(S._matchId||'（未取得）')}</div>

}

function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// 大会1件の管理行（フォルダ移動ドロップダウン付き）
/* 【1-5】いま「次の大会」になっている大会の一覧（会場コード_大会コード）。
   ホームで取りに行った最新のリストがあればそれ、なければこの端末で最後に書いた控え。 */
function upcomingKeysNow_(ad){
  if(Array.isArray(S._upcomingRaw))return S._upcomingRaw.map(r=>String(r.event_key));
  return ((ad&&ad.upcomingKeys)||[]).slice();
}
/* 【8-7】番号順に並べるための比べ方。
   「01」「02」…「10」のような数字のコードは、数として比べる
   （文字のまま比べると「10」が「9」より前に来てしまうため）。
   数字でないコードは、数字のものより後ろに置いて、文字順で並べる。 */
function byCodeAsc_(getCode){
  return (a,b)=>{
    const ca=String(getCode(a)||'').trim(), cb=String(getCode(b)||'').trim();
    const na=/^\d+$/.test(ca)?parseInt(ca,10):NaN;
    const nb=/^\d+$/.test(cb)?parseInt(cb,10):NaN;
    const aNum=!isNaN(na), bNum=!isNaN(nb);
    if(aNum&&bNum)return na-nb;
    if(aNum!==bNum)return aNum?-1:1;
    return ca.localeCompare(cb,'ja');
  };
}
/* 場所の一覧を番号順に並べたものを返す。
   編集・削除ボタンは「元の並びの何番目か」を使うので、元の位置(i)も一緒に持たせる。 */
function venuesSorted_(ad){
  return ((ad&&ad.venues)||[]).map((v,i)=>({v,i})).sort(byCodeAsc_(x=>x.v.code));
}
// 大会の一覧を、大会コードの番号順に並べたものを返す
function toursSorted_(list){
  return (list||[]).slice().sort(byCodeAsc_(t=>t.eventCode));
}

function adminTourRowHtml(t,ad){
  const venue=(ad.venues||[]).find(v=>v.code===t.venueCode);
  const folderOpts='<option value="">未分類</option>'+(ad.folders||[]).map(f=>`<option value="${f.id}" ${String(t.folderId||'')===String(f.id)?'selected':''}>${escHtml(f.name)}</option>`).join('');
  /* 【8-7 修正】名前とボタンを横1列に詰め込んでいたため、ボタンに場所を取られて
     大会名が何行にも折り返し、1件がとても縦長になっていた。
     1段目＝大会名（横幅いっぱい）、2段目＝ボタン（入りきらなければ折り返す）に分ける。
     ボタンの文字は white-space:nowrap で、途中で折り返さないようにする。 */
  const _bs='padding:3px 8px;white-space:nowrap;';
  const _tag='font-size:11px;padding:2px 6px;border-radius:99px;white-space:nowrap;';
  return`<div style="padding:10px 0;border-bottom:1px solid #f3f4f6;">
    <div style="min-width:0;">
      <div style="font-size:14px;font-weight:600;color:#111;line-height:1.4;word-break:break-word;">${t.eventName||'（大会名未設定）'}</div>
      <div style="font-size:12px;color:#6b7280;margin-top:2px;">${venue?venue.name:'場所未設定'} / コード: ${t.eventCode||'未設定'}</div>
      <div style="font-size:12px;color:#9ca3af;">チーム${(t.teams||[]).length}件 / 対戦${(t.matches||[]).length}件</div>
    </div>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;">
      ${t.eventCode?`<button class="btn btn-gray btn-xs admin-refresh-tour" data-code="${t.venueCode?t.venueCode+'_'+t.eventCode:t.eventCode}" title="配信された最新の内容を取り込みます" style="${_bs}">⟳ 更新</button>`:''}
      <button class="btn btn-gray btn-xs admin-edit-tour" data-id="${t.id}" style="${_bs}">編集</button>
      <button class="btn btn-red-o btn-xs admin-del-tour" data-id="${t.id}" style="padding:2px 7px;font-size:11px;white-space:nowrap;">削除</button>
      ${(ad.activeEventCode&&t.eventCode&&ad.activeEventCode===t.eventCode)?
        `<span style="${_tag}background:#FEF3C7;color:#92400E;">📡 配信中</span>`:
        `<button class="btn btn-gray btn-xs admin-set-active" data-code="${t.eventCode}" style="${_bs}">📡 配信中にする</button>`}
      ${(()=>{
        /* 【1-5】「次の大会」は新アプリ用の Supabase のリスト（何件でも）。従来アプリの active.json には書かない。 */
        if(!t.eventCode)return'';
        const uk=(t.venueCode?t.venueCode+'_':'')+t.eventCode;
        const now=upcomingKeysNow_(ad);
        return now.indexOf(uk)>=0
          ?`<span style="${_tag}background:#EAF2FB;color:#24507d;">🗓 次の大会</span><button class="btn btn-gray btn-xs admin-clear-upcoming" data-key="${escHtml(uk)}" style="${_bs}">解除</button>`
          :`<button class="btn btn-gray btn-xs admin-set-upcoming" data-key="${escHtml(uk)}" data-code="${t.eventCode}" style="${_bs}">🗓 次の大会にする</button>`;
      })()}
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:6px;">
      <span style="font-size:11px;color:#9ca3af;white-space:nowrap;">📁 フォルダ</span>
      <select class="admin-move-folder" data-id="${t.id}" style="flex:1;font-size:12px;padding:4px 6px;">${folderOpts}</select>
    </div>
  </div>`;
}

/* 管理者画面：交流戦の参加申請の設定
     (a) 申請フォームを作るかどうか
     (b) 交流戦の試合数
     (c) それぞれの名前
     (d) それぞれの詳細説明（参加者の選択画面に出る） */
/* ===== 【8-8】予選順位による進出先 =====
   大会設定に「○位〜○位 → 進出先（トーナメント種類）」を持つ。
   予選結果の画面で「このままいくと〜に進出」「〜に進出！」、ランキングで「⬆︎〜進出」などを出すのに使う。
   形：[{from:1,to:32,tourneyCode:'02',label:'決勝トナメ'}, …]（label は空なら トーナメント種類の名前） */
const ADV_COLORS_=['#F28B82','#FBC77A','#8AB4F8','#A8DAB5','#D7AEFB','#FDE293','#F6AEA9','#AECBFA'];
function advanceRulesOf_(tour){
  return ((tour&&tour.advanceRules)||[]).map(r=>({from:parseInt(r.from,10)||'',to:parseInt(r.to,10)||'',tourneyCode:String(r.tourneyCode||''),label:String(r.label||'').trim()}));
}
/* 進出先の名前（tourneyCode の名前。無ければ「トナメ区分○○」） */
function advanceName_(tour,rule){
  const tr=((tour&&tour.tourneyRules)||[]).find(x=>String(x.code)===String(rule.tourneyCode));
  return (tr&&tr.name)||('トナメ区分'+rule.tourneyCode);
}
/* その順位の進出先。{i, rule, name(正式名), label(短い名前)} か null */
function advanceOfRank_(tour,rank){
  const n=parseInt(rank,10);
  if(isNaN(n))return null;
  const rules=advanceRulesOf_(tour);
  for(let i=0;i<rules.length;i++){
    const r=rules[i];
    if(r.from&&r.to&&r.tourneyCode&&n>=r.from&&n<=r.to){
      const name=advanceName_(tour,r);
      return {i:i,rule:r,name:name,label:r.label||name};
    }
  }
  return null;
}

// ===== ルール入力モーダル（overlay方式） =====
function showRuleModal(prefix,idx){
  const _t=ruleEditTarget();const tour=_t.obj;
  const rules=prefix==='match'?(tour.matchRules=tour.matchRules||[]):(tour.tourneyRules=tour.tourneyRules||[]);
  const r=idx!=null?{...rules[idx]}:{code:'',name:'',fmt:'best2',turnLimit:false,playerMin:2,playerMax:4,round:''};
  const label=prefix==='match'?'試合区分':'トーナメント種類';
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;';
  overlay.innerHTML=`<div style="background:#fff;border-radius:12px;padding:18px;width:100%;max-width:420px;">
    <div style="font-size:16px;font-weight:700;margin-bottom:14px;">${label}ルール${idx!=null?'を編集':'を追加'}</div>
    <div style="display:grid;gap:10px;">
      <div><div style="font-size:13px;color:#6b7280;margin-bottom:4px;">コード（試合IDの該当桁）</div><input type="text" id="m-code" value="${r.code}" placeholder="例: 01"/></div>
      <div><div style="font-size:13px;color:#6b7280;margin-bottom:4px;">名称（任意）</div><input type="text" id="m-name" value="${r.name}" placeholder="例: 予選"/></div>
      <div><div style="font-size:13px;color:#6b7280;margin-bottom:4px;">試合形式</div>
        <select id="m-fmt"><option value="best2" ${r.fmt==='best2'?'selected':''}>2先</option><option value="best3" ${r.fmt==='best3'?'selected':''}>3先</option><option value="round2" ${r.fmt==='round2'?'selected':''}>表裏</option></select></div>
      <div><label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" id="m-tl" ${r.turnLimit?'checked':''} style="width:auto;accent-color:#1D9E75;"/><span style="font-size:14px;">12ターン制限</span></label></div>
      <div style="display:flex;gap:10px;">
        <div style="flex:1;"><div style="font-size:13px;color:#6b7280;margin-bottom:4px;">最小人数</div><input type="text" id="m-pmin" value="${r.playerMin}" style="text-align:center;"/></div>
        <div style="flex:1;"><div style="font-size:13px;color:#6b7280;margin-bottom:4px;">最大人数</div><input type="text" id="m-pmax" value="${r.playerMax>=99?'∞':r.playerMax}" style="text-align:center;"/></div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button id="m-cancel" class="btn btn-gray" style="flex:1;">キャンセル</button>
      <button id="m-save" class="btn btn-green" style="flex:2;">保存</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('m-cancel').onclick=()=>document.body.removeChild(overlay);
  document.getElementById('m-save').onclick=()=>{
    const code=document.getElementById('m-code').value.trim();
    if(!code){alert('コードを入力してください');return;}
    const pmaxVal=document.getElementById('m-pmax').value.trim();
    const newRule={
      code,
      name:document.getElementById('m-name').value.trim(),
      fmt:document.getElementById('m-fmt').value,
      turnLimit:document.getElementById('m-tl').checked,
      playerMin:parseInt(document.getElementById('m-pmin').value)||2,
      playerMax:pmaxVal==='∞'||pmaxVal===''?99:(parseInt(pmaxVal)||4)
    };
    const _t2=ruleEditTarget();const tour=_t2.obj;
  const rules=prefix==='match'?(tour.matchRules=tour.matchRules||[]):(tour.tourneyRules=tour.tourneyRules||[]);
    if(idx!=null)rules[idx]=newRule;else rules.push(newRule);
    _t2.save();document.body.removeChild(overlay);render();
  };
}





// ===== 成績閲覧 =====
function rViewPortal(){
  const vs=_viewState;
  // シングルス大会は「チームの成績」と「個人の成績」が同じ中身になるため、チームのボタンを出さない
  const _sglView=isSinglesEventCode(vs.eventCode);
  if(_sglView&&vs.tab==='team')vs.tab='person';
  const tabs=[{id:'event',label:'🏆 大会'}]
    .concat(_sglView?[]:[{id:'team',label:'👤👤👤 チーム'}])
    .concat([{id:'person',label:_sglView?'👤 選手':'👤 個人'}]);

      <div style="font-size:18px;font-weight:700;">投擲成績</div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <div style="font-size:16px;font-weight:700;">📖 成績詳細ページ</div>

        <p style="margin:0 0 10px;">参加者数と総投擲回数を示しており、その下に勝率を表示しています。先行セットと後行セットの勝率を足しても100%にならない場合がありますが、これは予選に引き分けのセットが含まれているためです。その分が加味されているものとしてご確認ください。</p>

        <div style="font-weight:700;margin:14px 0 6px;">2. スタッツ項目</div>
        <div style="margin-bottom:6px;"><span style="font-weight:600;">(a) QH率（クオリティヒット率）</span><br>狙い通りの基準（詳細は別紙参照）に当てはまった投擲の割合を計算しています。</div>
        <div style="margin-bottom:6px;"><span style="font-weight:600;">(b) フォルト率</span><br>総投擲回数に対して、0点だった投擲が何パーセントあるかを示す指標です。</div>
        <div style="margin-bottom:6px;"><span style="font-weight:600;">(c) 上がりターン平均</span><br>上がったセットにおいて、何ターンかかったかの平均を表しています。</div>
        <div style="margin-bottom:6px;"><span style="font-weight:600;">(d) セット点数平均</span><br>各セットの点数の平均です。「セットの合計得点 ÷ セット数」で算出しています。</div>
        <div style="margin-bottom:10px;"><span style="font-weight:600;">(e) 平均ブレイク本数</span><br>先行の1投目で何点獲得したかの平均点です。</div>

        <div style="font-weight:700;margin:14px 0 6px;">3. 平均投擲得点について</div>
        <p style="margin:0 0 10px;">「個人が獲得した点数の合計 ÷ 総投擲回数」で求めています。例えば、バーストして39点から25点に戻った場合でも、本来獲得した12点（あるいは記録上の点数）がそのまま計算に含まれるため、バーストによる減退の影響が考慮されません。</p>

        <div style="font-weight:700;margin:14px 0 6px;">4. 平均投擲時間</div>
        <p style="margin:0;">点数が入力されてから次の点数が入力されるまでの時間を計測したものです。モルック協会が定める規定の投擲時間とは定義が異なりますので、参考値としてご覧ください。</p>
      </div>
    </div>
    <div style="margin-bottom:12px;">

function rViewTeamDetail(){
  const t=_viewState.selectedTeam;
  if(_viewState.loading||!t){
    return`<div style="padding:20px;text-align:center;padding:48px;color:#6b7280;">
      <div style="font-size:24px;margin-bottom:8px;">⏳</div>
      <div>読み込み中...</div>
    </div>`;
  }

  // スプシの確定版値をそのまま使用（既にパーセント換算済みの場合とそうでない場合を判定）
  const toP=(v)=>{
    const n=parseFloat(v)||0;
    // 0〜1の範囲なら×100、既に0〜100ならそのまま
    return n>0&&n<=1?Math.round(n*1000)/10:Math.round(n*10)/10;
  };

  // sub: 例 '2勝 / 3試合' のような補足テキスト（省略可）。ドーナツ円グラフ1マスを返す。
  const sr=(label,val,rank,color,barMax,sub)=>{
    const num=parseFloat(val)||0;
    const w=barMax>0?num/barMax*100:0;
    return statDonut(label,val==null?'-':val,w,color,sub,rank);
  };
  const grid=inner=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">${inner}</div>`;

  // 試合勝率は「勝ち＋負け」を分母にして計算し直す（予選を分母に含めない）。予選数＝総試合−勝−負。
  const twWin=parseInt(t.winMatches)||0, twLose=parseInt(t.loseMatches)||0;
  const twDecided=twWin+twLose;
  const twPrelim=Math.max(0,(parseInt(t.totalMatches)||0)-twDecided);
  const mwr=twDecided>0?Math.round(twWin/twDecided*1000)/10:0;
  const swr=toP(t.setWinRate);
  const fwr=toP(t.firstWinRate);
  const swr2=toP(t.secondWinRate);
  const qhr=toP(t.qhRate);
  const fr=toP(t.fRate);

  return`<div style="padding:8px 0 4px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
      <button class="btn btn-gray btn-sm" id="btn-bk-view-detail">← 戻る</button>
      <div style="font-size:16px;font-weight:700;">${t.teamName}</div>
    </div>
    <div class="card" style="padding:14px;margin-bottom:12px;">
      <div style="font-size:12px;color:#6b7280;margin-bottom:4px;">メンバー</div>
      <div style="font-size:14px;">${(t.members||[]).join(' / ')||'未登録'}</div>
    </div>
    <div class="card" style="padding:14px;margin-bottom:12px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:8px;">勝敗</div>
      ${grid(
        sr('試合勝率',mwr+'%',t.rankMatchWin,'#F2B705',100,`${twWin}勝 / ${twDecided}試合`)+
        sr('セット勝率',swr+'%',t.rankSetWin,'#F2B705',100,`${(t.firstWinSets??0)+(t.secondWinSets??0)}勝 / ${t.totalSets??'?'}セット`)
      )}
      <div style="padding:10px 0 0;font-size:13px;color:#6b7280;text-align:center;">${t.winMatches??'-'}勝${t.loseMatches??'-'}敗 ${t.totalMatches??'-'}試合${twPrelim>0?`（うち予選${twPrelim}試合）`:''}</div>
    </div>
    <div class="card" style="padding:14px;margin-bottom:12px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:8px;">先攻・後攻</div>
      ${grid(
        sr('先攻セット勝率',fwr+'%',t.rankFirstWin,'#F2B705',100,`${t.firstWinSets??'?'}勝 / ${t.firstSets??'?'}セット`)+
        sr('後攻セット勝率',swr2+'%',t.rankSecondWin,'#F2B705',100,`${t.secondWinSets??'?'}勝 / ${t.secondSets??'?'}セット`)
      )}
    </div>
    <div class="card" style="padding:14px;margin-bottom:12px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:8px;">スタッツ</div>
      ${grid(
        sr('QH率',qhr+'%',t.rankQh,'#F2B705',100,(parseInt(t.dTotalThrows)||0)>0?`${t.totalAim??'?'}投 / ${t.dTotalThrows??'?'}投`:'')+
        sr('フォルト率',fr+'%',t.rankF,'#F2B705',100,(parseInt(t.totalThrows)||0)>0?`${t.totalFault??'?'}投 / ${t.totalThrows??'?'}投`:'')+
        sr('上がりターン平均',t.agariAvg,t.rankAgari,'#F2B705',12,(parseInt(t.agariCount)||0)>0?`上がり${t.agariCount}回`:'')+
        sr('セット点数平均',t.setPtsAvg,t.rankSetPts,'#F2B705',50,(parseInt(t.totalSets)||0)>0?`${t.totalSets}セット中`:'')+
        sr('平均ブレーク本数',t.breakAvg,t.rankBreak,'#F2B705',12,(parseInt(t.breakCount)||0)>0?`${t.breakCount}投`:'')+
        sr('平均投擲得点',t.throwPtsAvg,t.rankThrowPts,'#F2B705',12,(parseInt(t.totalThrows)||0)>0?`${t.totalThrows}投`:'')+
        sr('後攻1投目平均',t.s1Avg,t.rankS1,'#F2B705',12,(parseInt(t.secondFirst1Count)||0)>0?`${t.secondFirst1Count}投`:'')+
        sr('平均投擲時間(秒)',t.throwTimeAvg,t.rankThrowTime,'#F2B705',60,(parseInt(t.totalThrows)||0)>0?`${t.totalThrows}投`:'')
      )}
    </div>
  </div>`;
}

function rViewRanking(type){
  const vs=_viewState;
  const metrics=type==='team'?TEAM_METRICS:PERSON_METRICS;
  const selMetric=vs.rankMetric||'';
  const m=metrics.find(x=>x.key===selMetric)||metrics[0];
  const rankPersonMode=vs.rankPersonMode||'event';

  // モード切り替えタブ（個人のみ）
  const modeTabs=(type==='person'&&!vs.rankCumulOnly)?`
    <div style="display:flex;gap:6px;margin-bottom:12px;">
      <button class="btn ${rankPersonMode==='event'?'btn-gold':'btn-gray'} btn-sm" id="vrpm-event" style="flex:1;">大会ごと</button>
      <button class="btn ${rankPersonMode==='cumul'?'btn-gold':'btn-gray'} btn-sm" id="vrpm-cumul" style="flex:1;">通算</button>
    </div>`:'';

  let bodyHtml='';
  if(vs.loading){
    bodyHtml='<div style="text-align:center;padding:48px;color:#6b7280;"><div style="font-size:24px;">⏳</div><div>読み込み中...</div></div>';
  } else if(vs.rankData.length){
    // 元のインデックスを保持して分類（クリック時のrankData参照を維持するため）
    const withIdx=vs.rankData.map((d,i)=>({d,i}));
    const rankStr=x=>String(x.d.rank==null?'':x.d.rank).trim();
    // 「データなし」はランキングから除外
    const visible=withIdx.filter(x=>rankStr(x)!=='データなし');
    // 数値順位を持つ人／圏外（数値でない）に分類
    const ranked=visible.filter(x=>{const n=parseInt(rankStr(x));return !isNaN(n)&&n>0;});
    const out   =visible.filter(x=>{const n=parseInt(rankStr(x));return isNaN(n)||n<=0;});
    // 順位ありは順位昇順
    ranked.sort((a,b)=>(parseInt(rankStr(a))||999)-(parseInt(rankStr(b))||999));
    // 圏外は名前順（漢字優先→五十音順）
    const _isKanji=n=>/^[\u4E00-\u9FFF\u3400-\u4DBF]/.test(n||'');
    const nameOf=x=>type==='team'?(x.d.teamName||''):(x.d.name||'');
    out.sort((a,b)=>{const an=nameOf(a),bn=nameOf(b);const ak=_isKanji(an)?0:1,bk=_isKanji(bn)?0:1;if(ak!==bk)return ak-bk;return an.localeCompare(bn,'ja');});

    const renderRow=(x,isOut)=>{
      const d=x.d,i=x.i;
      const val=parseFloat(d.value)||0;
      const r=parseInt(d.rank)||0;
      const label=type==='team'?d.teamName:d.name;
      const sub=type==='team'?`No.${d.teamNo}`:(rankPersonMode==='cumul'?'通算':d.teamName||'');
      const color=isOut?'#9ca3af':(r===1?'#f59e0b':r===2?'#94a3b8':r===3?'#b45309':'#6b7280');
      const dataAttr=type==='team'?`data-rank-team="${i}"`:rankPersonMode==='cumul'?`data-rank-cumul="${d.name}"`:`data-rank-person="${i}"`;
      const rankDisp=isOut?'<span style="font-size:12px;">圏外</span>':r;
      return`<div class="card" style="padding:10px 14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;" ${dataAttr}>
        <div style="font-size:18px;font-weight:800;color:${color};min-width:28px;">${rankDisp}</div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;">${label}</div>
          <div style="font-size:12px;color:#9ca3af;">${sub}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="font-size:16px;font-weight:700;">${val}${m.unit}</div>
          <div style="color:#9ca3af;">›</div>
        </div>
      </div>`;
    };
    bodyHtml=ranked.map(x=>renderRow(x,false)).join('')+out.map(x=>renderRow(x,true)).join('');
  } else if(!vs.loading){
    bodyHtml='<div style="text-align:center;padding:24px;color:#9ca3af;">指標を選択してください</div>';
  }

  const metricBtns=metrics.map(mx=>`<button class="btn ${selMetric&&mx.key===selMetric?'btn-gold':'btn-gray'} btn-xs" data-metric="${mx.key}" style="margin:3px;padding:5px 10px;font-size:12px;">${mx.label}</button>`).join('');

  return`<div style="padding:8px 0 4px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
      <button class="btn btn-gray btn-sm" id="btn-bk-ranking">← 戻る</button>
      <div style="font-size:16px;font-weight:700;">🏅 ${type==='team'?'チーム':'個人'}${vs.rankCumulOnly?'の通算':''}ランキング</div>
    </div>
    ${modeTabs}
    <div class="card" style="padding:12px;margin-bottom:12px;">
      <div style="font-size:13px;color:#6b7280;margin-bottom:8px;">指標を選択（タップで読み込み）</div>
      <div style="display:flex;flex-wrap:wrap;">${metricBtns}</div>
    </div>
    ${vs.rankMetric?`<div style="font-size:14px;font-weight:600;color:#374151;margin-bottom:8px;">【${m.label}】ランキング</div>`:''}
    ${bodyHtml}
  </div>`;
}

function getEventName(eventCode){
  // eventCodeは "01_0601" 形式。AD.tournamentsはvenueCode="01",eventCode="0601"を持つ
  const parts=eventCode.split('_');
  let tour=null;
  if(parts.length>=2){
    // 01_0601 → venueCode=01, eventCode=0601
    tour=AD.tournaments&&AD.tournaments.find(t=>t.venueCode===parts[0]&&t.eventCode===parts[1]);
  }
  if(!tour){
    // フォールバック：eventCodeのみで検索
    tour=AD.tournaments&&AD.tournaments.find(t=>t.eventCode===eventCode||t.eventCode===parts[parts.length-1]);
  }
  return tour?tour.eventName:eventCode;
}

function generateQRPrintPage(venueId, eventId, courtCount, matchCount, customLabels){
  // カスタムラベルが空なら「第N試合」をデフォルトにする
  const getLabel=(m)=>{
    const custom=(customLabels&&customLabels[m-1])||'';
    return custom.trim()||('第'+m+'試合');
  };

  // 1ページあたり最大10個、超える場合はページを分割
  const PER_PAGE=10;

  // コートごとのHTMLを生成
  let pagesHtml='';
  for(let c=1;c<=courtCount;c++){
    const courtStr=String(c).padStart(3,'0');
    // 10個以内ならそのまま1ページ、超えるなら複数ページに分割
    const totalMatches=matchCount;
    const pageCount=Math.ceil(totalMatches/PER_PAGE);
    for(let pg=0;pg<pageCount;pg++){
      const startM=pg*PER_PAGE+1;
      const endM=Math.min((pg+1)*PER_PAGE,totalMatches);
      let itemsHtml='';
      for(let m=startM;m<=endM;m++){
        const matchStr=String(m).padStart(2,'0');
        const plainId=`${venueId}_${eventId}_${matchStr}_${courtStr}`;
        const qrText=`${APP_BASE_URL}#/m/${plainId}`; // カメラアプリからも開けるURLを埋め込む
        itemsHtml+=`<div class="qr-item">
          <div class="qr-code" id="qr-${c}-${m}" data-text="${qrText}"></div>
          <div class="qr-label">${getLabel(m)}</div>
          <div class="qr-id">${plainId}</div>
        </div>`;
      }
      const pageLabel=pageCount>1?` (${pg+1}/${pageCount})`:'' ;
      pagesHtml+=`<div class="page-break">
        <div class="page-header">
          <h1>コート ${courtStr}${pageLabel}</h1>
          <div class="page-sub">${venueId}_${eventId} &nbsp;|&nbsp; ${totalMatches}試合</div>
        </div>
        <div class="qr-grid">${itemsHtml}</div>
      </div>`;
    }
  }

  const html=`<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>QRコード印刷 - ${venueId}_${eventId}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #fff; }
  .no-print { padding: 16px; background: #f0f9ff; border-bottom: 1px solid #bae6fd; }
  .no-print button { padding: 10px 24px; background: #2E8B57; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-right: 10px; }
  .no-print button.close { background: #6b7280; }
  /* 10個を2列×5行に収める: A4縦(297mm)想定 */
  .page-break { padding: 12px 16px; min-height: 100vh; }
  .page-header { margin-bottom: 10px; border-bottom: 2px solid #111; padding-bottom: 6px; }
  .page-header h1 { font-size: 22px; font-weight: 800; }
  .page-sub { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .qr-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .qr-item { display: flex; flex-direction: column; align-items: center; padding: 8px 6px 6px; border: 1px solid #e5e7eb; border-radius: 8px; }
  .qr-code { margin-bottom: 4px; }
  .qr-code img { display: block; }
  .qr-label { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .qr-id { font-size: 10px; color: #9ca3af; font-family: monospace; }
  @media print {
    .no-print { display: none !important; }
    .page-break { page-break-after: always; padding: 8px 12px; min-height: auto; }
    .page-break:last-child { page-break-after: avoid; }
    .page-header { margin-bottom: 8px; }
    .qr-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .qr-item { padding: 6px 4px 4px; }
    .qr-label { font-size: 13px; }
    .qr-id { font-size: 9px; }
  }
</style>
</head>
<body>
<div class="no-print">
  <button onclick="window.print()">🖨️ 印刷する</button>
  <button class="close" onclick="window.close()">閉じる</button>
  <span style="font-size:13px;color:#374151;">${venueId}_${eventId} &nbsp;|&nbsp; ${courtCount}コート × ${matchCount}試合 = ${courtCount*matchCount}個のQRコード</span>
</div>
${pagesHtml}
<script>
  // QRコードを一括生成（10個対応: 128×128px）
  document.querySelectorAll('.qr-code[data-text]').forEach(el=>{
    new QRCode(el, {
      text: el.dataset.text,
      width: 128,
      height: 128,
      correctLevel: QRCode.CorrectLevel.M
    });
  });
<\/script>
</body>
</html>`;

  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);

}

  const tr=(tour.tourneyRules||[]).find(r=>r.code===tourneyCode);
  const rr=(tour.roundRules||[]).find(r=>r.matchCode===matchCode&&r.tourneyCode===tourneyCode)||(tour.roundRules||[])[0];
  const matchRuleName=mr?mr.name||mr.code:'';
  const tourneyRuleName=tr?tr.name||tr.code:'';
  const roundRuleName=rr?rr.name||rr.code:'';
  const fmtName=fl();

  // 画像化用も画面と同じ配色（A=水色系 / B=イエロー系）に統一
  const LB=['#E3F4FD','#FFF6D9'];
  const LT=['#0B5E7D','#7A5B00'];

  // 各セットのHTMLを生成（画面表示と同じ buildSS をそのまま使う）
  // buildSS が使うCSSクラスのスタイルを画像化用にインライン展開するための style
  const ssStyle=`<style>
    .ss-wrap{overflow:visible;}
    .ss-tbl{border-collapse:collapse;width:100%;}
    .ss-tbl th,.ss-tbl td{border:1px solid #bbb;text-align:center;vertical-align:middle;padding:5px 6px;color:#111;}
    .ss-tbl th{background:#f3f4f6;font-size:13px;font-weight:600;}
    .turn-col{width:26px;font-size:13px;color:#888;background:#f8f8f8;}
    .mbr-th{writing-mode:vertical-rl;text-orientation:upright;font-size:13px;width:22px;min-width:22px;max-width:22px;padding:8px 2px;white-space:nowrap;letter-spacing:1px;}
    .tot-th{font-size:13px;min-width:38px;}
    .sc-cell{font-size:14px;min-width:34px;padding:5px 6px;}
    .tot-cell{font-size:14px;font-weight:600;min-width:38px;background:#fafaf6;padding:5px 6px;}
    .team-hdr{font-size:14px;font-weight:600;padding:7px 8px;}
  </style>`;

  function buildSetHtml(cset, si){
    const sl=S.fmt==='round2'?`${si+1}セット目`:`第${si+1}セット`;
    // 勝者表示
    let resultHtml='';
    if(cset.wid!=null){
      resultHtml=`<div style="padding:5px 8px;background:#f8fafc;border:1px solid #bbb;border-top:none;text-align:center;font-size:12px;font-weight:700;color:#111;">${S.teams[cset.wid].name} 勝利</div>`;
    } else if(cset.draw){
      resultHtml=`<div style="padding:5px 8px;background:#f8fafc;border:1px solid #bbb;border-top:none;text-align:center;font-size:12px;font-weight:700;color:#111;">引き分け</div>`;
    }

      <div style="background:#f8fafc;padding:5px 10px;font-size:12px;font-weight:700;border:1px solid #bbb;border-bottom:none;text-align:center;color:#111;">${sl}</div>
      ${buildSS(cset,false,si)}
      ${resultHtml}
    </div>`;
  }

  const setsHtml=S.sets.map((cset,si)=>buildSetHtml(cset,si)).join('');

  const container=document.createElement('div');
  container.style.cssText='position:fixed;top:-99999px;left:0;background:#fff;padding:16px;font-family:-apple-system,sans-serif;';

  const infoBadge=(icon,text)=>text?`<span style="background:#f8fafc;padding:2px 8px;border-radius:99px;border:1px solid #e5e7eb;font-size:12px;">${icon} ${text}</span>`:'';
  const headerHtml=`<div style="margin-bottom:12px;border-bottom:2px solid #111;padding-bottom:8px;">

      ${infoBadge('📋',fmtName)}

  </div>`;

  container.innerHTML=`${ssStyle}${headerHtml}<div style="display:flex;gap:10px;align-items:flex-start;">${setsHtml}</div>`;

  try{
    await ensureHtml2canvas_();   // 【2026-10-26】使うときだけ読む
    const canvas=await Promise.race([
      html2canvas(container,{backgroundColor:'#ffffff',scale:2,useCORS:true,logging:false,width:container.scrollWidth,height:container.scrollHeight}),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('タイムアウト（10秒）')),10000))
    ]);
    const date=new Date().toISOString().slice(0,10);
    const fileName=`scoresheet_${matchId||date}.png`;
    await new Promise((resolve,reject)=>{
      canvas.toBlob(async(blob)=>{
        if(!blob){reject(new Error('Blob生成失敗'));return;}

          const file=new File([blob],fileName,{type:'image/png'});

            setTimeout(()=>URL.revokeObjectURL(url),5000);
            alert('✅ スコアシートを保存しました');
          }
          resolve();
        }catch(e){reject(e);}
      },'image/png');
    });
  }catch(e){
    if(e.name==='AbortError')return;
    alert('❌ 保存に失敗しました: '+e.message);
  }finally{
    document.body.removeChild(container);
  }
}

function ssTeamBlockHtml(ss,compact){
  const mode=ss.mode||'select';
  const tab=(v,l)=>`<button class="ss-mode-tab" data-mode="${v}" style="flex:1;padding:${compact?'8px':'9px'} 4px;font-size:${compact?12:13}px;font-weight:700;border:none;border-radius:8px;background:${mode===v?'#F2B705':'#f3f4f6'};color:${mode===v?'#3a2c00':'#6b7280'};cursor:pointer;">${l}</button>`;
  const lt=findTourByScoreEvent(ss.eventCode);
  /* ここは「大会を選ぶ」画面なので、開催中の大会ではなく
     選ばれた大会がシングルスかどうかで呼び方を決める。
     その大会をまだ読み込んでいない端末では lt が見つからず、
     これまでどおり「チーム」と表示される（＝チーム戦扱い）。 */
  const sW=wTeam(lt||null);
  const teams=((lt&&lt.teams)||[]).slice().sort((a,b)=>parseInt(a.id,10)-parseInt(b.id,10));
  let inner;

        <select id="ss-team-select" style="font-size:${compact?13:15}px;margin-bottom:${compact?10:12}px;">
          <option value="">-- ${sW}を選択 --</option>
          ${teams.map(t=>`<option value="${t.id}" ${String(ss.teamNo||'')===String(t.id)?'selected':''}>No.${t.id}　${t.name}</option>`).join('')}
        </select>`
      :`<div style="font-size:12px;color:#92400e;background:#FFF7ED;border:1px solid #fed7aa;border-radius:8px;padding:8px 10px;margin-bottom:${compact?10:12}px;">この大会の${sW}一覧データがないため、「${sW}Noで入力」をご利用ください</div>`;
  }else{
    inner=`<div style="font-size:${compact?12:13}px;color:#6b7280;margin-bottom:4px;font-weight:600;">${sW}No</div>
      <input type="text" id="ss-team-no" value="${ss.teamNo||''}" placeholder="例: 073" style="font-size:14px;margin-bottom:${compact?10:12}px;"/>`;

  return`<div style="display:flex;gap:8px;margin-bottom:10px;">${tab('select',sW+'名から選ぶ')}${tab('no',sW+'Noで入力')}</div>${inner}`;
}

function rScoreView(){
  const ss=_scoreState;
  if(ss.loading){
    return`<div style="padding:8px 0 4px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
        <button class="btn btn-gray btn-sm" id="btn-bk-score-view">← 戻る</button>
        <div style="font-size:16px;font-weight:700;">スコアシート</div>
      </div>
      <div style="text-align:center;padding:48px;color:#6b7280;"><div style="font-size:24px;">⏳</div><div>読み込み中...</div></div>
    </div>`;
  }
  /* ★ここは以前「戻る」ボタンが無く、行き止まりになっていた。
     投擲データの無い試合を開くと、アプリをいったん消すまで先へ進めなかった。
     読み込み中の画面と同じ見出し（戻るボタン付き）を出すようにした。
     ボタンのidは読み込み中の画面と同じなので、押したときの動きは共通で効く。 */
  const ssEmpty_=(msg)=>`<div style="padding:8px 0 4px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
      <button class="btn btn-gray btn-sm" id="btn-bk-score-view">← 戻る</button>
      <div style="font-size:16px;font-weight:700;">スコアシート</div>
    </div>
    <div style="text-align:center;padding:40px 20px;">
      <div style="font-size:30px;margin-bottom:10px;">📭</div>
      <div style="font-size:15px;color:#6b7280;">${msg}</div>
      <div style="font-size:12.5px;color:#9ca3af;margin-top:10px;line-height:1.7;">左上の「← 戻る」で試合一覧にもどれます。</div>
    </div>
  </div>`;
  if(!ss.scoreData)return ssEmpty_('スコアシートを読み込めませんでした');

  // 【8-8】matchId はデータに入っていないことがあるので、選んだ試合のものを使う（見出しに undefined と出ていた）
  const {rows,teams,matchId}=ss.scoreData;
  if(!rows||rows.length===0)return ssEmpty_('この試合の投擲データはありません');

  // セット数を特定
  const setNos=[...new Set(rows.map(r=>r.setNo))].sort((a,b)=>a-b);

  // チーム情報
  const teamA=teams&&teams[0]?teams[0]:null;
  const teamB=teams&&teams[1]?teams[1]:null;

  // セットごとにスコアシートを生成
  const setsHtml=setNos.map(setNo=>{
    const setRows=rows.filter(r=>r.setNo==setNo);
    // 先攻チームを特定
    const firstRow=setRows.find(r=>r.first==1||r.first==='1');
    const fTeamNo=firstRow?firstRow.teamNo:'';
    const fTeam=teams?teams.find(t=>String(t.teamNo).padStart(3,'0')===String(fTeamNo).padStart(3,'0'))||teams[0]:null;
    const sTeam=teams?teams.find(t=>t!==fTeam)||teams[1]:null;

    // 先攻・後攻のメンバーリスト（登場順）
    const getMbrs=(teamNo)=>{
      const tRows=setRows.filter(r=>String(r.teamNo).padStart(3,'0')===String(teamNo).padStart(3,'0'));
      const seen=new Set();const list=[];
      tRows.forEach(r=>{if(!seen.has(r.name)){seen.add(r.name);list.push(r.name);}});
      return list.length?list:[''];
    };
    const fNo=fTeam?fTeam.teamNo:'';
    const sNo=sTeam?sTeam.teamNo:'';
    const fMbrs=getMbrs(fNo);
    const sMbrs=getMbrs(sNo);

    // ターン数の最大値
    const maxTurn=Math.max(...setRows.map(r=>Number(r.turnNum)||0));

    // ターンごとの投擲データ
    const fThrows={},sThrows={};
    setRows.forEach(r=>{
      const turn=Number(r.turnNum);
      const key=String(r.teamNo).padStart(3,'0');
      const isFTeam=key===String(fNo).padStart(3,'0');
      const bucket=isFTeam?fThrows:sThrows;
      if(!bucket[turn])bucket[turn]=[];
      bucket[turn].push(r);
    });

    // 累計点追跡
    const fCumul={},sCumul={};
    const getLastCumul=(bucket,turn)=>{
      for(let t=turn;t>=1;t--){if(bucket[t]&&bucket[t].length)return bucket[t][bucket[t].length-1].cumul;}
      return 0;
    };

    /* ★8-5 / 1-3：セットの点数の読み取り方を直した。
       Supabase からは「setPts」という【並び】で届く（1セット目, 2セット目, …）。
       8-4 までは「set1pts」という【名前】で探していたため何も見つからず、
       どのセットも 0 対 0 と読めて、すべて「引き分け」と表示されていた。
       ※ 念のため、スプレッドシート時代の古い名前も読めるようにしてある。 */
    const setPtOf=(t)=>{
      if(!t)return null;
      let v;
      if(Array.isArray(t.setPts)) v=t.setPts[setNo-1];
      else v=t[`set${setNo}pts`];
      return (v===null||v===undefined||v==='')?null:Number(v);
    };
    const fPts=setPtOf(fTeam);
    const sPts=setPtOf(sTeam);

    /* ★3ミス（失格）でセットが終わったときの見せ方。
       失格した側は 0点、相手は 50点 として記録されているが、
       投擲の積み上げ（合計欄）は、その手前の数字のまま残っている。
         ・失格した側 … 最後のターンの合計欄を 0 にする
         ・相手側     … 積み上げは書き換えず、1行下に 50 を出す
       判定は「記録されたセット点数」と「積み上げの最後の数字」のズレで見る。
       ふつうに 50点で上がったセットは一致するので、何も起こらない。 */
    const lastTurnOf=(bucket)=>{let last=0;for(let t=1;t<=maxTurn;t++){if(bucket[t]&&bucket[t].length)last=t;}return last;};
    const lastCumulOf=(bucket)=>{const t=lastTurnOf(bucket);return t?Number(bucket[t][bucket[t].length-1].cumul):null;};
    const fLastTurn=lastTurnOf(fThrows), sLastTurn=lastTurnOf(sThrows);
    const fLastCumul=lastCumulOf(fThrows), sLastCumul=lastCumulOf(sThrows);
    const fZero =(fPts===0 &&fLastCumul!==null&&fLastCumul>0);
    const sZero =(sPts===0 &&sLastCumul!==null&&sLastCumul>0);
    const fFifty=(fPts===50&&fLastCumul!==null&&fLastCumul<50);
    const sFifty=(sPts===50&&sLastCumul!==null&&sLastCumul<50);

    let rows2='';
    for(let t=1;t<=maxTurn;t++){
      const fT=fThrows[t]||[];const sT=sThrows[t]||[];
      // 名前で一致させて正しい列に配置
      const dispTh=(th)=>{
        if(!th)return`<td style="padding:2px 3px;border:1px solid #bbb;min-width:22px;"></td>`;
        const sc=Number(th.pts);const aimed=th.aimed==1||th.aimed==='1';
        const disp=aimed?`<svg width="18" height="18" viewBox="0 0 22 22" style="vertical-align:middle;"><circle cx="11" cy="11" r="10" fill="none" stroke="#111" stroke-width="1.5"/><text x="11" y="15.5" text-anchor="middle" font-size="10" font-family="-apple-system,sans-serif" fill="#111">${sc}</text></svg>`:(sc===0?`<span style="font-size:11px;font-weight:600;">—</span>`:`<span style="font-size:11px;font-weight:600;">${sc}</span>`);
        return`<td style="padding:2px 3px;border:1px solid #bbb;text-align:center;">${disp}</td>`;
      };
      const fCols=fMbrs.map(m=>dispTh(fT.find(th=>th.name===m)));
      const sCols=sMbrs.map(m=>dispTh(sT.find(th=>th.name===m)));
      let fTot=fT.length?fT[fT.length-1].cumul:'';
      let sTot=sT.length?sT[sT.length-1].cumul:'';
      // ★3ミスで失格した側は、最後のターンの合計欄を 0 にする
      if(fZero&&t===fLastTurn)fTot=0;
      if(sZero&&t===sLastTurn)sTot=0;
      rows2+=`<tr>
        <td style="padding:2px 3px;border:1px solid #bbb;font-size:11px;text-align:center;color:#6b7280;">${t}</td>
        ${fCols.join('')}
        <td style="padding:2px 3px;border:1px solid #bbb;border-right:2.5px solid #aaa;font-size:11px;font-weight:600;text-align:center;">${fTot}</td>
        ${sCols.join('')}
        <td style="padding:2px 3px;border:1px solid #bbb;font-size:11px;font-weight:600;text-align:center;">${sTot}</td>
      </tr>`;
    }

    // ★3ミスで勝った側の「50」を、合計欄の1行下に出す
    if(fFifty||sFifty){
      const blanks=(n)=>new Array(n).fill('<td style="padding:2px 3px;border:1px solid #bbb;"></td>').join('');
      const fifty=(on,extra)=>`<td style="padding:2px 3px;border:1px solid #bbb;${extra}font-size:11px;font-weight:700;text-align:center;">${on?50:''}</td>`;
      rows2+=`<tr>
        <td style="padding:2px 3px;border:1px solid #bbb;"></td>
        ${blanks(fMbrs.length)}
        ${fifty(fFifty,'border-right:2.5px solid #aaa;')}
        ${blanks(sMbrs.length)}
        ${fifty(sFifty,'')}
      </tr>`;
    }

    const mhdr=(mbrs)=>mbrs.map(m=>`<th style="padding:2px 2px;border:1px solid #bbb;font-size:10px;background:#f8fafc;min-width:18px;"><div style="display:flex;flex-direction:column;align-items:center;">${[...m].map(c=>`<span style="line-height:1.3;font-size:10px;">${c}</span>`).join('')}</div></th>`).join('');
    const sl=`第${setNo}セット`;

    // 勝者（★セット点数は上で読み取り済み）
    const fv=fPts===null?0:fPts, sv=sPts===null?0:sPts;
    const winner=fv>sv?fTeam:sv>fv?sTeam:null;
    const resultHtml=winner?`<div style="padding:5px 8px;background:#f8fafc;border-top:1px solid #bbb;text-align:center;font-size:12px;font-weight:700;color:#111;">${winner.teamName} 勝利</div>`:`<div style="padding:5px 8px;background:#f8fafc;border-top:1px solid #bbb;text-align:center;font-size:12px;font-weight:700;color:#111;">引き分け</div>`;

    return`<div style="margin-bottom:16px;border:1px solid #bbb;border-radius:6px;overflow:hidden;">
      <div style="background:#f8fafc;padding:5px 10px;font-size:13px;font-weight:700;border-bottom:1px solid #bbb;text-align:center;">${sl}</div>
      <div style="overflow-x:auto;">
        <table style="border-collapse:collapse;width:100%;">
          <thead>
            <tr>
              <th style="padding:3px;border:1px solid #bbb;background:#f8fafc;"></th>
              <th colspan="${fMbrs.length}" style="padding:3px;border:1px solid #bbb;border-right:2.5px solid #aaa;background:#f8fafc;font-size:12px;">${fTeam?fTeam.teamName:''}</th>
              <th style="padding:3px;border:1px solid #bbb;border-right:2.5px solid #aaa;background:#f8fafc;font-size:11px;">計</th>
              <th colspan="${sMbrs.length}" style="padding:3px;border:1px solid #bbb;background:#f8fafc;font-size:12px;">${sTeam?sTeam.teamName:''}</th>
              <th style="padding:3px;border:1px solid #bbb;background:#f8fafc;font-size:11px;">計</th>
            </tr>
            <tr>
              <th style="border:1px solid #bbb;background:#f8fafc;"></th>
              ${mhdr(fMbrs)}
              <th style="padding:3px;border:1px solid #bbb;border-right:2.5px solid #aaa;background:#f8fafc;font-size:10px;">計</th>
              ${mhdr(sMbrs)}
              <th style="padding:3px;border:1px solid #bbb;background:#f8fafc;font-size:10px;">計</th>
            </tr>
          </thead>
          <tbody>${rows2}</tbody>
        </table>
      </div>
      ${resultHtml}
    </div>`;
  }).join('');

  const m=ss.selectedMatch;
  return`<div style="padding:8px 0 4px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
      <button class="btn btn-gray btn-sm" id="btn-bk-score-view">← 戻る</button>
      <div style="font-size:16px;font-weight:700;">📋 スコアシート</div>
    </div>
    <div style="font-size:13px;color:#6b7280;margin-bottom:8px;">
      ${m?m.teamName:''} &nbsp;|&nbsp; ${matchId||(m&&m.matchId)||''}
    </div>
    ${setsHtml}
  </div>`;
}

// ===== ルールテンプレート =====
/* 【2026-10-26】テンプレートに一緒に入れる設定。
   トーナメント表の設定・交流戦の参加申請・予選順位による進出先を「大会ルール設定」の中へ移したので、
   テンプレートにも一緒に保存・読み込みする。
   この設定が入っていない古いテンプレートを読み込んだときは、大会の今の設定をそのまま残す。 */
const TPL_EXTRA_KEYS_=['bracket1Name','bracketTeamCount','bracket2Name','bracket2TeamCount','exhibition','advanceRules'];
function tplExtrasFromTour_(tour){
  const o={};
  TPL_EXTRA_KEYS_.forEach(k=>{if(tour&&tour[k]!==undefined&&tour[k]!==null)o[k]=JSON.parse(JSON.stringify(tour[k]));});
  return o;
}
function applyTplExtras_(tour,tpl){
  TPL_EXTRA_KEYS_.forEach(k=>{if(tpl&&tpl[k]!==undefined&&tpl[k]!==null)tour[k]=JSON.parse(JSON.stringify(tpl[k]));});
}
/* 【2026-10-26】テンプレートをファイルに書き出す／ファイルから読み込む。
   テンプレートはその端末の中にしか保存されないので、ほかの端末やほかのアプリ
   （ブラウザアプリ 8-7〜 ⇄ ストアアプリ 1-6〜）へは、このファイルで渡す。
   ファイルの形は JSON（中身が入れ子になっているので CSV では表せないため）。 */
function exportRuleTemplates_(){
  const tpls=AD.ruleTemplates||[];
  if(!tpls.length){alert('書き出すテンプレートがありません。');return;}
  const body=JSON.stringify({kind:'mmoss-rule-templates',version:1,exportedAt:new Date().toISOString(),templates:tpls},null,2);
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const name='MMOSS_試合設定テンプレート_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+'.json';
  try{
    const blob=new Blob([body],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();

function importRuleTemplates_(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json,text/plain';
  inp.onchange=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    let data=null;
    try{data=JSON.parse(await file.text());}catch(err){}
    const list=Array.isArray(data)?data:(data&&Array.isArray(data.templates)?data.templates:(data&&typeof data==='object'?[data]:[]));
    const ok=list.filter(t=>t&&typeof t==='object'&&(Array.isArray(t.matchRules)||Array.isArray(t.tourneyRules)||Array.isArray(t.roundRules)));
    if(!ok.length){alert('テンプレートが見つかりませんでした。\n「📤 ファイルに書き出す」で作ったファイルを選んでください。');return;}
    const names=ok.slice(0,15).map(t=>'・'+(t.name||'（名称未設定）')).join('\n')+(ok.length>15?'\n…ほか'+(ok.length-15)+'件':'');
    if(!confirm(ok.length+'件のテンプレートを読み込みます。\n\n'+names+'\n\n前に同じファイルから読み込んだテンプレートがあれば、新しい内容で上書きします。\nよろしいですか？'))return;
    if(!AD.ruleTemplates)AD.ruleTemplates=[];
    let added=0,replaced=0;
    ok.forEach((t,i)=>{
      const c=JSON.parse(JSON.stringify(t));
      if(!c.name)c.name='（名称未設定）';
      const at=c.id?AD.ruleTemplates.findIndex(x=>x.id===c.id):-1;
      if(at>=0){AD.ruleTemplates[at]=c;replaced++;}
      else{if(!c.id)c.id='tpl_'+Date.now()+'_'+i;AD.ruleTemplates.push(c);added++;}
    });
    saveAdmin(AD);render();
    alert('✅ 読み込みました（新しく追加 '+added+'件／上書き '+replaced+'件）');
  };
  inp.click();
}

async function publishActiveEvent(eventCode){
  if(!AD.githubPat||!AD.githubPat.startsWith('ghp_')){
    alert('GitHub Personal Access Tokenが設定されていません。');
    return false;
  }
  const jsonBody=JSON.stringify({activeEventCode:eventCode},null,2);
  const apiUrl='https://api.github.com/repos/longbeachknit/molkkymania-deta/contents/active.json';
  try{
    let sha=null;
    // ?t=Date.now() でCDNキャッシュをバイパスし、常に最新のSHAを取得する（古いSHAだとPUTが409で失敗するため）
    const getRes=await fetch(apiUrl+'?t='+Date.now(),{headers:{'Authorization':'token '+AD.githubPat},cache:'no-store'});
    if(getRes.ok){const d=await getRes.json();sha=d.sha;}
    const body={
      message: eventCode?'Set active event: '+eventCode:'Stop broadcast',
      content: btoa(unescape(encodeURIComponent(jsonBody)))
    };
    if(sha)body.sha=sha;
    const res=await fetch(apiUrl,{
      method:'PUT',
      headers:{'Authorization':'token '+AD.githubPat,'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    return res.ok;
  }catch(e){
    console.error('active.json配信エラー:',e);
    return false;
  }
}

let _liveMemo=null,_liveMemoTs=0;
function clearLiveMemo(){_liveMemo=null;_liveMemoTs=0;}
async function fetchActiveEvent(){
  // 【1-2】30秒以内に同じ問い合わせが来たら、その答えを使い回す。
  //   （試合開始・コート検索など複数の画面から呼ばれるため、まとめて節約できる）
  if(_liveMemo&&(Date.now()-_liveMemoTs)<30000)return _liveMemo;
  // 1回の取得処理
  const doFetch=async()=>{
    // 開催中リストはデータベースから取得する。複数行に対応（同じ日に別会場でもOK）。
    const url=SB_URL+'/rest/v1/live_events?select=event_key,venue_code,event_code,label,sort_order&order=sort_order';
    const res=await fetch(url,{cache:'no-store',headers:sbHeaders()});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const rows=await res.json();
    const first=(rows&&rows[0])||null;
    return {
      activeEventCode: first?String(first.event_code||''):'',
      activeEventKey:  first?String(first.event_key||''):'',
      liveEvents:      rows||[]
    };
  };
  let out=null;
  try{
    out=await doFetch();
  }catch(e1){
    // 1回目失敗 → 0.5秒待って再試行（一時的な通信エラー対策）
    await new Promise(r=>setTimeout(r,500));
    try{ out=await doFetch(); }
    catch(e2){ console.warn('開催中リストの取得に失敗:',e2); return null; }
  }
  _liveMemo=out;_liveMemoTs=Date.now();
  return out;
}

/* 【1-5・8-7にそろえた】開催前（次）の大会のリストを取りに行く。
   開催中リスト（live_events）とは別の表（upcoming_events）。いくつでも入る。
   ※古い版（1-4 まで）のアプリは live_events しか読まないので、
     ここに入れた大会が古い版で「開催中」に見えてしまうことはない。
   通信に失敗したら null（＝前回のカードをそのまま残す）。 */
let _upMemo=null,_upMemoTs=0;
function clearUpcomingMemo(){_upMemo=null;_upMemoTs=0;}
async function fetchUpcomingEvents(){
  if(_upMemo&&(Date.now()-_upMemoTs)<30000)return _upMemo;
  const doFetch=async()=>{
    const url=SB_URL+'/rest/v1/upcoming_events?select=event_key,venue_code,event_code,label,sort_order&order=sort_order';
    const res=await fetch(url,{cache:'no-store',headers:sbHeaders()});
    if(!res.ok)throw new Error('HTTP '+res.status);
    return (await res.json())||[];
  };
  let out=null;
  try{ out=await doFetch(); }
  catch(e1){
    await new Promise(r=>setTimeout(r,500));
    try{ out=await doFetch(); }
    catch(e2){ console.warn('開催前リストの取得に失敗:',e2); return null; }
  }
  _upMemo=out;_upMemoTs=Date.now();
  return out;
}

/* 【1-5】開催前（次）の大会リストを Supabase に書き込む（配信キーが必要）。
   keys は「会場コード_大会コード」の並び。空なら全部解除。 */
async function publishUpcomingEvents(keys){
  const key=String(AD.sbSyncKey||'').trim();
  if(!key)return {ok:false,reason:'nokey'};
  const rows=(keys||[]).map((k,i)=>{
    const p=String(k).split('_');
    const t=(AD.tournaments||[]).find(x=>((x.venueCode?x.venueCode+'_':'')+x.eventCode)===k);
    return{event_key:k,venue_code:p[0]||'',event_code:p.slice(1).join('_')||'',
           label:(t&&(t.displayName||t.eventName))||'',sort_order:i};
  });
  try{
    const res=await fetch(SB_URL+'/rest/v1/rpc/set_upcoming_events',{
      method:'POST',
      headers:{'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({p_key:key,p_rows:rows})});
    if(res.ok){clearUpcomingMemo();return {ok:true};}
    const t=await res.text();
    return {ok:false,reason:(t.indexOf('合言葉')>=0?'badkey':'http'),status:res.status};
  }catch(e){ return {ok:false,reason:'net'}; }
}

// 修正②：hasOwnProperty で空文字("")を正しく判定し、falsyバグを解消
// リモート取得成功時は必ずその値（空文字含む）を使用する
// リモート取得失敗（ネットワークエラー等）時のみ localStorage のコードにフォールバック
async function resolveActiveEventCode(){
  const remote=await fetchActiveEvent();
  if(remote){
    // 【1-2】開催中が複数あるときは、ホームで選んだ大会を使う。
    //   1つだけなら今までどおり自動で決まる。未選択で複数のときは null（＝ホームで選んでもらう）。
    const row=pickLiveRow(remote.liveEvents||[]);
    return row?String(row.event_code||''):null;
  }
  // ネットワークエラー等でremoteがnullの場合のみ localStorage のコードにフォールバック
  console.warn('resolveActiveEventCode: リモート取得失敗、localStorageにフォールバック');
  return AD.activeEventCode||null;
}

    });
    if(res.ok){
      const sbMsg=await publishSettingsToSb_(tour,payload);   // 【1-6】Supabase にも直接書く
      if(!silent)alert('✅ 配信完了！\n参加者が次回アクセス時に自動で設定が反映されます。'+sbMsg);
      return true;
    } else {
      const err=await res.json();
      if(!silent)alert('❌ 配信失敗: '+(err.message||res.status));
      return false;
    }
  }catch(e){
    if(!silent)alert('❌ エラー: '+e.message);
    return false;
  }finally{
    if(btn){btn.disabled=false;btn.textContent='📡 設定を配信する';}
  }
}

/* ===== 【1-6】大会設定・会場を Supabase にも直接書く =====
   「設定を配信する」「会場を配信」で GitHub に置いたあと、Supabase の event_docs／venue_docs にも直接書く。
   ストアアプリはここを読むので、コピーの道具（sync）を待たずに届く。合言葉は「配信キー」（開催中リストと同じ）。
   ★会場マップの画像は Supabase に入れない。
     画像は app.molkky.co.jp の置き場所（GitHub の molkkymania_app/maps/）に画像ファイルとして置き、
     Supabase には画像の住所（mapImageUrl）だけを書く。アプリは画像を GitHub から直接読む。
     ファイル名は画像の中身から作る（コピーの道具と同じ決め方）ので、同じ画像は二重に置かれない。 */
const MAP_REPO_='longbeachknit/molkkymania_app';
const MAP_BASE_='https://app.molkky.co.jp/';
async function sha1Hex_(bytes){
  const h=await crypto.subtle.digest('SHA-1',bytes);
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
/* detail の中の mapImage（画像そのもの）を画像ファイルにして置き、住所に置き換えた写しを返す。
   置けなかったときは画像を外すだけ（前に置いた画像の住所 mapImageUrl はそのまま残す）。 */
async function splitMapForSb_(detail){
  const d=JSON.parse(JSON.stringify(detail||{}));
  const du=String(d.mapImage||'');
  delete d.mapImage;
  if(!du.startsWith('data:image/'))return {detail:d,ok:true};
  try{
    const head=du.slice(5,du.indexOf(';')),b64=du.slice(du.indexOf(',')+1);
    const ext={'image/png':'png','image/jpeg':'jpg','image/jpg':'jpg','image/webp':'webp','image/gif':'gif','image/svg+xml':'svg'}[head]||'png';
    const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const name='maps/'+(await sha1Hex_(bytes)).slice(0,16)+'.'+ext;
    const api='https://api.github.com/repos/'+MAP_REPO_+'/contents/'+name;
    const h={'Authorization':'token '+AD.githubPat,'Accept':'application/vnd.github+json'};
    const g=await fetch(api+'?t='+Date.now(),{headers:h,cache:'no-store'});
    if(!g.ok){
      const p=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},h),
        body:JSON.stringify({message:'会場マップ画像を追加',content:b64})});
      if(!p.ok)throw new Error('HTTP '+p.status);
    }
    d.mapImageUrl=MAP_BASE_+name;
    return {detail:d,ok:true};
  }catch(e){
    console.warn('会場マップ画像を置けませんでした',e);
    return {detail:d,ok:false};
  }
}
/* Supabase の書き込み窓口を呼ぶ（配信キー）。{ok, reason} */
async function sbPutRpc_(rpc,args){
  const key=String(AD.sbSyncKey||'').trim();
  if(!key)return {ok:false,reason:'nokey'};
  try{
    const res=await fetch(SB_URL+'/rest/v1/rpc/'+rpc,{method:'POST',
      headers:{'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({p_key:key},args))});
    if(res.ok)return {ok:true};
    const t=await res.text();
    return {ok:false,reason:t.indexOf('合言葉')>=0?'badkey':('http '+res.status)};
  }catch(e){return {ok:false,reason:'net'};}
}
function sbPutMsg_(r,mapOk){
  if(r.ok)return '\n✅ 新しいアプリ（Supabase）にも直接届けました。'+(mapOk?'':'\n⚠️ 会場マップの画像は置けませんでした（前の画像のまま）。GitHub Token を確かめてください。');
  if(r.reason==='nokey')return '\n⚠️ 新しいアプリ（Supabase）へは届いていません。管理画面の「📡 新アプリの開催中リスト」に配信キーを入れてから、もう一度配信してください。';
  if(r.reason==='badkey')return '\n⚠️ 新しいアプリ（Supabase）へは届いていません：配信キーが違います。';
  return '\n⚠️ 新しいアプリ（Supabase）へは届いていません（'+r.reason+'）。もう一度配信してください。';
}
async function publishSettingsToSb_(tour,payload){
  const p=JSON.parse(JSON.stringify(payload));
  let mapOk=true;
  if(p.venue&&p.venue.detail){const sp=await splitMapForSb_(p.venue.detail);p.venue.detail=sp.detail;mapOk=sp.ok;}
  const ev=String(tour.eventCode||''),vc=String(tour.venueCode||'');
  const r=await sbPutRpc_('put_event_doc',{p_event_key:(vc?vc+'_':'')+ev,p_kind:'settings',p_venue_code:vc,p_event_code:ev,p_payload:p});
  if(r.ok){try{delete _jsonCache['settings_'+ev];}catch(e){}}
  return sbPutMsg_(r,mapOk);
}
async function publishVenueToSb_(venue,payload){
  const p=JSON.parse(JSON.stringify(payload));
  const sp=await splitMapForSb_(p.detail);p.detail=sp.detail;
  const r=await sbPutRpc_('put_venue_doc',{p_venue_code:String(venue.code),p_payload:p});
  return sbPutMsg_(r,sp.ok);
}

let _lastVenueSbMsg='';
// 場所（会場）1件をGitHubに配信する。大会の publishSettings と同じ書き込み方法。
async function publishVenue(venue,opts){
  const silent=opts&&opts.silent;
  if(!venue||!venue.code){
    if(!silent)alert('場所コードが設定されていません。');
    return false;
  }
  if(!AD.githubPat||!AD.githubPat.startsWith('ghp_')){
    if(!silent)alert('GitHub Personal Access Tokenが設定されていません。\n管理者設定画面のトップで設定してください。');
    return false;
  }
  const payload={
    code: venue.code,
    name: venue.name||'',
    themeColor: venue.themeColor||'',
    detail: venue.detail||{},
    publishedAt: new Date().toISOString()
  };
  const fileName='venue_'+venue.code+'.json';
  const jsonBody=JSON.stringify(payload,null,2);
  const apiUrl='https://api.github.com/repos/longbeachknit/molkkymania-deta/contents/'+fileName;
  try{
    // 既存ファイルのSHAを取得（無ければ新規作成）
    let sha=null;
    try{
      const getRes=await fetch(apiUrl+'?t='+Date.now(),{headers:{'Authorization':'token '+AD.githubPat},cache:'no-store'});
      if(getRes.ok){const d=await getRes.json();sha=d.sha;}
    }catch(e){}
    const body={
      message:'Update '+fileName,
      content:btoa(unescape(encodeURIComponent(jsonBody)))
    };
    if(sha)body.sha=sha;
    const res=await fetch(apiUrl,{
      method:'PUT',
      headers:{'Authorization':'token '+AD.githubPat,'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(res.ok){
      // 【1-6】Supabase にも直接書く（画像は GitHub に置いて住所だけ）
      const sbMsg=await publishVenueToSb_(venue,payload);
      _lastVenueSbMsg=sbMsg;   // 呼び出し元のお知らせに添える
      if(!silent&&sbMsg.indexOf('⚠️')>=0)alert('会場を GitHub に配信しました。'+sbMsg);
    }
    return res.ok;
  }catch(e){
    if(!silent)alert('❌ エラー: '+e.message);
    return false;
  }
}
